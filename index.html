  .key.alpha { background: linear-gradient(180deg, var(--alpha-a), var(--alpha-b)); box-shadow: 0 calc(var(--kh) * .045) 0 var(--alpha-edge), 0 calc(var(--kh) * .07) calc(var(--kh) * .08) rgba(0, 0, 0, .28); }
  .key.num { background: linear-gradient(180deg, var(--num-a), var(--num-b)); color: var(--num-text); font-size: calc(var(--kh) * .36); box-shadow: 0 calc(var(--kh) * .045) 0 var(--num-edge), 0 calc(var(--kh) * .07) calc(var(--kh) * .08) rgba(0, 0, 0, .22); }

  .dp { position: absolute; inset: 0; border: 0; padding: 0; background: transparent; color: #fff; cursor: pointer; touch-action: none; }

  /* ---------- окно настроек приложения ---------- */
  .sheet { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; -webkit-user-select: none; user-select: none; }

<script>
(() => {
'use strict';
// ══════ 00-util.js — общее: ошибки, особые знаки, настройки, память калькулятора ══════

class CalcError extends Error {
  constructor(type, pos) { super(type); this.type = type; this.pos = pos; }
}
const fail = (type, pos) => { throw new CalcError(type, pos); };

// Особые знаки экрана: один символ — одно знакоместо, рисуются вручную (см. 30-lcd.js)
const G = {
  INV: '',   // ⁻¹
  NEG: '',   // минус числа — клавиша (−)
  TEN: '',   // маленькое «10» (10^x в строчном вводе)
  XRT: '',   // ˣ√
  CBRT: '',  // ³√
  FRC: '',   // ⌟ — черта дроби в строчном вводе
  EE: '',    // ᴇ — «на десять в степени»
  XBAR: '',  // x̄
  YBAR: '',  // ȳ
  RAD: '',   // ʳ
  GRA: '',   // ᵍ
  XHAT: '',  // x̂
  YHAT: '',  // ŷ
  SQ: '',    // ² — клавиша x²
  PERM: '',  // P (nPr)
  COMB: '',  // C (nCr)
  YV: '',    // Y графика: Y1, Y2…
  SXN: '',   // σ с индексом x (σx)
  BOX: '',   // пустое место шаблона
  DX: ''     // «d» в d/dx (не переменная)
};

// Настройки экрана Setup — общие для всех режимов
const S = {
  io: 'Math',        // Input/Output: Math | Line
  frac: 'd/c',       // Frac Result: d/c | ab/c
  funcType: 'Y=',    // Func Type
  drawType: 'Connect', // Draw Type: Connect | Plot
  deriv: 'Off',      // Derivative
  angle: 'Rad',      // Angle: Deg | Rad | Gra
  coord: 'On',       // Coord
  grid: 'Off',       // Grid: Off | On | Line
  axes: 'On',        // Axes: On | Off | Scale
  label: 'Off',      // Label
  disp: 'Norm',      // Display: Fix | Sci | Norm
  dispN: 1,
  graphFunc: 'On',   // Graph Func
  statWind: 'Auto',  // Stat Wind
  q1q3: 'Std',       // Q1Q3 Type: Std | OnData
  tableVar: 'Range', // Variable (Table)
  ineq: 'Union',     // Ineq Type
  simul: 'On'        // Simul Graph
};

// Переменные A–Z, r, θ
const VARS = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ', 'r', 'θ'];
const VIX = {};
VARS.forEach((n, i) => { VIX[n] = i; });
const fv = new Float64Array(VARS.length);   // значения переменных для быстрого счёта (графики)

const mem = {
  vars: {},        // имя → число {v, ex, dec}
  ans: null,       // последний ответ (число)
  listAns: null,
  matAns: null,
  lists: [],       // List 1…26: массивы чисел
  listSub: [],     // подписи списков (SUB)
  mats: {},        // Mat A…Z
  fn: []           // функции Y1…Y20 (см. 65-func.js)
};

// ══════ 10-num.js — числа: точные формы (дроби, корни, π) и вывод как на калькуляторе ══════
//
// Число — объект {v, ex, dec}:
//   v   — значение (double);
//   ex  — точная форма или null: {t: [[n, d, r], …], pi}, значение = Σ n/d·√r, а при pi — ещё ·π;
//   dec — в расчёте участвовала десятичная запись, поэтому ответ показывается десятичным.

const LIM = 9e15;
const igcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; };
const ms = (a, b) => { const p = a * b; return Math.abs(p) > LIM ? NaN : p; };   // умножение целых с защитой от переполнения

function mkTerm(n, d, r) {
  if (!Number.isFinite(n) || !Number.isFinite(d) || !Number.isFinite(r) || d === 0) return null;
  if (d < 0) { n = -n; d = -d; }
  const g = igcd(n, d) || 1;
  n /= g; d /= g;
  if (Math.abs(n) > LIM || d > LIM || r > LIM) return null;
  return [n, d, r];
}

const EX0 = () => ({ t: [], pi: false });
const exInt = (n) => (Number.isInteger(n) && Math.abs(n) <= LIM ? { t: n ? [[n, 1, 1]] : [], pi: false } : null);
const exRat = (n, d) => { const m = mkTerm(n, d, 1); return m ? { t: m[0] ? [m] : [], pi: false } : null; };
const exPi = () => ({ t: [[1, 1, 1]], pi: true });

function exVal(a) {
  let s = 0;
  for (const [n, d, r] of a.t) s += (n / d) * (r === 1 ? 1 : Math.sqrt(r));
  return a.pi ? s * Math.PI : s;
}

function exAdd(a, b) {
  if (!a || !b) return null;
  if (!a.t.length) return b;
  if (!b.t.length) return a;
  if (a.pi !== b.pi) return null;
  const t = a.t.map((x) => x.slice());
  for (const y of b.t) {
    const k = t.findIndex((x) => x[2] === y[2]);
    if (k < 0) { t.push(y.slice()); continue; }
    const m = mkTerm(ms(t[k][0], y[1]) + ms(y[0], t[k][1]), ms(t[k][1], y[1]), y[2]);
    if (!m) return null;
    t[k] = m;
  }
  const r = t.filter((x) => x[0] !== 0).sort((x, y) => x[2] - y[2]);
  if (r.length > 2) return null;
  return { t: r, pi: r.length ? a.pi : false };
}
const exNeg = (a) => (a ? { t: a.t.map(([n, d, r]) => [-n, d, r]), pi: a.pi } : null);
const exSub = (a, b) => exAdd(a, exNeg(b));

function exMul(a, b) {
  if (!a || !b) return null;
  if (!a.t.length || !b.t.length) return EX0();
  if (a.pi && b.pi) return null;
  let res = EX0();
  for (const x of a.t) for (const y of b.t) {
    const g = igcd(x[2], y[2]);
    const m = mkTerm(ms(ms(x[0], y[0]), g), ms(x[1], y[1]), ms(x[2] / g, y[2] / g));
    if (!m) return null;
    res = exAdd(res, { t: [m], pi: false });
    if (!res) return null;
  }
  const pi = a.pi || b.pi;
  if (pi && res.t.some((x) => x[2] !== 1)) return null;
  return { t: res.t, pi: res.t.length ? pi : false };
}

function exInv(a) {
  if (!a || !a.t.length || a.pi) return null;
  if (a.t.length === 1) {
    const [n, d, r] = a.t[0];
    const m = mkTerm(d, ms(n, r), r);
    return m ? { t: [m], pi: false } : null;
  }
  // 1/(p + q) = (p − q)/(p² − q²)
  const p = { t: [a.t[0]], pi: false }, q = { t: [a.t[1]], pi: false };
  const den = exSub(exMul(p, p), exMul(q, q));
  if (!den || !den.t.length) return null;
  return exMul(exSub(p, q), exInv(den));
}
const exDiv = (a, b) => (a && b && a.pi && b.pi
  ? exMul({ t: a.t, pi: false }, exInv({ t: b.t, pi: false }))      // π/π сокращается
  : exMul(a, exInv(b)));

function exPowInt(a, k) {
  if (!a || !Number.isInteger(k) || Math.abs(k) > 200) return null;
  if (k < 0) return exInv(exPowInt(a, -k));
  let res = exInt(1), base = a;
  while (k > 0 && res) {
    if (k & 1) res = exMul(res, base);
    k >>= 1;
    if (k) { base = exMul(base, base); if (!base) return null; }
  }
  return res;
}

// N = s²·r, r свободно от квадратов
function sqFree(N) {
  let s = 1, r = 1, m = N;
  for (let p = 2; p * p <= m; p += (p === 2 ? 1 : 2)) {
    let c = 0;
    while (m % p === 0) { m /= p; c++; }
    if (c) { s *= p ** (c >> 1); if (c & 1) r *= p; }
  }
  return [s, r * m];
}

function exSqrt(a) {
  if (!a || a.pi) return null;
  if (!a.t.length) return EX0();
  if (a.t.length !== 1 || a.t[0][2] !== 1) return null;
  const [n, d] = a.t[0];
  if (n < 0) return null;
  const N = ms(n, d);
  if (!(N <= 1e12)) return null;
  const [s, r] = sqFree(N);
  const m = mkTerm(s, d, r);
  return m ? { t: [m], pi: false } : null;
}

const exIsRat = (a) => !!a && !a.pi && (a.t.length === 0 || (a.t.length === 1 && a.t[0][2] === 1));
const exIsInt = (a) => exIsRat(a) && (a.t.length === 0 || a.t[0][1] === 1);
const exEq = (a, b) => { const d = exSub(a, b); return !!d && d.t.length === 0; };

// ---------- числа ----------
const R = (v, ex, dec) => ({ v, ex: ex || null, dec: !!dec });
const RI = (n) => R(n, exInt(n), false);
const RX = (ex, dec) => R(exVal(ex), ex, dec);
const r15 = (x) => (x === 0 || !Number.isFinite(x) ? x : Number(x.toPrecision(15)));
const isNum = (a) => !!a && typeof a === 'object' && typeof a.v === 'number';

// Результат «не точной» функции: целые значения от точных аргументов остаются точными (log 100 = 2)
function RF(v, exactIn, dec) {
  if (!Number.isFinite(v)) fail('Ma ERROR');
  if (exactIn) {
    const q = r15(v);
    if (Number.isInteger(q) && Math.abs(q) < 1e10) return R(q, exInt(q), dec);
  }
  return R(v, null, dec);
}

function sAdd(a, b) {
  const ex = a.ex && b.ex ? exAdd(a.ex, b.ex) : null;
  return ex ? RX(ex, a.dec || b.dec) : RF(a.v + b.v, false, a.dec || b.dec);
}
function sSub(a, b) {
  const ex = a.ex && b.ex ? exSub(a.ex, b.ex) : null;
  return ex ? RX(ex, a.dec || b.dec) : RF(a.v - b.v, false, a.dec || b.dec);
}
function sMul(a, b) {
  const ex = a.ex && b.ex ? exMul(a.ex, b.ex) : null;
  return ex ? RX(ex, a.dec || b.dec) : RF(a.v * b.v, false, a.dec || b.dec);
}
function sDiv(a, b) {
  if (b.v === 0) fail('Ma ERROR');
  const ex = a.ex && b.ex ? exDiv(a.ex, b.ex) : null;
  return ex ? RX(ex, a.dec || b.dec) : RF(a.v / b.v, false, a.dec || b.dec);
}
const sNeg = (a) => R(-a.v, exNeg(a.ex), a.dec);

// Степень вещественных чисел; отрицательное основание — только для показателя m/n с нечётным n
function fPow(a, b) {
  if (a === 0) return b > 0 ? 0 : NaN;
  if (a < 0 && !Number.isInteger(b)) {
    for (let d = 3; d <= 99; d += 2) {
      const n = b * d, rn = Math.round(n);
      if (Math.abs(n - rn) < 1e-11 * Math.max(1, Math.abs(n))) return (rn % 2 ? -1 : 1) * Math.pow(-a, b);
    }
    return NaN;
  }
  return Math.pow(a, b);
}

function sPow(a, b) {
  const dec = a.dec || b.dec;
  if (a.v === 0 && b.v <= 0) fail('Ma ERROR');
  if (a.ex && b.ex && exIsRat(b.ex)) {
    const [n, d] = b.ex.t.length ? b.ex.t[0] : [0, 1];
    if (d === 1 && Math.abs(n) <= 200) {
      const ex = exPowInt(a.ex, n);
      if (ex) return RX(ex, dec);
    } else if (d === 2 && Math.abs(n) <= 9 && a.v >= 0) {
      const ex = exPowInt(exSqrt(a.ex), n);
      if (ex) return RX(ex, dec);
    }
  }
  return RF(fPow(a.v, b.v), !!(a.ex && b.ex), dec);
}

function sSqrt(a) {
  if (a.v < 0) fail('Non-Real ERROR');
  const ex = a.ex ? exSqrt(a.ex) : null;
  return ex ? RX(ex, a.dec) : RF(Math.sqrt(a.v), !!a.ex, a.dec);
}

// Десятичная запись → число: '12.5' → 25/2 (dec), '3' → 3
function numFromLiteral(mant, exp) {
  const hasDot = mant.includes('.');
  let [ip, fp = ''] = mant.split('.');
  if (ip === '' && fp === '') { ip = '1'; }         // «ᴇ3» = 1×10³
  const digits = (ip + fp).replace(/^0+/, '') || '0';
  const e = (exp || 0) - fp.length;
  const v = Number((ip || '0') + (fp ? '.' + fp : '') + 'e' + (exp || 0));
  if (!Number.isFinite(v)) fail('Ma ERROR');
  let ex = null;
  if (digits.length <= 15) {
    const m = Number(digits);
    if (e >= 0 && e <= 15) ex = exInt(m * 10 ** e);
    else if (e < 0 && e >= -15) ex = exRat(m, 10 ** -e);
  }
  return R(ex ? exVal(ex) : v, ex, hasDot);
}

// Приближение дробью (для S⇔D, когда точной формы нет)
function ratApprox(v) {
  if (!Number.isFinite(v) || Math.abs(v) > 1e10) return null;
  const neg = v < 0, x0 = Math.abs(v);
  if (Number.isInteger(x0)) return exInt(v);
  let h1 = 1, h0 = 0, k1 = 0, k0 = 1, x = x0;
  for (let i = 0; i < 40; i++) {
    const a = Math.floor(x);
    const h = a * h1 + h0, k = a * k1 + k0;
    if (h > 1e10 || k > 1e9) return null;
    h0 = h1; h1 = h; k0 = k1; k1 = k;
    if (Math.abs(h / k - x0) <= 4e-15 * Math.max(1, x0)) {
      if (String(h).length + String(k).length > 9) return null;
      return exRat(neg ? -h : h, k);
    }
    const f = x - a;
    if (f < 1e-13) return null;
    x = 1 / f;
  }
  return null;
}

// ---------- десятичный вывод ----------
// Строка в знаках экрана: «−», «.», цифры, G.EE, «+»
function fmtNum(v, opt) {
  const disp = (opt && opt.disp) || S.disp, dn = opt && opt.dispN !== undefined ? opt.dispN : S.dispN;
  if (!Number.isFinite(v)) fail('Ma ERROR');
  if (v === 0) v = 0;
  const neg = v < 0 ? '−' : '';
  const a = Math.abs(v);
  const sci = (digits, trim) => {
    let [m, e] = a.toExponential(Math.max(0, digits - 1)).split('e');
    if (trim && m.includes('.')) m = m.replace(/0+$/, '').replace(/\.$/, '');
    const en = Number(e);
    return neg + m + G.EE + (en < 0 ? '−' : '+') + String(Math.abs(en)).padStart(2, '0');
  };
  if (disp === 'Sci') return sci(dn === 0 ? 10 : dn, false);
  if (disp === 'Fix') {
    if (a >= 1e10) return sci(10, true);
    const s = a.toFixed(dn);
    return (Number(s) === 0 ? '' : neg) + s;
  }
  if (a === 0) return '0';
  const e = Number(a.toExponential(9).split('e')[1]);
  const lo = dn === 2 ? -9 : -2;
  if (e < lo || e >= 10) return sci(10, true);
  let s = a.toFixed(Math.max(0, 9 - e));
  if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return neg + s;
}

// ---------- вывод ответа «естественной» записью ----------
// Строка ответа — тот же формат, что у редактора: массив знаков и шаблонов {t, s: [строки]}
const D = (s) => [...s];
const tplFrac = (a, b) => ({ t: 'frac', s: [a, b] });
const tplSqrt = (a) => ({ t: 'sqrt', s: [a] });
const digitsOf = (n) => String(Math.abs(n)).length;

function exactRow(ex) {
  const t = ex.t;
  if (!t.length) return ['0'];
  const I = (n) => D(String(Math.abs(n)));
  if (ex.pi) {
    const [n, d] = t[0];
    if (digitsOf(n) + digitsOf(d) > 9) return null;
    const sign = n < 0 ? ['−'] : [], an = Math.abs(n);
    if (d === 1) return [...sign, ...(an === 1 ? [] : I(an)), 'π'];
    return [...sign, tplFrac(I(an), I(d)), 'π'];
  }
  if (t.length === 1 && t[0][2] === 1) {
    const [n, d] = t[0];
    if (d === 1) return Math.abs(n) < 1e10 ? [...(n < 0 ? ['−'] : []), ...I(n)] : null;
    if (digitsOf(n) + digitsOf(d) + 1 > 10) return null;
    const an = Math.abs(n), sign = n < 0 ? ['−'] : [];
    if (S.frac === 'ab/c' && an > d) {
      const w = Math.floor(an / d);
      return [...sign, { t: 'mixed', s: [I(w), I(an - w * d), I(d)] }];
    }
    return [...sign, tplFrac(I(an), I(d))];
  }
  // корни: (a√b + c√d)/e
  const lcm = t.length === 2 ? (t[0][1] / igcd(t[0][1], t[1][1])) * t[1][1] : t[0][1];
  if (lcm >= 100) return null;
  let terms = t.map(([n, d, r]) => [n * (lcm / d), r]);
  if (terms.some(([a, r]) => Math.abs(a) >= 100 || r >= 1000)) return null;
  if (terms.length === 2 && terms[0][0] < 0 && terms[1][0] > 0) terms = [terms[1], terms[0]];
  const body = ([a, r]) => (r === 1 ? I(a) : [...(Math.abs(a) === 1 ? [] : I(a)), tplSqrt(I(r))]);
  if (terms.length === 1) {
    const [a] = terms[0];
    const sign = a < 0 ? ['−'] : [];
    return lcm === 1 ? [...sign, ...body(terms[0])] : [...sign, tplFrac(body(terms[0]), I(lcm))];
  }
  const num = [];
  terms.forEach((tm, i) => {
    if (tm[0] < 0) num.push('−'); else if (i) num.push('+');
    num.push(...body(tm));
  });
  return lcm === 1 ? num : [tplFrac(num, I(lcm))];
}

// Точная запись в одну строку (Line): только дроби
function exactLine(ex) {
  if (!exIsRat(ex)) return null;
  if (!ex.t.length) return ['0'];
  const [n, d] = ex.t[0];
  const sign = n < 0 ? ['−'] : [], an = Math.abs(n);
  if (d === 1) return an < 1e10 ? [...sign, ...D(String(an))] : null;
  if (digitsOf(n) + digitsOf(d) + 1 > 10) return null;
  if (S.frac === 'ab/c' && an > d) {
    const w = Math.floor(an / d);
    return [...sign, ...D(String(w)), G.FRC, ...D(String(an - w * d)), G.FRC, ...D(String(d))];
  }
  return [...sign, ...D(String(an)), G.FRC, ...D(String(d))];
}

// Можно ли показать число точно (и отличается ли это от десятичной записи)
function exactForm(x, math) {
  if (!x.ex) return null;
  if (exIsInt(x.ex)) return null;
  return math ? exactRow(x.ex) : exactLine(x.ex);
}

// Строка для показа числа. mode: 'auto' | 'dec' | 'exact'
function numRow(x, mode, math) {
  if (math === undefined) math = S.io === 'Math';
  if (mode !== 'dec' && x.ex && (mode === 'exact' || !x.dec)) {
    const row = math ? exactRow(x.ex) : exactLine(x.ex);
    if (row) return row;
  }
  return D(fmtNum(x.v));
}

// ══════ 15-numeric.js — вещественные функции и численные методы (без точных форм) ══════

const angK = () => (S.angle === 'Deg' ? Math.PI / 180 : S.angle === 'Gra' ? Math.PI / 200 : 1);

function fSin(x) {
  if (S.angle !== 'Rad') {
    const p = S.angle === 'Deg' ? 360 : 400;
    const r = x % p;
    if (r % (p / 2) === 0) return 0;
    return r15(Math.sin(r * angK()));
  }
  const r = Math.sin(x);
  return Math.abs(r) < 1e-15 && Math.abs(x) > 1e-9 ? 0 : r;
}
function fCos(x) {
  if (S.angle !== 'Rad') {
    const p = S.angle === 'Deg' ? 360 : 400;
    const r = Math.abs(x % p);
    if (r === p / 4 || r === 3 * p / 4) return 0;
    return r15(Math.cos(r * angK()));
  }
  const r = Math.cos(x);
  return Math.abs(r) < 1e-15 ? 0 : r;
}
function fTan(x) {
  const c = fCos(x);
  if (c === 0) return NaN;
  const s = fSin(x);
  return S.angle === 'Rad' ? s / c : r15(s / c);
}
const fAng = (r) => (S.angle === 'Rad' ? r : r15(r / angK()));
const fAsin = (x) => (x < -1 || x > 1 ? NaN : fAng(Math.asin(x)));
const fAcos = (x) => (x < -1 || x > 1 ? NaN : fAng(Math.acos(x)));
const fAtan = (x) => fAng(Math.atan(x));

function fFact(n) {
  if (!Number.isInteger(n) || n < 0 || n > 69) return NaN;
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}
function fPerm(n, r) {
  if (!Number.isInteger(n) || !Number.isInteger(r) || r < 0 || n < r) return NaN;
  let p = 1;
  for (let i = 0; i < r; i++) { p *= n - i; if (!Number.isFinite(p)) return NaN; }
  return p;
}
function fComb(n, r) {
  if (!Number.isInteger(n) || !Number.isInteger(r) || r < 0 || n < r) return NaN;
  r = Math.min(r, n - r);
  let c = 1;
  for (let i = 1; i <= r; i++) { c = c * (n - r + i) / i; if (!Number.isFinite(c)) return NaN; }
  return Math.round(c);
}
function fGcd(a, b) {
  if (!Number.isInteger(a) || !Number.isInteger(b)) return NaN;
  return igcd(a, b);
}
function fLcm(a, b) {
  if (!Number.isInteger(a) || !Number.isInteger(b)) return NaN;
  const g = igcd(a, b);
  return g ? Math.abs(a / g * b) : 0;
}

// Функции одного аргумента (префиксные и постфиксные) для быстрого счёта
const F1 = {
  sin: fSin, cos: fCos, tan: fTan, asin: fAsin, acos: fAcos, atan: fAtan,
  sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
  asinh: Math.asinh, acosh: (x) => (x < 1 ? NaN : Math.acosh(x)), atanh: (x) => (x <= -1 || x >= 1 ? NaN : Math.atanh(x)),
  log: (x) => (x > 0 ? Math.log10(x) : NaN), ln: (x) => (x > 0 ? Math.log(x) : NaN),
  p10: (x) => 10 ** x, exp: Math.exp,
  sqrt: (x) => (x < 0 ? NaN : Math.sqrt(x)), cbrt: Math.cbrt,
  neg: (x) => -x, abs: Math.abs, int: Math.trunc, frac: (x) => r15(x - Math.trunc(x)), intg: Math.floor,
  not: (x) => (x === 0 ? 1 : 0),
  sq: (x) => x * x, inv: (x) => (x === 0 ? NaN : 1 / x), fact: fFact,
  deg: (x) => x * (Math.PI / 180) / angK(), rad: (x) => x / angK(), gra: (x) => x * (Math.PI / 200) / angK(),
  pct: (x) => x / 100
};

// Функции двух аргументов
const F2 = {
  '+': (a, b) => a + b, '−': (a, b) => a - b, '×': (a, b) => a * b,
  '÷': (a, b) => (b === 0 ? NaN : a / b),
  '^': fPow,
  xrt: (a, b) => (a === 0 ? NaN : fPow(b, 1 / a)),
  nPr: fPerm, nCr: fComb,
  'Int÷': (a, b) => (b === 0 ? NaN : Math.trunc(a / b)),
  Rmdr: (a, b) => (b === 0 ? NaN : a - b * Math.trunc(a / b)),
  '=': (a, b) => (a === b ? 1 : 0), '≠': (a, b) => (a !== b ? 1 : 0),
  '>': (a, b) => (a > b ? 1 : 0), '<': (a, b) => (a < b ? 1 : 0),
  '≥': (a, b) => (a >= b ? 1 : 0), '≤': (a, b) => (a <= b ? 1 : 0),
  And: (a, b) => (a !== 0 && b !== 0 ? 1 : 0), Or: (a, b) => (a !== 0 || b !== 0 ? 1 : 0)
};

// ---------- производные ----------
// Метод Риддерса: экстраполяция центральных разностей
function ridders(g, h0) {
  const CON = 1.4, CON2 = CON * CON, NT = 10;
  const a = [];
  let ans = NaN, best = Infinity, h = h0;
  for (let i = 0; i < NT; i++) {
    a[i] = [g(h)];
    if (!Number.isFinite(a[i][0])) return ans;
    let fac = CON2;
    for (let j = 1; j <= i; j++) {
      a[i][j] = (a[i][j - 1] * fac - a[i - 1][j - 1]) / (fac - 1);
      fac *= CON2;
      const e = Math.max(Math.abs(a[i][j] - a[i][j - 1]), Math.abs(a[i][j] - a[i - 1][j - 1]));
      if (e <= best) { best = e; ans = a[i][j]; }

      argc(2);
      const a = num(0), b = num(1);
      if (a.v <= 0 || a.v === 1 || b.v <= 0) fail('Ma ERROR');
      return RF(r15(Math.log(b.v) / Math.log(a.v)), allEx(a, b), anyDec(a, b));
    }
    case 'gcd': case 'lcm': {
      argc(2, 6);
      const g = f === 'gcd' ? fGcd : fLcm;
      let r = val(0);
      for (let i = 1; i < A.length; i++) r = zipL(r, val(i), (x, y) => RF(g(x.v, y.v), true, false));
      return r;
    }
    case 'mod': { argc(2); const a = fl(0), b = fl(1); if (!Number.isInteger(a) || !Number.isInteger(b) || b === 0) fail('Ma ERROR'); return RI(a - b * Math.floor(a / b)); }
    case 'modexp': {
      argc(3);
      const a = int(0), p = int(1), m = int(2);
      if (p < 0 || m <= 0) fail('Ma ERROR');
      let r = 1n, b = BigInt(a) % BigInt(m), e = BigInt(p);
      const M = BigInt(m);
      if (b < 0n) b += M;
      while (e > 0n) { if (e & 1n) r = r * b % M; b = b * b % M; e >>= 1n; }
      return RI(Number(r % M));
    }
    case 'rndfix': { argc(1, 2); const x = fl(0), k = A.length > 1 ? int(1) : S.dispN; if (k < 0 || k > 9) fail('Argument ERROR'); return R(Number(x.toFixed(k)), null, true); }
    case 'pol': { argc(2); const x = fl(0), y = fl(1); return new LList([RF(Math.hypot(x, y), false, false), RF(fAng(Math.atan2(y, x)), false, false)]); }
    case 'rec': { argc(2); const r = fl(0), t = fl(1); return new LList([RF(r15(r * fCos(t)), false, false), RF(r15(r * fSin(t)), false, false)]); }
    case 'ran': return R(ran10(), null, true);
    case 'ranint': {
      argc(2, 3);
      const a = int(0), b = int(1), k = A.length > 2 ? int(2) : 0;
      if (a > b || k < 0 || k > 999) fail('Argument ERROR');
      const one = () => RI(a + Math.floor(Math.random() * (b - a + 1)));
      return k ? new LList(Array.from({ length: k }, one)) : one();
    }
    case 'rannorm': {
      argc(2, 3);
      const sd = fl(0), mu = fl(1), k = A.length > 2 ? int(2) : 0;
      if (sd <= 0 || k < 0 || k > 999) fail('Argument ERROR');
      const one = () => R(Number((mu + sd * ranNorm()).toPrecision(10)), null, true);
      return k ? new LList(Array.from({ length: k }, one)) : one();
    }
    case 'ranbin': {
      argc(2, 3);
      const m = int(0), p = fl(1), k = A.length > 2 ? int(2) : 0;
      if (m < 1 || m > 100000 || p < 0 || p > 1 || k < 0 || k > 999) fail('Argument ERROR');
      const one = () => { let c = 0; for (let i = 0; i < m; i++) if (Math.random() < p) c++; return RI(c); };
      return k ? new LList(Array.from({ length: k }, one)) : one();
    }
    case 'ranlist': { argc(1); const k = int(0); if (k < 1 || k > 999) fail('Argument ERROR'); return new LList(Array.from({ length: k }, () => R(ran10(), null, true))); }
    case 'seq': {
      argc(5);
      if (A[1].k !== 'var') fail('Syntax ERROR');
      const name = A[1].n, a = num(2), b = num(3), st = num(4);
      if (st.v === 0 || (b.v - a.v) / st.v > 998) fail('Ma ERROR');
      const saved = mem.vars[name], out = [];
      try {
        for (let x = a; st.v > 0 ? x.v <= b.v + 1e-12 * Math.abs(b.v) : x.v >= b.v - 1e-12 * Math.abs(b.v); x = sAdd(x, st)) {
          setVar(name, x);
          out.push(needNum(evalAst(A[0])));
        }
      } finally { setVar(name, saved || RI(0)); if (!saved) delete mem.vars[name]; }
      if (!out.length) fail('Ma ERROR');
      return new LList(out);
    }
    case 'min': case 'max': {
      argc(1, 2);
      const pick = (x, y) => ((f === 'min') === (x.v <= y.v) ? x : y);
      if (A.length === 1) { const a = needList(val(0)); if (!a.length) fail('Dimension ERROR'); return a.reduce(pick); }
      return zipL(val(0), val(1), pick);
    }
    case 'mean': case 'median': case 'stddev': case 'variance': {
      argc(1, 2);
      const xs = fvals(needList(val(0))), fs = A.length > 1 ? fvals(needList(val(1))) : null;
      if (f === 'median') return RF(listMedian(xs, fs), true, false);
      const st = listStats(xs, fs);
      if (f === 'mean') return RF(r15(st.mean), false, false);
      if (st.n < 2) fail('Ma ERROR');
      const v = st.dev / (st.n - 1);
      return RF(r15(f === 'variance' ? v : Math.sqrt(v)), false, false);
    }
    case 'augment': {
      argc(2);
      const a = val(0), b = val(1);
      if (isL(a) && isL(b)) return new LList([...a.a, ...b.a]);
      if (isM(a) && isM(b)) { if (a.m.length !== b.m.length) fail('Dimension ERROR'); return new Mat(a.m.map((r, i) => [...r, ...b.m[i]])); }
      return fail('Argument ERROR');
    }
    case 'fill': {
      argc(2);
      const x = num(0), tg = A[1];
      if (tg.k === 'listref' && tg.n !== 'Ans') { const a = mem.lists[tg.n - 1]; if (!a || !a.length) fail('Dimension ERROR'); a.fill(x); return DONE; }
      if (tg.k === 'matref' && mem.mats[tg.n]) { mem.mats[tg.n] = mem.mats[tg.n].map((r) => r.map(() => x)); return DONE; }
      return fail('Argument ERROR');
    }
    case 'sorta': case 'sortd': {
      argc(1, 6);
      if (A.some((q) => q.k !== 'listref' || q.n === 'Ans')) fail('Argument ERROR');
      const ls = A.map((q) => mem.lists[q.n - 1] || []);
      if (!ls[0].length || ls.some((l) => l.length !== ls[0].length)) fail('Dimension ERROR');
      const ord = ls[0].map((_, i) => i).sort((p, q) => (f === 'sorta' ? 1 : -1) * (ls[0][p].v - ls[0][q].v) || p - q);
      A.forEach((q, k) => { mem.lists[q.n - 1] = ord.map((i) => ls[k][i]); });
      return DONE;
    }
    case 'l2m': {
      argc(1, 26);
      const ls = A.map((_, i) => needList(val(i)));
      if (ls.some((l) => l.length !== ls[0].length)) fail('Dimension ERROR');
      return new Mat(ls[0].map((_, r) => ls.map((l) => l[r])));
    }
    case 'm2l': {
      argc(2);
      const m = val(0), c = int(1);
      if (!isM(m) || c < 1 || c > m.m[0].length) fail('Dimension ERROR');
      return new LList(m.m.map((r) => r[c - 1]));
    }
    case 'Pz': argc(1); return RF(r15(normCdf(fl(0))), false, true);
    case 'Qz': argc(1); return RF(r15(Math.abs(normCdf(fl(0)) - 0.5)), false, true);
    case 'Rz': argc(1); return RF(r15(1 - normCdf(fl(0))), false, true);
    case 'normpd': { argc(1, 3); const sd = A.length > 1 ? fl(1) : 1, mu = A.length > 2 ? fl(2) : 0; if (sd <= 0) fail('Ma ERROR'); return RF(r15(normPdf((fl(0) - mu) / sd) / sd), false, true); }
    case 'normcd': {
      argc(2, 4);
      const sd = A.length > 2 ? fl(2) : 1, mu = A.length > 3 ? fl(3) : 0;
      if (sd <= 0) fail('Ma ERROR');
      const lo = (fl(0) - mu) / sd, hi = (fl(1) - mu) / sd;
      return RF(r15(lo > 0 ? normCdf(-lo) - normCdf(-hi) : normCdf(hi) - normCdf(lo)), false, true);
    }
    case 'invnorm': { argc(1, 3); const sd = A.length > 1 ? fl(1) : 1, mu = A.length > 2 ? fl(2) : 0; const z = normInv(fl(0)); if (sd <= 0) fail('Ma ERROR'); return RF(r15(mu + sd * z), false, true); }
    case 'binpd': { argc(3); return RF(binomPd(int(0), int(1), fl(2)), false, true); }
    case 'bincd': {
      argc(3, 4);
      return A.length === 3 ? RF(binomCd(0, int(0), int(1), fl(2)), false, true) : RF(binomCd(int(0), int(1), int(2), fl(3)), false, true);
    }
    case 'poipd': argc(2); return RF(r15(poisPd(int(0), fl(1))), false, true);
    case 'poicd': argc(2, 3); return A.length === 2 ? RF(poisCd(0, int(0), fl(1)), false, true) : RF(poisCd(int(0), int(1), fl(2)), false, true);
    case 'ddx': argc(2); return RF(r15(nDeriv(fnOf(A[0]), fl(1))), true, false);
    case 'd2dx': argc(2); return RF(nDeriv2(fnOf(A[0]), fl(1)), true, false);
    case 'int': { argc(3, 4); const a = fl(1), b = fl(2); return RF(Number(nInt(fnOf(A[0]), a, b).toPrecision(12)), true, false); }
    case 'sigma': {
      argc(4, 5);
      if (A[1].k !== 'var') fail('Syntax ERROR');
      const a = int(2), b = int(3), st = A.length > 4 ? int(4) : 1;
      if (st <= 0 || b < a || (b - a) / st > 1e6) fail('Ma ERROR');
      // точный счёт, пока слагаемых немного
      if ((b - a) / st <= 300) {
        const name = A[1].n, saved = mem.vars[name];
        let s = RI(0);
        try {
          for (let k = a; k <= b; k += st) { setVar(name, RI(k)); s = sAdd(s, needNum(evalAst(A[0]))); }
        } finally { setVar(name, saved || RI(0)); if (!saved) delete mem.vars[name]; }
        return s;
      }
      const g = fnOf(A[0], A[1].n);
      let s = 0;
      for (let k = a; k <= b; k += st) s += g(k);
      return RF(s, false, false);
    }
    case 'fmin': case 'fmax': {
      argc(3, 4);
      const g = fnOf(A[0]), a = fl(1), b = fl(2), kind = f === 'fmax' ? 1 : -1;
      if (!(a < b)) fail('Ma ERROR');
      // кандидаты: внутренние экстремумы и концы отрезка
      const cand = [...scanExtrema(g, a, b, kind, 400), a, b].filter((x) => Number.isFinite(g(x)));
      if (!cand.length) fail('Ma ERROR');
      const x = cand.reduce((p, q) => (kind * g(q) > kind * g(p) ? q : p));
      return new LList([RF(x, false, false), RF(g(x), false, false)]);
    }
    case 'solve': {
      argc(2, 4);
      const g = fnOf(eqAst(A[0]));
      const x = A.length >= 4 ? nSolve(g, fl(1), fl(2), fl(3)) : nSolve(g, fl(1));
      if (!Number.isFinite(x)) fail('Not Found');
      return RF(x, true, false);
    }
    case 'solven': {
      argc(1, 4);
      let name = 'X', k = 1;
      if (A.length > 1 && A[1].k === 'var') { name = A[1].n; k = 2; }
      const g = fnOf(eqAst(A[0]), name);
      const lo = A.length > k ? fl(k) : -100, hi = A.length > k + 1 ? fl(k + 1) : 100;
      const rs = scanRoots(g, lo, hi, 8000).slice(0, 10);
      if (!rs.length) fail('Not Found');
      return new LList(rs.map((x) => RF(x, true, false)));
    }
    default: return fail('Syntax ERROR');
  }
}

// ---------- быстрый счёт: дерево → функция без аргументов, переменные берутся из fv ----------
function compileAst(n) {
  switch (n.k) {
    case 'num': { const v = n.v.v; return () => v; }
    case 'var': { const ix = VIX[n.n]; return () => fv[ix]; }
    case 'pi': return () => Math.PI;
    case 'ans': return () => (mem.ans ? mem.ans.v : 0);
    case 'pre': case 'post': {
      const f = F1[n.f], a = compileAst(n.a);
      if (!f) fail('Syntax ERROR');
      return () => f(a());
    }
    case 'mixed': {
      const a = compileAst(n.a), b = compileAst(n.b), c = compileAst(n.c);
      return () => { const w = a(), q = b() / c(); return w < 0 ? w - q : w + q; };
    }
    case 'bin': {
      const a = compileAst(n.a), b = compileAst(n.b);
      switch (n.op) {
        case '+': return () => a() + b();
        case '−': return () => a() - b();
        case '×': return () => a() * b();
        case '÷': return () => { const d = b(); return d === 0 ? NaN : a() / d; };
        default: {
          const f = F2[n.op];
          if (!f) fail('Syntax ERROR');
          return () => f(a(), b());
        }
      }
    }
    case 'yfn': {
      const k = n.n, arg = n.arg ? compileAst(n.arg) : null, ix = VIX.X;
      let depth = 0;
      return () => {
        const f = yfnHook(k);
        if (!f || depth > 8) return NaN;
        const sv = fv[ix];
        depth++;
        try { return f(arg ? arg() : sv); } finally { depth--; fv[ix] = sv; }
      };
    }
    case 'call': {
      const A = n.args, c = (i) => compileAst(A[i]);
      const need = (lo, hi) => { if (A.length < lo || A.length > (hi || lo)) fail('Syntax ERROR'); };
      switch (n.f) {
        case 'logab': { need(2); const a = c(0), b = c(1); return () => { const p = a(), q = b(); return p > 0 && p !== 1 && q > 0 ? Math.log(q) / Math.log(p) : NaN; }; }
        case 'gcd': { need(2); const a = c(0), b = c(1); return () => fGcd(a(), b()); }
        case 'lcm': { need(2); const a = c(0), b = c(1); return () => fLcm(a(), b()); }
        case 'mod': { need(2); const a = c(0), b = c(1); return () => { const p = a(), q = b(); return q === 0 ? NaN : p - q * Math.floor(p / q); }; }
        case 'rndfix': { need(2); const a = c(0), b = c(1); return () => Number(a().toFixed(Math.max(0, Math.min(9, b())))); }
        case 'ran': return ran10;
        case 'ranint': { need(2); const a = c(0), b = c(1); return () => { const p = a(), q = b(); return p + Math.floor(Math.random() * (q - p + 1)); }; }
        case 'Pz': { need(1); const a = c(0); return () => normCdf(a()); }
        case 'Qz': { need(1); const a = c(0); return () => Math.abs(normCdf(a()) - 0.5); }
        case 'Rz': { need(1); const a = c(0); return () => 1 - normCdf(a()); }
        case 'normpd': { need(1, 3); const a = c(0), s = A.length > 1 ? c(1) : () => 1, m = A.length > 2 ? c(2) : () => 0; return () => { const sd = s(); return normPdf((a() - m()) / sd) / sd; }; }
        case 'normcd': { need(2, 4); const a = c(0), b = c(1), s = A.length > 2 ? c(2) : () => 1, m = A.length > 3 ? c(3) : () => 0; return () => { const sd = s(), mu = m(); return normCdf((b() - mu) / sd) - normCdf((a() - mu) / sd); }; }
        case 'binpd': { need(3); const a = c(0), b = c(1), p = c(2); return () => binomPd(Math.round(a()), b(), p()); }
        case 'ddx': { need(2); const g = fnOf(A[0]), a = c(1); return () => nDeriv(g, a()); }
        case 'd2dx': { need(2); const g = fnOf(A[0]), a = c(1); return () => nDeriv2(g, a()); }
        case 'int': { need(3, 4); const g = fnOf(A[0]), a = c(1), b = c(2); return () => nInt(g, a(), b(), 1e-9); }
        case 'sigma': {
          need(4, 5);
          if (A[1].k !== 'var') fail('Syntax ERROR');
          const g = fnOf(A[0], A[1].n), a = c(2), b = c(3), st = A.length > 4 ? c(4) : () => 1;
          return () => {
            const lo = a(), hi = b(), d = st();
            if (!(d > 0) || (hi - lo) / d > 1e5) return NaN;
            let s = 0;
            for (let k = lo; k <= hi; k += d) s += g(k);
            return s;
          };
        }
        case 'solve': { need(2, 4); const g = fnOf(eqAst(A[0])), a = c(1); return () => nSolve(g, a()); }
        default: return fail('Syntax ERROR');
      }
    }
    default: return fail('Syntax ERROR');
  }
}

// Удобные обёртки
const evalTokens = (toks) => evalAst(parse(toks));
function compileTokens(toks, name) {     // → (x) => число; переменная по умолчанию X
  const f = compileAst(parse(toks)), ix = VIX[name || 'X'];
  return (x) => { fv[ix] = x; return f(); };
}
// Значение числового поля (V-Window, таблицы, списки): выражение → число
function evalNumber(toks) {
  const v = evalTokens(toks);
  if (!isNum(v)) fail('Syntax ERROR');
  return v;
}

// ══════ 30-lcd.js — экран 384×216: текст, линии, строка состояния, меню F1–F6 ══════
//
// Координаты — в точках экрана калькулятора (384×216); холст растягивается под устройство,
// текст рисуется шрифтом системы по знакоместам 18×24, поэтому остаётся чётким при любом размере.

const LW = 384, LH = 216;
const FONT = '"Helvetica Neue", Helvetica, Arial, "Liberation Sans", Roboto, "Noto Sans", sans-serif';
const COLORS = { Black: '#000000', Blue: '#0000ff', Red: '#ff0000', Magenta: '#ff00ff', Green: '#00a400', Cyan: '#00b4e6', Yellow: '#e6c200' };
const COLOR_NAMES = Object.keys(COLORS);
const HILITE = '#000000';             // фон выделенной строки

const lcd = {
  cv: null, g: null, kx: 1, ky: 1, log: [],

  init(cv) { this.cv = cv; this.g = cv.getContext('2d'); this.fit(); },

  // Подогнать разрешение холста под его размер на странице
  fit() {
    const r = this.cv.getBoundingClientRect();
    const dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    const k = Math.max(1, Math.min(8, (r.width || LW) * dpr / LW));
    const w = Math.round(LW * k), h = Math.round(LH * k);
    if (this.cv.width !== w || this.cv.height !== h) { this.cv.width = w; this.cv.height = h; }
    this.kx = w / LW; this.ky = h / LH;
  },

  begin() {
    const g = this.g;
    g.setTransform(this.kx, 0, 0, this.ky, 0, 0);
    g.globalAlpha = 1;
    g.fillStyle = '#fff';
    g.fillRect(0, 0, LW, LH);
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';
    this.log = [];
  },

  rect(x, y, w, h, color) { this.g.fillStyle = color || '#000'; this.g.fillRect(x, y, w, h); },
  frame(x, y, w, h, color, lw) { const g = this.g; g.strokeStyle = color || '#000'; g.lineWidth = lw || 1; g.strokeRect(x + .5, y + .5, w - 1, h - 1); },
  line(x1, y1, x2, y2, color, lw) {
    const g = this.g;
    g.strokeStyle = color || '#000'; g.lineWidth = lw || 1; g.lineCap = 'butt';
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  },
  rrect(x, y, w, h, r, fill, stroke, lw) {
    const g = this.g;
    g.beginPath();
    g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
    if (fill) { g.fillStyle = fill; g.fill(); }
    if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 1; g.stroke(); }
  },
  clip(x, y, w, h) { const g = this.g; g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); },
  unclip() { this.g.restore(); },

  // Особые знаки. Возвращает true, если знак нарисован
  special(ch, cx, cy, h, color) {
    const g = this.g, u = h / 24;
    const st = (w) => { g.strokeStyle = color; g.lineWidth = w * u; g.lineCap = 'round'; g.lineJoin = 'round'; };
    const txt = (s, px, x, y, wt) => { g.font = `${wt || 600} ${px * u}px ${FONT}`; g.fillStyle = color; g.fillText(s, x, y); };
    const path = (pts) => { g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(cx + x * u, cy + y * u) : g.moveTo(cx + x * u, cy + y * u))); g.stroke(); };
    const tri = (pts) => { g.fillStyle = color; g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(cx + x * u, cy + y * u) : g.moveTo(cx + x * u, cy + y * u))); g.closePath(); g.fill(); };
    switch (ch) {
      case G.NEG: st(2); path([[-5, -1.5], [4.5, -1.5]]); return true;
      case G.INV: txt('1', 13, cx + 3.5 * u, cy - 2.5 * u); st(1.6); path([[-6.5, -7], [-1.5, -7]]); return true;
      case G.SQ: txt('2', 13, cx, cy - 2.5 * u); return true;
      case G.TEN: txt('10', 13, cx, cy + 9 * u, 700); return true;
      case G.EE: txt('E', 15, cx, cy + 8.5 * u, 700); return true;
      case G.XRT: txt('x', 12, cx - 4.5 * u, cy - 3 * u); st(1.7); path([[-3, 3], [0, 9], [4, -9], [9, -9]]); return true;
      case G.CBRT: txt('3', 11, cx - 4.5 * u, cy - 3 * u); st(1.7); path([[-3, 3], [0, 9], [4, -9], [9, -9]]); return true;
      case '√': st(1.8); path([[-8, 1.5], [-5.5, 0], [-2, 9], [3, -9.5], [9, -9.5]]); return true;
      case G.FRC: st(2); path([[4, -6], [4, 6], [-5, 6]]); return true;
      case G.XBAR: txt('x', 20, cx, cy + 7 * u); st(1.6); path([[-5, -7], [5, -7]]); return true;
      case G.YBAR: txt('y', 20, cx, cy + 5 * u); st(1.6); path([[-5, -8.5], [5, -8.5]]); return true;
      case G.XHAT: txt('x', 20, cx, cy + 7 * u); st(1.5); path([[-4, -6], [0, -9.5], [4, -6]]); return true;
      case G.YHAT: txt('y', 20, cx, cy + 5 * u); st(1.5); path([[-4, -7], [0, -10.5], [4, -7]]); return true;
      case G.RAD: txt('r', 14, cx, cy - 2 * u); return true;
      case G.GRA: txt('g', 14, cx, cy - 3 * u); return true;
      case G.PERM: txt('P', 21, cx, cy + 7.5 * u, 900); return true;
      case G.COMB: txt('C', 21, cx, cy + 7.5 * u, 900); return true;
      case G.BOX: g.strokeStyle = color; g.lineWidth = 1.2 * u; g.strokeRect(cx - 5 * u, cy - 7 * u, 10 * u, 14 * u); return true;
      case '▶': tri([[-5, -7], [6, 0], [-5, 7]]); return true;
      case '◀': tri([[5, -7], [-6, 0], [5, 7]]); return true;
      case '▲': tri([[-7, 5], [0, -6], [7, 5]]); return true;
      case '▼': tri([[-7, -5], [0, 6], [7, -5]]); return true;
      case '▷': st(1.6); path([[-4, -6], [5, 0], [-4, 6], [-4, -6]]); return true;
      default: return false;
    }
  },

  // Один знак по центру знакоместа высотой h
  glyph(ch, cx, cy, h, color) {
    if (ch === ' ') return;
    const g = this.g;
    color = color || '#000';
    if (ch === G.YV) ch = 'Y'; else if (ch === G.DX) ch = 'd';
    if ((ch >= '' && ch <= '') || ch === '√' || (ch >= '▲' && ch <= '◀')) {
      if (this.special(ch, cx, cy, h, color)) return;
    }
    // знаки чуть растянуты по ширине, чтобы заполнять знакоместо, как у экранного шрифта калькулятора
    g.font = `600 ${h * 0.96}px ${FONT}`;
    g.fillStyle = color;
    g.textAlign = 'center';
    g.save();
    g.translate(cx, cy + h * 0.34);
    g.scale(1.16, 1);
    g.fillText(ch, 0, 0, (h * 0.75 - 1) / 1.16);
    g.restore();
  },

  // Текст по знакоместам. o: {h, color, bg, inv}
  text(x, y, str, o) {
    o = o || {};
    const h = o.h || 24, cw = h * 0.75, chars = [...String(str)];
    let color = o.color || '#000';
    if (o.inv) { this.rect(x, y, chars.length * cw, h, o.bg || HILITE); color = '#fff'; }
    else if (o.bg) this.rect(x, y, chars.length * cw, h, o.bg);
    chars.forEach((ch, i) => this.glyph(ch, x + (i + 0.5) * cw, y + h / 2, h, color));
    this.log.push(String(str));
    return chars.length * cw;
  },

  // Мелкий пропорциональный текст. o: {px, color, bold, align: 'l'|'c'|'r', max}
  miniW(str, o) {
    o = o || {};
    const g = this.g, px = o.px || 14;
    g.font = `${o.bold === false ? 500 : 700} ${px}px ${FONT}`;
    let w = 0;
    for (const ch of String(str)) w += (ch >= '' && ch <= '') || ch === '√' || (ch >= '▲' && ch <= '◀') || ch === '▷' ? px * 0.72 : g.measureText(ch).width;
    return w;
  },
  mini(x, y, str, o) {
    o = o || {};
    str = String(str);
    const g = this.g, px = o.px || 14, color = o.color || '#000';
    let w = this.miniW(str, o);
    const sx = o.max && w > o.max ? o.max / w : 1;
    const al = o.align || 'l';
    let x0 = al === 'c' ? x - (w * sx) / 2 : al === 'r' ? x - w * sx : x;
    g.save();
    g.translate(x0, 0);
    g.scale(sx, 1);
    let cx = 0;
    const base = y + px * 0.86;
    for (const ch of str) {
      const sp = (ch >= '' && ch <= '') || ch === '√' || (ch >= '▲' && ch <= '◀') || ch === '▷';
      if (sp) {
        const cw = px * 0.72;
        this.glyph(ch, cx + cw / 2, y + px * 0.56, px * 1.12, color);
        cx += cw;
        g.font = `${o.bold === false ? 500 : 700} ${px}px ${FONT}`;
      } else {
        g.font = `${o.bold === false ? 500 : 700} ${px}px ${FONT}`;
        const cw = g.measureText(ch).width;
        g.fillStyle = color;
        g.textAlign = 'left';
        g.fillText(ch, cx, base);
        cx += cw;
      }
    }
    g.restore();
    g.textAlign = 'center';
    this.log.push(str);
    return w * sx;
  },

  // Строка состояния: батарея, значок SHIFT/ALPHA, метки режима
  status(tags, mod) {
    const g = this.g;
    this.rect(0, 0, LW, 22, '#fff');
    // батарея
    this.frame(3, 6, 18, 10, '#000', 1);
    this.rect(21, 9, 2, 4, '#000');
    for (let i = 0; i < 3; i++) this.rect(5 + i * 5, 8, 4, 6, '#1e9e3e');
    let x = 27;
    if (mod) {
      const col = mod === 'S' ? '#e6a800' : '#d8232a';
      this.rrect(x, 3, 17, 16, 3, col);
      this.mini(x + 8.5, 4.2, mod === 'S' ? 'S' : 'A', { px: 12.5, color: '#fff', align: 'c' });
      if (mod === 'AL') { this.rect(x + 12, 13, 5, 5, '#fff'); this.frame(x + 12, 13, 5, 5, '#d8232a', 1); }
      this.log.push('[' + mod + ']');
    }
    x = 48;
    for (const t of tags || []) {
      if (!t) continue;
      const w = this.miniW(t, { px: 10.5 }) + 7;
      this.rrect(x + .5, 4.5, w, 13, 2.5, '#fff', '#000', 1);
      this.mini(x + 0.5 + w / 2, 5.8, t, { px: 10.5, align: 'c' });
      x += w + 3;
    }
    this.line(0, 22.5, LW, 22.5, '#000', 1);
    g.textAlign = 'center';
  },

  // Меню F1–F6. items: до 6 пунктов {l, k}: k = 'cmd' (команда), 'sub' (подменю), 'ins' (вставка)
  fmenu(items) {
    const g = this.g;
    for (let i = 0; i < 6; i++) {
      const it = items && items[i];
      if (!it) continue;
      const x = i * 64 + 1, y = 193, w = 62, h = 22;
      if (it.k === 'ins') {
        this.rrect(x + .5, y + .5, w - 1, h - 1, 2.5, '#fff', '#000', 1);
        this.mini(x + w / 2, y + 4, it.l, { px: 13, align: 'c', max: w - 6 });
      } else {
        this.rrect(x, y, w, h, 3, '#000');
        if (it.k === 'sub') {
          g.fillStyle = '#fff';
          g.beginPath(); g.moveTo(x + w + .5, y + h - 8); g.lineTo(x + w + .5, y + h + .5); g.lineTo(x + w - 8, y + h + .5); g.closePath(); g.fill();
        }
        this.mini(x + w / 2, y + 4, it.l, { px: 13, align: 'c', color: '#fff', max: w - (it.k === 'sub' ? 9 : 6) });
      }
    }
  },

  // Окно сообщения по центру экрана
  popup(lines, o) {
    o = o || {};
    const n = lines.length, w = o.w || 300, h = n * 24 + 20;
    const x = (LW - w) / 2, y = o.y !== undefined ? o.y : Math.max(26, 24 + (168 - h) / 2);
    this.rect(x + 3, y + 3, w, h, 'rgba(0,0,0,.25)');
    this.rect(x, y, w, h, '#fff');
    this.frame(x, y, w, h, '#000', 2);
    lines.forEach((s, i) => {
      const chars = [...s];
      const tw = chars.length * 18;
      if (o.left) this.text(x + 12, y + 10 + i * 24, s);
      else this.text(x + (w - tw) / 2, y + 10 + i * 24, s);
    });
  }
};

// ══════ 35-mathbox.js — «естественная» запись: раскладка и рисование дробей, корней, степеней ══════
//
// Строка — массив: знак (строка) или шаблон {t, s: [строки]}.
// layRow → {w, a, d, ops, cur}: ширина, высота над и под средней линией, что рисовать, места курсора.

const MCH = [24, 16];                 // высота знакоместа: обычный и мелкий размер
const MCW = [18, 12];
const TPL_SLOTS = { frac: 2, mixed: 3, sqrt: 1, cbrt: 1, root: 2, pow: 1, pow10: 1, epow: 1, abs: 1, logab: 2, int: 3, ddx: 2, d2dx: 2, sum: 4 };

function layRow(row, sz, math, slot) {
  const ch = MCH[sz], cw = MCW[sz], half = ch / 2;
  const ops = [], cur = [], bx = [], open = [];
  let x = 0;
  if (!row.length && slot) {
    ops.push({ t: 'g', x: cw / 2, y: 0, ch: G.BOX, h: ch });
    cur.push({ row, i: 0, x: 1, y: 0, h: ch });
    return { w: cw, a: half, d: half, ops, cur };
  }
  const liftOf = (pa) => Math.max(sz ? 1 : 2, pa - (sz ? 7 : 10));
  const pair = (i, j) => {            // скобки по высоте содержимого
    let A = half, Dn = half;
    for (let k = i + 1; k < j; k++) { A = Math.max(A, bx[k].a); Dn = Math.max(Dn, bx[k].d); }
    if (i >= 0) { bx[i].a = A; bx[i].d = Dn; }
    if (j < bx.length) { bx[j].a = A; bx[j].d = Dn; }
  };
  for (let i = 0; i < row.length; i++) {
    const it = row[i];
    cur.push({ row, i, x, y: 0, h: ch });
    const pa = bx.length ? bx[bx.length - 1].a : half;
    let b;
    if (typeof it !== 'string') {
      b = layTpl(it, sz, pa);
      for (const o of b.ops) { o.x += x; ops.push(o); }
      for (const c of b.cur) { c.x += x; cur.push(c); }
      b = { x, w: b.w, a: b.a, d: b.d };
    } else if (math && (it === G.SQ || it === G.INV)) {
      const yc = -(liftOf(pa) + 8);
      if (it === G.SQ) { ops.push({ t: 'g', x: x + 6.5, y: yc, ch: '2', h: 16 }); b = { x, w: 13, a: -yc + 8, d: 0 }; }
      else {
        ops.push({ t: 'g', x: x + 5, y: yc, ch: G.NEG, h: 16 }, { t: 'g', x: x + 13.5, y: yc, ch: '1', h: 16 });
        b = { x, w: 19, a: -yc + 8, d: 0 };
      }
    } else if (math && (it === '(' || it === ')')) {
      b = { x, w: cw, a: half, d: half, paren: it };
      bx.push(b);
      if (it === '(') open.push(bx.length - 1); else pair(open.length ? open.pop() : -1, bx.length - 1);
      x += b.w;
      continue;
    } else {
      const chars = [...it];
      chars.forEach((c, j) => ops.push({ t: 'g', x: x + (j + 0.5) * cw, y: 0, ch: c, h: ch }));
      b = { x, w: chars.length * cw, a: half, d: half };
    }
    bx.push(b);
    x += b.w;
  }
  while (open.length) pair(open.pop(), bx.length);
  cur.push({ row, i: row.length, x, y: 0, h: ch });
  let a = half, d = half;
  for (const b of bx) {
    a = Math.max(a, b.a); d = Math.max(d, b.d);
    if (!b.paren) continue;
    if (b.a > half + 0.5 || b.d > half + 0.5) ops.push({ t: 'par', x: b.x, y: -b.a, h: b.a + b.d, w: cw, side: b.paren === '(' ? 1 : -1 });
    else ops.push({ t: 'g', x: b.x + cw / 2, y: 0, ch: b.paren, h: ch });
  }
  return { w: x, a, d, ops, cur };
}

function layTpl(it, sz, pa) {
  const ch = MCH[sz], cw = MCW[sz], half = ch / 2, s = it.s;
  const ops = [], cur = [];
  const put = (b, dx, dy) => {
    for (const o of b.ops) { o.x += dx; o.y += dy; ops.push(o); }
    for (const c of b.cur) { c.x += dx; c.y += dy; cur.push(c); }
  };
  const L = (k, z) => layRow(s[k], z === undefined ? sz : z, true, true);
  const glyphs = (str, x, y, z) => { [...str].forEach((c, j) => ops.push({ t: 'g', x: x + (j + 0.5) * MCW[z], y, ch: c, h: MCH[z] })); return str.length * MCW[z]; };
  const pw = sz ? 6 : 8;              // ширина скобки шаблона
  const parens = (C, x) => {          // (C) начиная с x; возвращает правый край
    const A = Math.max(half, C.a), Dn = Math.max(half, C.d);
    ops.push({ t: 'par', x, y: -A, h: A + Dn, w: pw, side: 1 });
    put(C, x + pw, 0);
    ops.push({ t: 'par', x: x + pw + C.w, y: -A, h: A + Dn, w: pw, side: -1 });
    return x + 2 * pw + C.w;
  };
  switch (it.t) {
    case 'frac': {
      const N = L(0), Dn = L(1), w = Math.max(N.w, Dn.w) + 4;
      put(N, (w - N.w) / 2, -(2 + N.d));
      put(Dn, (w - Dn.w) / 2, 3 + Dn.a);
      ops.push({ t: 'l', x: 1, y: 0.5, dx: w - 2, dy: 0, lw: sz ? 1.1 : 1.6 });
      return { w, a: 2 + N.d + N.a, d: 3 + Dn.a + Dn.d, ops, cur };
    }
    case 'mixed': {
      const W = L(0), N = L(1), Dn = L(2), fw = Math.max(N.w, Dn.w) + 4, fx = W.w + 1;
      put(W, 0, 0);
      put(N, fx + (fw - N.w) / 2, -(2 + N.d));
      put(Dn, fx + (fw - Dn.w) / 2, 3 + Dn.a);
      ops.push({ t: 'l', x: fx + 1, y: 0.5, dx: fw - 2, dy: 0, lw: sz ? 1.1 : 1.6 });
      return { w: fx + fw, a: Math.max(W.a, 2 + N.d + N.a), d: Math.max(W.d, 3 + Dn.a + Dn.d), ops, cur };
    }
    case 'sqrt': case 'cbrt': case 'root': {
      const I = it.t === 'root' ? L(0, 1) : null, C = L(it.t === 'root' ? 1 : 0);
      const pl = sz ? 8 : 11, top = C.a + 2.5;
      const ox = it.t === 'sqrt' ? 0 : Math.max(0, (I ? I.w : 9) - 5);
      let a = top + 1.5;
      if (I) { put(I, 0, -(2 + I.d)); a = Math.max(a, 2 + I.d + I.a); }
      else if (it.t === 'cbrt') { ops.push({ t: 'g', x: 4.5, y: -8, ch: '3', h: 13 }); a = Math.max(a, 15); }
      put(C, ox + pl, 0);
      ops.push({ t: 'pl', x: ox, y: 0, pts: [[1, 1.5], [3.2, 0], [pl - 4.2, C.d - 1.5], [pl - 1, -top], [pl + C.w + 1.5, -top]], lw: sz ? 1.2 : 1.7 });
      return { w: ox + pl + C.w + 3, a, d: C.d, ops, cur };
    }
    case 'pow': {
      const E = L(0, 1), lift = Math.max(sz ? 1 : 2, pa - (sz ? 7 : 10));
      put(E, 0.5, -(lift + E.d));
      return { w: E.w + 1.5, a: lift + E.d + E.a, d: 0, ops, cur };
    }
    case 'pow10': case 'epow': {
      const bw = glyphs(it.t === 'pow10' ? '10' : 'e', 0, 0, sz);
      const E = L(0, 1), lift = sz ? 1 : 2;
      put(E, bw + 0.5, -(lift + E.d));
      return { w: bw + E.w + 1.5, a: Math.max(half, lift + E.d + E.a), d: half, ops, cur };
    }
    case 'abs': {
      const C = L(0);
      put(C, 5, 0);
      ops.push({ t: 'l', x: 2.5, y: -C.a, dx: 0, dy: C.a + C.d, lw: 1.5 }, { t: 'l', x: C.w + 7.5, y: -C.a, dx: 0, dy: C.a + C.d, lw: 1.5 });
      return { w: C.w + 10, a: C.a, d: C.d, ops, cur };
    }
    case 'logab': {
      let x = glyphs('log', 0, 0, sz);
      const B = L(0, 1), C = L(1), by = (sz ? 3 : 5) + B.a;
      put(B, x, by);
      x = parens(C, x + B.w + 1);
      return { w: x, a: Math.max(half, C.a), d: Math.max(half, C.d, by + B.d), ops, cur };
    }
    case 'int': {
      const F = L(0), lo = L(1, 1), hi = L(2, 1);
      const up = Math.max(F.a, 14), dn = Math.max(F.d, 14);
      ops.push({ t: 'int', x: 1, y: -up, h: up + dn });
      put(hi, 15, -(up - 6) - hi.d);
      put(lo, 11, dn - 6 + lo.a);
      const fx = 13 + Math.max(lo.w - 2, hi.w + 2) + 3;
      put(F, fx, 0);
      const w = fx + F.w + 2 + glyphs('dx', fx + F.w + 2, 0, sz);
      return { w, a: up - 6 + hi.d + hi.a, d: dn - 6 + lo.a + lo.d, ops, cur };
    }
    case 'ddx': case 'd2dx': {
      const two = it.t === 'd2dx', F = L(0), X = L(1, 1);
      const fw = two ? 34 : 26;
      // «d/dx» мелкой дробью
      if (two) { glyphs('d', fw / 2 - 10, -10, 1); ops.push({ t: 'g', x: fw / 2 + 6, y: -13, ch: '2', h: 11 }); glyphs('dx', 1, 11, 1); ops.push({ t: 'g', x: 29, y: 8, ch: '2', h: 11 }); }
      else { glyphs('d', fw / 2 - 6, -10, 1); glyphs('dx', 1, 11, 1); }
      ops.push({ t: 'l', x: 0, y: 0.5, dx: fw, dy: 0, lw: 1.3 });
      let x = parens(F, fw + 1);
      const A = Math.max(half, F.a), Dn = Math.max(half, F.d, 19);
      ops.push({ t: 'l', x: x + 2, y: -A, dx: 0, dy: A + Dn, lw: 1.2 });
      const yl = Dn - 4;
      x += 4 + glyphs('x=', x + 4, yl, 1);
      put(X, x, yl);
      return { w: x + X.w + 1, a: Math.max(A, 19), d: Math.max(Dn, yl + X.d), ops, cur };
    }
    case 'sum': {
      const F = L(0), V = L(1, 1), Lo = L(2, 1), Hi = L(3, 1);
      const bw = V.w + 12 + Lo.w, colw = Math.max(24, bw, Hi.w);
      ops.push({ t: 'big', x: colw / 2, y: 0, ch: 'Σ', px: 32 });
      put(Hi, (colw - Hi.w) / 2, -17 - Hi.d);
      const bx0 = (colw - bw) / 2;
      put(V, bx0, 17 + Math.max(V.a, Lo.a));
      glyphs('=', bx0 + V.w, 17 + Math.max(V.a, Lo.a), 1);
      put(Lo, bx0 + V.w + 12, 17 + Math.max(V.a, Lo.a));
      const x = parens(F, colw + 1);
      return { w: x, a: Math.max(F.a, 17 + Hi.d + Hi.a), d: Math.max(F.d, 17 + Math.max(V.a, Lo.a) + Math.max(V.d, Lo.d)), ops, cur };
    }
    default:
      return { w: 0, a: half, d: half, ops, cur };
  }
}

// Нарисовать раскладку: (ox, oy) — левый край и средняя линия
function drawLay(lay, ox, oy, color) {
  const g = lcd.g;
  color = color || '#000';
  for (const o of lay.ops) {
    const x = ox + o.x, y = oy + o.y;
    switch (o.t) {
      case 'g': lcd.glyph(o.ch, x, y, o.h, color); break;
      case 'l': lcd.line(x, y, x + o.dx, y + o.dy, color, o.lw); break;
      case 'pl':
        g.strokeStyle = color; g.lineWidth = o.lw; g.lineCap = 'round'; g.lineJoin = 'round';
        g.beginPath();
        o.pts.forEach(([px, py], i) => (i ? g.lineTo(x + px, y + py) : g.moveTo(x + px, y + py)));
        g.stroke();
        break;
      case 'par': {
        const xa = o.side > 0 ? x + o.w - 1.5 : x + 1.5, xb = o.side > 0 ? x + 1.5 : x + o.w - 1.5;
        g.strokeStyle = color; g.lineWidth = 1.5; g.lineCap = 'round';
        g.beginPath();
        g.moveTo(xa, y + 1.5);
        g.quadraticCurveTo(xb - (xa - xb) * 0.55, y + o.h / 2, xa, y + o.h - 1.5);
        g.stroke();
        break;
      }
      case 'int':
        g.strokeStyle = color; g.lineWidth = 1.6; g.lineCap = 'round';
        g.beginPath();
        g.moveTo(x + 11, y + 3.5);
        g.bezierCurveTo(x + 10, y - 0.5, x + 6, y, x + 6, y + 6);
        g.lineTo(x + 6, y + o.h - 6);
        g.bezierCurveTo(x + 6, y + o.h, x + 2, y + o.h + 0.5, x + 1, y + o.h - 3.5);
        g.stroke();
        break;
      case 'big':
        g.font = `500 ${o.px}px ${FONT}`; g.fillStyle = color; g.textAlign = 'center';
        g.fillText(o.ch, x, y + o.px * 0.35);
        break;
      default:
    }
  }
}

function curOf(lay, row, i) {
  for (const c of lay.cur) if (c.row === row && c.i === i) return c;
  return null;
}

// Готовая строка (ответ, подпись) — раскладка без курсора
const layStatic = (row, sz) => layRow(row, sz || 0, true, false);

// ══════ 36-editor.js — редактор выражения: курсор, вставка, удаление, шаблоны ══════

const cloneRow = (row) => row.map((it) => (typeof it === 'string' ? it : { t: it.t, s: it.s.map(cloneRow) }));

// Строка с шаблонами → знаки для разбора
function rowTokens(row) {
  const out = [];
  for (const it of row) {
    if (typeof it === 'string') { out.push(it); continue; }
    const s = it.s.map(rowTokens);
    const P = (a) => ['(', ...a, ')'];
    switch (it.t) {
      case 'frac': out.push('(', ...P(s[0]), '÷', ...P(s[1]), ')'); break;
      case 'mixed': out.push('(', ...P(s[0]), '+', ...P(s[1]), '÷', ...P(s[2]), ')'); break;
      case 'sqrt': out.push('(', '√', ...P(s[0]), ')'); break;
      case 'cbrt': out.push('(', G.CBRT, ...P(s[0]), ')'); break;
      case 'root': out.push('(', ...P(s[0]), G.XRT, ...P(s[1]), ')'); break;
      case 'pow': out.push('^', ...P(s[0])); break;
      case 'pow10': out.push('(', '1', '0', '^', ...P(s[0]), ')'); break;
      case 'epow': out.push('(', 'e^', ...P(s[0]), ')'); break;
      case 'abs': out.push('(', 'Abs ', ...P(s[0]), ')'); break;
      case 'logab': out.push('logab(', ...s[0], ',', ...s[1], ')'); break;
      case 'int': out.push('∫(', ...s[0], ',', ...s[1], ',', ...s[2], ')'); break;
      case 'ddx': out.push('d/dx(', ...s[0], ',', ...s[1], ')'); break;
      case 'd2dx': out.push('d²/dx²(', ...s[0], ',', ...s[1], ')'); break;
      case 'sum': out.push('Σ(', ...s[0], ',', ...s[1], ',', ...s[2], ',', ...s[3], ')'); break;
      default:
    }
  }
  return out;
}

// Куда ведут ▲ и ▼ внутри шаблона: (слот, направление −1 вверх / +1 вниз) → слот или −1
const VMAP = {
  frac: (s, d) => (d > 0 ? (s === 0 ? 1 : -1) : (s === 1 ? 0 : -1)),
  mixed: (s, d) => (d > 0 ? (s === 1 ? 2 : -1) : (s === 2 ? 1 : -1)),
  root: (s, d) => (d > 0 ? (s === 0 ? 1 : -1) : (s === 1 ? 0 : -1)),
  logab: (s, d) => (d > 0 ? (s === 1 ? 0 : -1) : (s === 0 ? 1 : -1)),
  int: (s, d) => (d > 0 ? (s === 1 ? -1 : 1) : (s === 2 ? -1 : 2)),
  ddx: (s, d) => (d > 0 ? (s === 0 ? 1 : -1) : (s === 1 ? 0 : -1)),
  d2dx: (s, d) => (d > 0 ? (s === 0 ? 1 : -1) : (s === 1 ? 0 : -1)),
  sum: (s, d) => (d > 0 ? (s === 0 || s === 3 ? 2 : -1) : (s === 3 ? -1 : 3))
};

class MathEd {
  constructor(math) {
    this.math = math !== false;
    this.root = [];
    this.row = this.root;
    this.i = 0;
    this.lay = null;                  // последняя раскладка (для ▲▼ по ближайшему месту)
  }
  get empty() { return !this.root.length; }
  clear() { this.root = []; this.row = this.root; this.i = 0; }
  set(row, atStart) { this.root = cloneRow(row || []); this.row = this.root; this.i = atStart ? 0 : this.root.length; }
  get() { return cloneRow(this.root); }
  tokens() { return rowTokens(this.root); }

  parentOf(row) {
    const find = (r) => {
      for (let idx = 0; idx < r.length; idx++) {
        const it = r[idx];
        if (typeof it === 'string') continue;
        for (let slot = 0; slot < it.s.length; slot++) {
          if (it.s[slot] === row) return { row: r, idx, node: it, slot };
          const q = find(it.s[slot]);
          if (q) return q;
        }
      }
      return null;
    };
    return row === this.root ? null : find(this.root);
  }

  ins(tok) { this.row.splice(this.i, 0, tok); this.i++; }
  insAll(toks) { for (const t of toks) this.ins(t); }
  tpl(type, first) {
    const node = { t: type, s: Array.from({ length: TPL_SLOTS[type] }, () => []) };
    this.row.splice(this.i, 0, node);
    this.row = node.s[first || 0];
    this.i = 0;
    return node;
  }

  right() {
    if (this.i < this.row.length) {
      const it = this.row[this.i];
      if (typeof it === 'object') { this.row = it.s[0]; this.i = 0; } else this.i++;
      return true;
    }
    const p = this.parentOf(this.row);
    if (!p) { if (!this.root.length) return false; this.i = 0; return true; }
    if (p.slot + 1 < p.node.s.length) { this.row = p.node.s[p.slot + 1]; this.i = 0; }
    else { this.row = p.row; this.i = p.idx + 1; }
    return true;
  }
  left() {
    if (this.i > 0) {
      const it = this.row[this.i - 1];
      if (typeof it === 'object') { this.row = it.s[it.s.length - 1]; this.i = this.row.length; } else this.i--;
      return true;
    }
    const p = this.parentOf(this.row);
    if (!p) { if (!this.root.length) return false; this.i = this.root.length; return true; }
    if (p.slot > 0) { this.row = p.node.s[p.slot - 1]; this.i = this.row.length; }
    else { this.row = p.row; this.i = p.idx; }
    return true;
  }
  vert(dir) {
    let row = this.row;
    const here = this.lay ? curOf(this.lay, this.row, this.i) : null;
    for (;;) {
      const p = this.parentOf(row);
      if (!p) return false;
      const f = VMAP[p.node.t], t = f ? f(p.slot, dir) : -1;
      if (t >= 0) {
        const tr = p.node.s[t];
        let best = tr.length;
        if (here && this.lay) {
          let bd = Infinity;
          for (let k = 0; k <= tr.length; k++) {
            const c = curOf(this.lay, tr, k);
            if (c && Math.abs(c.x - here.x) < bd) { bd = Math.abs(c.x - here.x); best = k; }
          }
        }
        this.row = tr; this.i = best;
        return true;
      }
      row = p.row;
    }
  }
  del() {
    if (this.i > 0) {
      const it = this.row[this.i - 1];
      if (typeof it === 'object' && !it.s.every((r) => !r.length)) {
        this.row = it.s[it.s.length - 1]; this.i = this.row.length;
        return true;
      }
      this.row.splice(this.i - 1, 1); this.i--;
      return true;
    }
    const p = this.parentOf(this.row);
    if (!p) {
      if (!this.row.length) return false;
      const it = this.row[0];
      if (typeof it === 'object' && !it.s.every((r) => !r.length)) return false;
      this.row.splice(0, 1);
      return true;
    }
    // в начале места шаблона: шаблон раскрывается, содержимое остаётся
    const before = p.node.s.slice(0, p.slot).reduce((n, r) => n + r.length, 0);
    p.row.splice(p.idx, 1, ...[].concat(...p.node.s));
    this.row = p.row; this.i = p.idx + before;
    return true;
  }
  atTop() { return this.row === this.root; }
}

// Раскладка строки редактора с горизонтальной прокруткой: возвращает {lay, sx}
// width — ширина окна; sx — сдвиг, при котором курсор виден
function edLayout(ed, sz, width, prevSx) {
  const lay = layRow(ed.root, sz || 0, ed.math, false);
  ed.lay = lay;
  const c = curOf(lay, ed.row, ed.i);
  let sx = prevSx || 0;
  const cx = c ? c.x : 0;
  if (lay.w <= width - 3) sx = 0;
  else {
    if (cx - sx > width - 14) sx = cx - (width - 14);
    if (cx - sx < 12) sx = Math.max(0, cx - 12);
    sx = Math.max(0, Math.min(sx, lay.w - width + 14));
  }
  return { lay, sx, c };
}

// ---------- ввод в редактор ----------
// Клавиша → знак или шаблон. Возвращает true, если что-то вставлено
function typeKey(ed, k, xvar) {
  const m = ed.math;
  if (k.alpha) {
    const c = ALPHA_KEY[k.id];
    if (c) { ed.ins(c); return true; }
    return false;
  }
  if (k.shift) {
    switch (k.id) {
      case 'SQR': if (m) ed.tpl('sqrt'); else ed.ins('√'); return true;
      case 'POW': if (m) ed.tpl('root'); else ed.ins(G.XRT); return true;
      case 'LOG': if (m) ed.tpl('pow10'); else ed.ins(G.TEN); return true;
      case 'LN': if (m) ed.tpl('epow'); else ed.ins('e^'); return true;
      case 'SIN': ed.ins('sin' + INVS); return true;
      case 'COS': ed.ins('cos' + INVS); return true;
      case 'TAN': ed.ins('tan' + INVS); return true;
      case 'FRAC': if (m) { ed.tpl('mixed'); return true; } return false;
      case 'LPAR': if (m) ed.tpl('cbrt'); else ed.ins(G.CBRT); return true;
      case 'RPAR': ed.ins(G.INV); return true;
      case 'MUL': ed.ins('{'); return true;
      case 'DIV': ed.ins('}'); return true;
      case 'ADD': ed.ins('['); return true;
      case 'SUB': ed.ins(']'); return true;
      case 'DOT': ed.ins('='); return true;
      case 'EXP': ed.ins('π'); return true;
      case 'NEG': ed.ins('Ans'); return true;
      case '1': ed.ins('List '); return true;
      case '2': ed.ins('Mat '); return true;
      default: return false;
    }
  }
  if (isDigit(k.id)) { ed.ins(k.id); return true; }
  switch (k.id) {
    case 'DOT': ed.ins('.'); return true;
    case 'EXP': ed.ins(G.EE); return true;
    case 'NEG': ed.ins(G.NEG); return true;
    case 'ADD': ed.ins('+'); return true;
    case 'SUB': ed.ins('−'); return true;
    case 'MUL': ed.ins('×'); return true;
    case 'DIV': ed.ins('÷'); return true;
    case 'LPAR': ed.ins('('); return true;
    case 'RPAR': ed.ins(')'); return true;
    case 'COMMA': ed.ins(','); return true;
    case 'STO': ed.ins('→'); return true;
    case 'XTT': ed.ins(xvar || 'x'); return true;
    case 'LOG': ed.ins('log '); return true;
    case 'LN': ed.ins('ln '); return true;
    case 'SIN': ed.ins('sin '); return true;
    case 'COS': ed.ins('cos '); return true;
    case 'TAN': ed.ins('tan '); return true;
    case 'SQR': ed.ins(G.SQ); return true;
    case 'POW': if (m) ed.tpl('pow'); else ed.ins('^'); return true;
    case 'FRAC': if (m) ed.tpl('frac'); else ed.ins(G.FRC); return true;

  }
}
// Курсор и удаление. Возвращает true, если клавиша обработана
function edNav(ed, k) {
  if (k.shift || k.alpha) return false;
  switch (k.id) {
    case 'LEFT': ed.left(); return true;
    case 'RIGHT': ed.right(); return true;
    case 'UP': return ed.vert(-1);
    case 'DOWN': return ed.vert(1);
    case 'DEL': ed.del(); return true;
    default: return false;
  }
}
// Вставка пункта меню: знак, массив знаков или шаблон {tpl}
function edInsert(ed, x) {
  if (x && x.tpl) {
    if (ed.math) ed.tpl(x.tpl, x.first); else if (x.line) ed.insAll([].concat(x.line));
    return;
  }
  ed.insAll([].concat(x));
}

// ---------- меню F1–F6 ----------
// Пункт: mi('Надпись', [подменю]) | mi('Надпись', функция) | mi('Надпись', 'знак')
const mi = (l, x) => (Array.isArray(x) && x.length && (x[0] === null || typeof x[0] === 'object') && !x[0]?.tpl ? { l, sub: x } : typeof x === 'function' ? { l, fn: x } : { l, ins: x });
class FMenu {
  constructor(items) { this.stack = [{ items, page: 0 }]; }
  get top() { return this.stack[this.stack.length - 1]; }
  get depth() { return this.stack.length; }
  view() {
    const { items, page } = this.top;
    if (items.length <= 6) return [...items, null, null, null, null, null, null].slice(0, 6);
    const v = items.slice(page * 5, page * 5 + 5);
    while (v.length < 5) v.push(null);
    v.push({ l: '▷', next: true });
    return v;
  }
  labels() {
    return this.view().map((it) => it && { l: typeof it.l === 'function' ? it.l() : it.l, k: it.sub ? 'sub' : 'cmd' });
  }
  // n = 0…5. Возвращает пункт для исполнения (fn/ins) или null
  press(n) {
    const it = this.view()[n];
    if (!it) return null;
    if (it.next) { const t = this.top; t.page = (t.page + 1) % Math.ceil(t.items.length / 5); return null; }
    if (it.sub) { this.stack.push({ items: it.sub, page: 0 }); return null; }
    return it;
  }
  back() { if (this.stack.length > 1) { this.stack.pop(); return true; } return false; }

}

function pushModal(m) { UI.modals.push(m); }

// Сообщение об ошибке; onClose — после EXIT
function errorBox(type, onClose) {

// Нарисовать редактор в окне (x, y — левый край и средняя линия). Возвращает раскладку
function drawEd(ed, x, yc, width, o) {
  o = o || {};

// ---------- нажатия ----------
let saveTimer = 0;
function saveSoon() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 500);
}

function openApp(id, arg) {
  const app = UI.apps[id];
  if (!app) return;
  UI.modals.length = 0;
  if (UI.app && UI.app !== app && UI.app.leave) UI.app.leave();
  UI.app = app; UI.appId = id;
  if (app.enter) app.enter(arg);
}

function press(id) {
  UI.lastKeyAt = Date.now();
  UI.blink = true;
  if (UI.off) { if (id === 'AC') { UI.off = false; redraw(); } return; }
  if (id === 'SHIFT') { UI.shift = !UI.shift; redraw(); return; }
  if (id === 'ALPHA') {
    if (UI.shift) { UI.alock = true; UI.alpha = true; UI.shift = false; }
    else if (UI.alock) { UI.alock = false; UI.alpha = false; }
    else UI.alpha = !UI.alpha;
    redraw();
    return;
  }
  const k = { id, shift: UI.shift, alpha: UI.alpha && !UI.shift };
  UI.shift = false;
  if (!UI.alock) UI.alpha = false;
  const top = UI.modals.length ? UI.modals[UI.modals.length - 1] : UI.app;
  try {
    if (k.shift && id === 'AC') { UI.off = true; UI.modals.length = 0; }
    else if (id === 'MENU' && !(top && top.lock)) {
      if (k.shift) { if (!UI.modals.length && UI.app.setup) openSetup(UI.app.setup(), () => UI.app.onSetup && UI.app.onSetup()); }
      else openApp('menu');
    } else if (top && top.key) top.key(k);
  } catch (e) {
    if (e instanceof CalcError) errorBox(e.type);
    else if (e instanceof RangeError) errorBox('Stack ERROR');
    else throw e;
  }
  redraw();
  saveSoon();
}

function redraw() {
  if (!lcd.g) return;
  UI.sawCursor = false;
  lcd.begin();
  if (UI.off) { lcd.rect(0, 0, LW, LH, '#15181c'); return; }
  if (UI.app) UI.app.draw();
  for (const m of UI.modals) m.draw();
}

// Касание экрана: строка меню работает как F1–F6, остальное — на усмотрение режима
function lcdTap(x, y) {
  const top = UI.modals.length ? UI.modals[UI.modals.length - 1] : UI.app;
  if (y >= 192 && !(top && top.noFTap)) { press('F' + (Math.min(5, Math.floor(x / 64)) + 1)); return; }
  if (top && top.tap) { UI.lastKeyAt = Date.now(); top.tap(x, y); redraw(); saveSoon(); }
}

// ---------- клавиши на странице ----------
function buildKeys() {
  const cell = ([id, label, sh, al, cls], extra) =>
    `<div class="kc"><div class="lg${al ? '' : ' c'}"><span class="ls">${sh || ''}</span>${al ? `<span class="la">${al}</span>` : ''}</div>` +
    `<button type="button" class="key ${cls || ''} ${extra || ''}" data-k="${id}" aria-label="${id}">${label}</button></div>`;
  document.getElementById('k-f').innerHTML = KEYS_F.map((k) => cell(k, 'f')).join('');
  const dpad = '<div class="dpad-cell"><div class="dpad">' + ['UP', 'DOWN', 'LEFT', 'RIGHT'].map((d) => `<button type="button" class="dp" data-k="${d}" aria-label="${d}"><i></i></button>`).join('') + '</div></div>';
  document.getElementById('k-nav').innerHTML = KEYS_NAV.slice(0, 4).map((k) => cell(k)).join('') + dpad + KEYS_NAV.slice(4).map((k) => cell(k)).join('');
  document.getElementById('k-fn').innerHTML = KEYS_FN.map((k) => cell(k)).join('');
  document.getElementById('k-num').innerHTML = KEYS_NUM.map((k) => cell(k)).join('');

  const calc = document.getElementById('calc');
  const held = new Map();             // pointerId → {el, timers}
  const release = (pid) => {
    const h = held.get(pid);
    if (!h) return;
    h.el.classList.remove('on');
    clearTimeout(h.t1); clearInterval(h.t2);
    held.delete(pid);
  };
  calc.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('[data-k]');
    if (!el) return;
    e.preventDefault();
    const id = el.dataset.k;
    el.classList.add('on');
    if (UI.vib && navigator.vibrate) { try { navigator.vibrate(8); } catch (err) { /* не поддерживается */ } }
    const h = { el, t1: 0, t2: 0 };
    held.set(e.pointerId, h);
    press(id);
    if (REPEAT_KEYS.has(id)) h.t1 = setTimeout(() => { h.t2 = setInterval(() => press(id), 85); }, 420);
  });
  for (const ev of ['pointerup', 'pointercancel']) window.addEventListener(ev, (e) => release(e.pointerId));
  calc.addEventListener('pointerout', (e) => {
    const h = held.get(e.pointerId);
    if (h && !h.el.contains(e.relatedTarget)) release(e.pointerId);
  });
  for (const ev of ['contextmenu', 'dblclick', 'gesturestart', 'selectstart']) calc.addEventListener(ev, (e) => e.preventDefault());

  const cv = document.getElementById('lcd');
  cv.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    lcdTap((e.clientX - r.left) * LW / r.width, (e.clientY - r.top) * LH / r.height);
  });

  // клавиатура компьютера
  const map = {
    Enter: 'EXE', Backspace: 'DEL', Delete: 'AC', Escape: 'EXIT', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT', ArrowUp: 'UP', ArrowDown: 'DOWN',
    '+': 'ADD', '-': 'SUB', '*': 'MUL', '/': 'DIV', '^': 'POW', '(': 'LPAR', ')': 'RPAR', ',': 'COMMA', '.': 'DOT', x: 'XTT', X: 'XTT',
    F1: 'F1', F2: 'F2', F3: 'F3', F4: 'F4', F5: 'F5', F6: 'F6'
  };
  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || !document.getElementById('sheet').hidden) return;
    const id = map[e.key] || (/^[0-9]$/.test(e.key) ? e.key : null);
    if (!id) return;
    e.preventDefault();
    press(id);
  });
}

// ---------- размеры корпуса под экран устройства ----------
function layoutCalc() {
  const app = document.getElementById('app'), calc = document.getElementById('calc');
  const cs = getComputedStyle(app);
  const W = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const H = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (!(W > 50 && H > 50)) return;
  const land = W > H * 1.08;
  const set = (o) => { for (const k in o) calc.style.setProperty(k, typeof o[k] === 'number' ? o[k].toFixed(2) + 'px' : o[k]); };
  calc.classList.toggle('land', land);
  let cw, chh, full;
  if (!land) {
    // книжная: экран сверху, клавиши снизу. 8.8 рядов клавиш: F (0.8) + 2 + 2 + 4
    const fit = (w) => {
      const pad = Math.max(6, w * 0.026), bez = Math.max(5, w * 0.022);
      const lcdW = w - 2 * pad - 2 * bez, lcdH = lcdW * LH / LW;
      const fixed = 2 * pad + pad * 1.9 + lcdH + 2 * bez + 3;
      return { pad, bez, fixed, rh: (H - fixed) / 8.8 };
    };
    cw = Math.min(W, H * 0.6);
    let f = fit(cw);
    if (f.rh < cw * 0.118) {          // низкое окно: уменьшаем корпус целиком
      for (let i = 0; i < 30 && f.rh < cw * 0.118; i++) { cw *= 0.97; f = fit(cw); }
    }
    const rh = Math.min(f.rh, cw * 0.185);
    chh = f.fixed + rh * 8.8;
    full = cw >= W - 1 && chh >= H - 1;
    set({ '--pad': f.pad, '--bez': f.bez, '--gap': Math.max(3, cw * 0.012), '--rh': rh, '--rh2': rh, width: cw, height: chh, '--rw': 'auto' });
  } else {
    // альбомная: слева экран, F1–F6 и блок курсора; справа остальные клавиши
    const pad = Math.max(6, Math.min(W, H) * 0.022), bez = Math.max(5, pad * 0.85);
    const gapX = pad * 1.4, head = pad * 1.9;
    const rhMin = Math.max(42, H * 0.1);
    let lcdW = Math.min(W * 0.53, (H - 2 * pad - head - 2 * bez - 3 - 2.8 * rhMin) * LW / LH);
    lcdW = Math.max(200, lcdW);
    const lcdH = lcdW * LH / LW;
    const leftW = lcdW + 2 * bez;
    const rw = Math.min(W - 2 * pad - gapX - leftW, leftW * 1.2, H * 1.1);
    const rh2 = Math.min((H - 2 * pad) / 6, rw / 6 * 1.35);
    const rh = Math.min((H - 2 * pad - head - lcdH - 2 * bez - 3) / 2.8, leftW / 6 * 1.05, rh2 * 1.12);
    cw = 2 * pad + leftW + gapX + rw;
    chh = Math.max(head + lcdH + 2 * bez + 3 + rh * 2.8, rh2 * 6) + 2 * pad;
    full = cw >= W - 1 && chh >= H - 1;
    set({ '--pad': pad, '--bez': bez, '--gap': Math.max(3, rw * 0.012), '--rh': rh, '--rh2': rh2, width: cw, height: chh, '--rw': rw.toFixed(2) + 'px' });
    calc.querySelector('.left').style.width = leftW.toFixed(2) + 'px';
  }
  if (!land) calc.querySelector('.left').style.width = '';
  calc.classList.toggle('full', full);
  calc.classList.add('ready');
  // длинные подписи над клавишами ужимаем, чтобы не обрезались
  for (const lg of calc.querySelectorAll('.lg')) {
    lg.style.fontSize = '';
    let need = 0;
    for (const sp of lg.children) need += sp.getBoundingClientRect().width;
    need += lg.children.length > 1 && lg.children[1].textContent ? 3 : 0;
    const have = lg.clientWidth - 2;
    if (need > have && have > 0) lg.style.fontSize = (parseFloat(getComputedStyle(lg).fontSize) * have / need * 0.97).toFixed(2) + 'px';
  }
  lcd.fit();
  redraw();
}

const mainMenu = {
  sel: 0, top: 0,
  enter() { const i = MAIN_MENU.findIndex((m) => m[0] === this.last); if (i >= 0) this.sel = i; this.fix(); },
  fix() {
    const row = Math.floor(this.sel / 4);
    if (row < this.top) this.top = row;
    if (row > this.top + 2) this.top = row - 2;
  },
  open(i) {
    const [id] = MAIN_MENU[i];
    this.sel = i; this.fix();
    if (UI.apps[id]) { this.last = id; openApp(id); }
    else infoBox(['Not available', 'in this version', '', 'Press:[EXIT]']);
  },
  key(k) {
    const n = MAIN_MENU.length;
    switch (k.id) {
      case 'LEFT': this.sel = (this.sel + n - 1) % n; break;
      case 'RIGHT': this.sel = (this.sel + 1) % n; break;
      case 'UP': this.sel = this.sel - 4 >= 0 ? this.sel - 4 : Math.min(n - 1, this.sel + 4 * Math.floor((n - 1 - this.sel) / 4)); break;
      case 'DOWN': this.sel = this.sel + 4 < n ? this.sel + 4 : this.sel % 4; break;
      case 'EXE': this.open(this.sel); return;
      default: {
        const c = isDigit(k.id) ? k.id : ALPHA_KEY[k.id];
        const i = c ? MAIN_MENU.findIndex((m) => m[2] === c) : -1;
        if (i >= 0) { this.open(i); return; }
      }
    }
    this.fix();
  },
  tap(x, y) {
    if (y < 24) return;
    const col = Math.min(3, Math.floor((x - 2) / 94)), row = Math.floor((y - 26) / 63) + this.top;
    const i = row * 4 + col;
    if (i >= 0 && i < MAIN_MENU.length) this.open(i);
  },
  draw() {
    const g = lcd.g;
    statusBar([]);
    lcd.mini(LW / 2 + 20, 4, 'MAIN MENU', { px: 13, align: 'c' });
    for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
      const i = (this.top + r) * 4 + c;
      if (i >= MAIN_MENU.length) continue;
      const [id, name, key] = MAIN_MENU[i];
      const x = 3 + c * 94, y = 27 + r * 63, w = 90, h = 60;
      const on = i === this.sel, live = !!UI.apps[id];
      lcd.rrect(x, y, w, h, 5, on ? '#000' : '#fff', on ? '#000' : '#b9c0ca', 1);
      const p = !live
        ? { a: '#c4c9d1', b: '#d3d7dd', c: '#d3d7dd', d: '#c4c9d1', ink: '#b3b9c2', paper: on ? '#000' : '#fff', hole: on ? '#000' : '#fff' }
        : on
          ? { a: '#5fb0ff', b: '#ff6b6b', c: '#5fd68a', d: '#ffc233', ink: '#fff', paper: '#000', hole: '#000' }
          : { a: '#0a50d8', b: '#e0262d', c: '#16963f', d: '#e59a00', ink: '#222', paper: '#fff', hole: '#fff' };
      if (ICONS[id]) ICONS[id](g, x, y + 1, p);
      g.textAlign = 'center';
      lcd.mini(x + w / 2 - 4, y + 43, name, { px: 11.5, align: 'c', color: !live ? '#aab0b9' : on ? '#fff' : '#000', max: w - 22 });
      lcd.mini(x + w - 4, y + 45, key, { px: 10.5, align: 'r', color: !live ? '#aab0b9' : on ? '#ffd24a' : '#666' });
    }
    // полоса прокрутки
    const rows = Math.ceil(MAIN_MENU.length / 4);
    if (rows > 3) {
      lcd.rect(LW - 4, 27, 3, 186, '#dfe3e8');
      lcd.rect(LW - 4, 27 + 186 * this.top / rows, 3, 186 * 3 / rows, '#555');
    }
  }
};

  drawType: ['Draw Type', ['Connect', 'Plot']],
  deriv: ['Derivative', ['On', 'Off']],
  angle: ['Angle', ['Deg', 'Rad', 'Gra']],
  coord: ['Coord', ['On', 'Off']],
  grid: ['Grid', ['On', 'Off', 'Line']],
  axes: ['Axes', ['On', 'Off', 'Scale']],
  label: ['Label', ['On', 'Off']],
  disp: ['Display', ['Fix', 'Sci', 'Norm']],
  graphFunc: ['Graph Func', ['On', 'Off']],
  statWind: ['Stat Wind', ['Auto', 'Manual']],
  q1q3: ['Q1Q3 Type', ['Std', 'OnData']],
