};
const SETUP_RUN = ['io', 'frac', 'funcType', 'drawType', 'deriv', 'angle', 'coord', 'grid', 'axes', 'label', 'disp', 'q1q3'];

function openSetup(keys, onClose) {
  const scr = {
    sel: 0, top: 0, ask: null,
    key(k) {
      if (this.ask) {                  // ждём число знаков для Fix/Sci
        if (isDigit(k.id)) { S.disp = this.ask; S.dispN = Number(k.id); this.ask = null; }
        else if (k.id === 'EXIT' || k.id === 'AC') this.ask = null;
        return;
      }
      const key = keys[this.sel], opts = SETUP_DEF[key][1];
      const f = fIndex(k);
      if (f >= 0 && f < opts.length) {
        if (key === 'disp') {
          if (opts[f] === 'Norm') { S.dispN = S.disp === 'Norm' && S.dispN === 1 ? 2 : 1; S.disp = 'Norm'; }
          else this.ask = opts[f];
        } else S[key] = opts[f];
        return;
      }
      if (k.id === 'UP') this.sel = (this.sel + keys.length - 1) % keys.length;
      else if (k.id === 'DOWN') this.sel = (this.sel + 1) % keys.length;
      else if (k.id === 'EXIT' || k.id === 'EXE') { popModal(); if (onClose) onClose(); return; }
      if (this.sel < this.top) this.top = this.sel;
      if (this.sel > this.top + 6) this.top = this.sel - 6;
    },
    draw() {
      lcd.rect(0, 23, LW, LH - 23, '#fff');
      for (let r = 0; r < 7; r++) {
        const i = this.top + r;
        if (i >= keys.length) break;
        const key = keys[i], [label] = SETUP_DEF[key];
        const val = key === 'disp' ? dispTag() : S[key];
        const y = 24 + r * 24;
        if (i === this.sel) { lcd.rect(0, y, LW, 24, HILITE); lcd.text(0, y, label, { color: '#fff' }); lcd.text(13 * 18, y, ':' + val, { color: '#fff' }); }
        else { lcd.text(0, y, label); lcd.text(13 * 18, y, ':' + val); }
      }
      if (this.top > 0) lcd.glyph('▲', LW - 9, 34, 12, '#000');
      if (this.top + 7 < keys.length) lcd.glyph('▼', LW - 9, 184, 12, '#000');
      lcd.fmenu(SETUP_DEF[keys[this.sel]][1].map((l) => ({ l, k: 'cmd' })));
      if (this.ask) lcd.popup([this.ask + ' [0~9]', '', 'Press a digit'], { w: 280 });
    }
  };
  pushModal(scr);
}

// Число в ограниченную ширину (n знаков): убираем лишние цифры
function fmtFit(v, n) {
  let s = fmtNum(v);
  if ([...s].length <= n) return s;
  for (let d = 9; d >= 1; d--) {
    s = fmtNum(Number(v.toPrecision(d)), { disp: 'Norm', dispN: S.dispN });
    if ([...s].length <= n) return s;
  }
  for (let d = 5; d >= 1; d--) {
    s = fmtNum(v, { disp: 'Sci', dispN: d });
    if ([...s].length <= n) return s;
  }
  return s;
}

// Просмотр списка (ответ в виде списка)
function listView(title, arr) {
  pushModal({
    sel: 0, top: 0,
    key(k) {
      const n = arr.length;
      if (k.id === 'UP') this.sel = (this.sel + n - 1) % n;
      else if (k.id === 'DOWN') this.sel = (this.sel + 1) % n;
      else if (['EXIT', 'EXE', 'AC'].includes(k.id)) { popModal(); return; }
      if (this.sel < this.top) this.top = this.sel;
      if (this.sel > this.top + 4) this.top = this.sel - 4;
    },
    draw() {
      lcd.rect(0, 23, LW, LH - 23, '#fff');
      lcd.text(108, 24, title);
      lcd.line(0, 47.5, LW, 47.5, '#000', 1);
      for (let r = 0; r < 5; r++) {
        const i = this.top + r;
        if (i >= arr.length) break;
        const y = 48 + r * 24, idx = String(i + 1);
        lcd.text(72 - idx.length * 18, y, idx);
        const s = fmtFit(arr[i].v, 15);
        if (i === this.sel) lcd.rect(90, y, 15 * 18 + 6, 24, HILITE);
        lcd.text(90 + (15 - [...s].length) * 18, y, s, { color: i === this.sel ? '#fff' : '#000' });
      }
      lcd.line(81.5, 48, 81.5, 168, '#000', 1);
      lcd.line(0, 168.5, LW, 168.5, '#000', 1);
      const s = fmtNum(arr[this.sel].v);
      lcd.text(LW - 4 - [...s].length * 18, 169, s);
    }
  });
}

// Просмотр матрицы
function matView(title, m) {
  pushModal({
    r: 0, c: 0, top: 0, left: 0,
    key(k) {
      const R0 = m.length, C0 = m[0].length;
      if (k.id === 'UP') this.r = Math.max(0, this.r - 1);
      else if (k.id === 'DOWN') this.r = Math.min(R0 - 1, this.r + 1);
      else if (k.id === 'LEFT') this.c = Math.max(0, this.c - 1);
      else if (k.id === 'RIGHT') this.c = Math.min(C0 - 1, this.c + 1);
      else if (['EXIT', 'EXE', 'AC'].includes(k.id)) { popModal(); return; }
      if (this.r < this.top) this.top = this.r;
      if (this.r > this.top + 3) this.top = this.r - 3;
      if (this.c < this.left) this.left = this.c;
      if (this.c > this.left + 2) this.left = this.c - 2;
    },
    draw() {
      lcd.rect(0, 23, LW, LH - 23, '#fff');
      lcd.text(4, 24, title);
      for (let c = 0; c < 3; c++) {
        const j = this.left + c;
        if (j >= m[0].length) break;
        lcd.text(40 + c * 114 + 78, 24, String(j + 1));
      }
      for (let r = 0; r < 4; r++) {
        const i = this.top + r;
        if (i >= m.length) break;
        const y = 48 + r * 24;
        lcd.text(4, y, String(i + 1));
        for (let c = 0; c < 3; c++) {
          const j = this.left + c;
          if (j >= m[0].length) break;
          const s = fmtFit(m[i][j].v, 6), x = 36 + c * 114;
          const on = i === this.r && j === this.c;
          if (on) lcd.rect(x, y, 112, 24, HILITE);
          lcd.text(x + 110 - [...s].length * 18, y, s, { color: on ? '#fff' : '#000' });
        }
      }
      lcd.frame(33, 47, LW - 34, 98, '#000', 1);
      const s = fmtNum(m[this.r][this.c].v);
      lcd.text(LW - 4 - [...s].length * 18, 169, s);
    }
  });
}

const T = (tpl, line) => ({ tpl, line });
const MATH_MENU = [
  mi('logab', T('logab', 'logab(')), mi('Abs', T('abs', 'Abs ')), mi('d/dx', T('ddx', 'd/dx(')), mi('d²/dx²', T('d2dx', 'd²/dx²(')),
  mi('∫dx', T('int', '∫(')), mi('Σ(', T('sum', 'Σ('))
];
const notHere = (what) => () => infoBox([what, 'not available', '', 'Press:[EXIT]']);
const OPTN_RUN = [
  mi('LIST', [mi('List', 'List '), mi('Lst→Mat', 'List→Mat('), mi('Dim', 'Dim '), mi('Fill(', 'Fill('), mi('Seq', 'Seq('),
    mi('Min', 'Min('), mi('Max', 'Max('), mi('Mean', 'Mean('), mi('Median', 'Median('), mi('Augment', 'Augment('),
    mi('Sum', 'Sum '), mi('Prod', 'Prod '), mi('Cuml', 'Cuml '), mi('%', 'Percent '), mi('ΔList', 'ΔList ')]),
  mi('MAT/VCT', [mi('Mat', 'Mat '), mi('Mat→Lst', 'Mat→List('), mi('Det', 'Det '), mi('Trn', 'Trn '), mi('Augment', 'Augment('),
    mi('Identity', 'Identity '), mi('Dim', 'Dim '), mi('Fill(', 'Fill('), mi('Ref', 'Ref '), mi('Rref', 'Rref ')]),
  mi('COMPLEX', notHere('Complex numbers')),
  mi('CALC', [mi('Solve', 'Solve('), mi('d/dx', T('ddx', 'd/dx(')), mi('d²/dx²', T('d2dx', 'd²/dx²(')), mi('∫dx', T('int', '∫(')), mi('SolveN', 'SolveN('),
    mi('FMin', 'FMin('), mi('FMax', 'FMax('), mi('Σ(', T('sum', 'Σ(')), mi('logab', T('logab', 'logab(')), mi('Int÷', 'Int÷'),
    mi('Rmdr', 'Rmdr')]),
  mi('STAT', [
    mi('DIST', [mi('NORM', [mi('Npd', 'NormPD('), mi('Ncd', 'NormCD('), mi('InvN', 'InvNormCD(')]),
      mi('BINOMIAL', [mi('Bpd', 'BinomialPD('), mi('Bcd', 'BinomialCD(')]),
      mi('POISSON', [mi('Ppd', 'PoissonPD('), mi('Pcd', 'PoissonCD(')])]),
    mi('StdDev', 'StdDev('), mi('Var', 'Variance(')]),
  mi('CONVERT', notHere('Unit conversion')),
  mi('HYPERBL', [mi('sinh', 'sinh '), mi('cosh', 'cosh '), mi('tanh', 'tanh '), mi('sinh' + G.INV, 'sinh' + INVS), mi('cosh' + G.INV, 'cosh' + INVS), mi('tanh' + G.INV, 'tanh' + INVS)]),
  mi('PROB', [mi('x!', '!'), mi('nPr', G.PERM), mi('nCr', G.COMB),
    mi('RAND', [mi('Ran#', 'Ran# '), mi('Int', 'RanInt#('), mi('Norm', 'RanNorm#('), mi('Bin', 'RanBin#('), mi('List', 'RanList#(')]),
    mi('P(', 'P('), mi('Q(', 'Q('), mi('R(', 'R(')]),
  mi('NUMERIC', [mi('Abs', T('abs', 'Abs ')), mi('Int', 'Int '), mi('Frac', 'Frac '), mi('Intg', 'Intg '), mi('RndFix', 'RndFix('),
    mi('GCD', 'GCD('), mi('LCM', 'LCM('), mi('MOD', 'MOD('), mi('MOD_Exp', 'MOD_Exp(')]),
  mi('ANGLE', [mi('°', '°'), mi('r', G.RAD), mi('g', G.GRA), mi('Pol(', 'Pol('), mi('Rec(', 'Rec(')])
];
const VARS_RUN = [null, null, null, mi('GRAPH', [mi('Y', G.YV)])];

const ANS_KEYS = new Set(['ADD', 'SUB', 'MUL', 'DIV', 'POW', 'SQR', 'STO']);

const runApp = {
  hist: [], ed: null, sel: -1, off: 0, menu: null, base: null,

  enter() {
    if (!this.ed) this.ed = new MathEd(S.io === 'Math');
    this.syncMode();
    this.setBase();
  },
  syncMode() {
    const m = S.io === 'Math';
    if (this.ed.math !== m) { this.ed = new MathEd(m); this.sel = -1; }
  },
  setBase() {
    const items = [
      mi('JUMP', [mi('TOP', () => this.jump(0)), mi('BOTTOM', () => this.jump(-1))]),
      mi('DELETE', [mi('DEL-LINE', () => this.delLine()), mi('DEL-ALL', () => confirmBox(['Delete All?', ''], () => { this.hist = []; this.sel = -1; this.ed.clear(); }))]),
      mi('▶MAT/VCT', () => { if (typeof openMatList === 'function') openMatList(); })
    ];
    if (S.io === 'Math') items.push(mi('MATH', MATH_MENU));
    this.base = new FMenu(items);
    this.menu = this.base;
  },
  setup() { return SETUP_RUN; },
  onSetup() { this.syncMode(); this.setBase(); },

  jump(i) {
    if (i < 0 || !this.hist.length) { this.sel = -1; this.ed.clear(); return; }
    this.sel = 0; this.ed.set(this.hist[0].row);
  },
  delLine() {
    if (this.sel < 0) return;
    this.hist.splice(this.sel, 1);
    if (this.sel >= this.hist.length) { this.sel = -1; this.ed.clear(); } else this.ed.set(this.hist[this.sel].row);
  },

  // Вычислить строку → запись истории. Ошибки калькулятора пробрасываются
  run1(row, math, show) {
    const e = { row, math, kind: 'num', val: null, mode: 'auto', frac: null };
    const v = evalTokens(rowTokens(row));
    if (isNum(v)) { e.val = v; mem.ans = v; }
    else if (isL(v)) { e.kind = 'done'; mem.listAns = v.a; if (show) listView('Ans', v.a); }
    else if (isM(v)) { e.kind = 'done'; mem.matAns = v.m; if (show) matView('Ans', v.m); }
    else e.kind = 'done';
    return e;
  },
  exe() {
    if (this.ed.empty) {
      if (this.sel >= 0 || !this.hist.length) return;
      const last = this.hist[this.hist.length - 1];
      this.hist.push(this.run1(cloneRow(last.row), last.math, true));
    } else if (this.sel >= 0) {
      const at = this.sel;
      this.hist[at] = this.run1(this.ed.get(), this.ed.math, at === this.hist.length - 1);
      for (let i = at + 1; i < this.hist.length; i++) {
        try { this.hist[i] = this.run1(this.hist[i].row, this.hist[i].math, false); } catch (err) {
          if (!(err instanceof CalcError)) throw err;
          this.hist[i] = { row: this.hist[i].row, math: this.hist[i].math, kind: 'err', val: null, mode: 'auto', frac: null, err: err.type };
        }
      }
    } else this.hist.push(this.run1(this.ed.get(), this.ed.math, true));
    if (this.hist.length > 60) this.hist.splice(0, this.hist.length - 60);
    this.sel = -1;
    this.ed.clear();
  },
  toggleSD(shift) {
    const e = this.sel >= 0 ? this.hist[this.sel] : this.hist[this.hist.length - 1];
    if (!e || e.kind !== 'num') return;
    const form = () => { const sv = S.frac; if (e.frac) S.frac = e.frac; try { return exactForm(e.val, e.math); } finally { S.frac = sv; } };
    if (shift) {
      if (!e.val.ex || !exIsRat(e.val.ex) || exIsInt(e.val.ex)) return;
      e.frac = (e.frac || S.frac) === 'd/c' ? 'ab/c' : 'd/c';
      e.mode = 'exact';
      return;
    }
    const shown = e.mode !== 'dec' && (e.mode === 'exact' || !e.val.dec) && form();
    if (shown) { e.mode = 'dec'; return; }
    if (!form()) {
      if (e.val.ex) return;
      const ex = ratApprox(e.val.v);
      if (!ex || exIsInt(ex)) return;
      e.val = R(e.val.v, ex, e.val.dec);
      if (!form()) { e.val = R(e.val.v, null, e.val.dec); return; }
    }
    e.mode = 'exact';
  },

  key(k) {
    const ed = this.ed;
    const f = fIndex(k);
    if (f >= 0) {
      const it = this.menu.press(f);
      if (it && it.fn) it.fn();
      else if (it && it.ins !== undefined) {
        if (ed.empty && this.sel < 0 && ['!', G.PERM, G.COMB, 'Int÷', 'Rmdr'].includes(it.ins)) ed.ins('Ans');
        edInsert(ed, it.ins);
      }
      return;
    }
    switch (k.id) {
      case 'EXIT':
        if (!this.menu.back() && this.menu !== this.base) this.menu = this.base;
        return;
      case 'OPTN': this.menu = new FMenu(OPTN_RUN); return;
      case 'VARS': if (!k.shift) this.menu = new FMenu(VARS_RUN); return;
      case 'EXE': this.exe(); return;
      case 'AC':
        if (ed.empty && this.sel >= 0) this.sel = -1;
        ed.clear();
        return;
      case 'SD': this.toggleSD(k.shift); return;
      default:
    }
    if (!k.shift && !k.alpha && (k.id === 'UP' || k.id === 'DOWN')) {
      if (ed.vert(k.id === 'UP' ? -1 : 1)) return;
      if (k.id === 'UP') {
        const t = this.sel < 0 ? this.hist.length - 1 : this.sel - 1;
        if (t >= 0) { this.sel = t; ed.set(this.hist[t].row); }
      } else if (this.sel >= 0) {
        if (this.sel + 1 < this.hist.length) { this.sel++; ed.set(this.hist[this.sel].row); } else { this.sel = -1; ed.clear(); }
      }
      return;
    }
    if (!k.shift && !k.alpha && (k.id === 'LEFT' || k.id === 'RIGHT') && ed.empty && this.sel < 0) {
      // после расчёта ◄ ► возвращают последнее выражение для правки
      if (this.hist.length) ed.set(this.hist[this.hist.length - 1].row, k.id === 'RIGHT');
      return;
    }
    if (edNav(ed, k)) return;
    if (ed.empty && this.sel < 0 && !k.alpha && ((!k.shift && ANS_KEYS.has(k.id)) || (k.shift && k.id === 'RPAR'))) ed.ins('Ans');
    typeKey(ed, k);
  },

  entryRow(e) {
    const sv = S.frac;
    if (e.frac) S.frac = e.frac;
    try { return numRow(e.val, e.mode, e.math); } finally { S.frac = sv; }
  },

  draw() {
    statusBar(stdTags());
    const top = 24, vh = 168, ed = this.ed;
    const blocks = [];
    let active = 0;
    const edBlock = () => {
      const lay = layRow(ed.root, 0, ed.math, false);
      const a = Math.max(12, lay.a), d = Math.max(12, lay.d);
      blocks.push({ h: Math.ceil(a + d), a, edit: true });
      active = blocks.length - 1;
    };
    this.hist.forEach((e, i) => {
      if (i === this.sel) edBlock();
      else {
        const lay = layRow(e.row, 0, e.math, false);
        const a = Math.max(12, lay.a), d = Math.max(12, lay.d);
        blocks.push({ h: Math.ceil(a + d), a, lay });
      }
      if (e.kind === 'num') {
        const lay = layStatic(this.entryRow(e));
        const a = Math.max(12, lay.a), d = Math.max(12, lay.d);
        blocks.push({ h: Math.ceil(a + d), a, lay, right: true });
      } else blocks.push({ h: 24, a: 12, text: e.kind === 'err' ? e.err : 'Done' });
    });
    if (this.sel < 0) edBlock();
    let total = 0;
    for (const b of blocks) { b.y = total; total += b.h; }
    // прокрутка: строка ввода и её ответ должны быть видны
    let off = this.off;
    if (this.sel < 0) off = Math.max(0, total - vh);
    else {
      const b = blocks[active], nb = blocks[active + 1];
      const bottom = nb ? nb.y + nb.h : b.y + b.h;
      if (bottom > off + vh) off = bottom - vh;
      if (b.y < off) off = b.y;
      off = Math.max(0, Math.min(off, Math.max(0, total - vh)));
    }
    this.off = off;
    lcd.clip(0, top, LW, vh);
    for (const b of blocks) {
      const y = top + b.y - off;
      if (y + b.h < top || y > top + vh) continue;
      const yc = y + b.a;
      if (b.edit) { lcd.unclip(); lcd.clip(0, top, LW, vh); drawEd(ed, 1, yc, LW - 2); }
      else if (b.text) lcd.text(LW - 2 - b.text.length * 18, y, b.text);
      else if (b.right) drawLay(b.lay, Math.max(1, LW - 2 - b.lay.w), yc);
      else { drawLay(b.lay, 1, yc); if (b.lay.w > LW - 2) { lcd.rect(LW - 12, y, 12, b.h, '#fff'); lcd.glyph('▶', LW - 6, yc, 14, '#000'); } }
    }
    lcd.unclip();
    lcd.fmenu(this.menu.labels());
  },

  save() { return { hist: this.hist.slice(-30).map((e) => ({ row: e.row, math: e.math, kind: e.kind, val: e.val, mode: e.mode, frac: e.frac, err: e.err })), cur: this.ed ? this.ed.get() : [] }; },
  load(st) {
    if (!st) return;
    this.hist = Array.isArray(st.hist) ? st.hist.filter((e) => e && Array.isArray(e.row)) : [];
    this.ed = new MathEd(S.io === 'Math');
    if (Array.isArray(st.cur) && (S.io === 'Math' || st.cur.every((t) => typeof t === 'string'))) this.ed.set(st.cur);
  }
};

// ══════ 65-func.js — функции Y1…Y20, окно просмотра (V-Window), построение, общий список функций ══════

const FN_COLORS = ['Blue', 'Red', 'Green', 'Magenta', 'Black'];
const FN_STYLES = ['Normal', 'Thick', 'Broken', 'Dot', 'Thin'];
const FN_TYPES = ['Y=', 'r=', 'Param', 'X=', 'Y>', 'Y<', 'Y≥', 'Y≤'];
const newFn = (i) => ({ type: 'Y=', row: [], row2: [], math: true, sel: false, color: FN_COLORS[i % 5], style: 'Normal' });
mem.fn = Array.from({ length: 20 }, (_, i) => newFn(i));

const fnDefined = (fn) => fn.row.length > 0 && (fn.type !== 'Param' || fn.row2.length > 0);
const fnVar = (type) => (type === 'r=' ? 'θ' : type === 'Param' ? 'T' : type === 'X=' ? 'Y' : 'X');
const fnKey = (type) => (type === 'r=' ? 'θ' : type === 'Param' ? 'T' : type === 'X=' ? 'Y' : 'x');   // что вводит клавиша X,θ,T
const fnIsY = (fn) => fn.type[0] === 'Y';                         // Y= и неравенства: функции от X
function fnLabel(i, type, part) {
  const n = i + 1;
  if (type === 'r=') return 'r' + n;
  if (type === 'Param') return (part ? 'Yt' : 'Xt') + n;
  if (type === 'X=') return 'X' + n;
  return 'Y' + n;
}
const fnRel = (type) => (type.length === 2 && type[0] === 'Y' && type !== 'Y=' ? type[1] : '=');

// Готовая к счёту функция: {f, g}; g — вторая (Yt) для параметрической
function fnGet(i) {
  const fn = mem.fn[i];
  if (!fn._c) {
    const v = fnVar(fn.type);
    fn._c = { f: compileTokens(rowTokens(fn.row), v), g: fn.type === 'Param' ? compileTokens(rowTokens(fn.row2), v) : null };
  }
  return fn._c;
}
const fnTouch = () => { for (const fn of mem.fn) fn._c = null; };
yfnHook = (n) => {
  const fn = mem.fn[n - 1];
  if (!fn || !fn.row.length || fn.type === 'Param') return null;
  try { return fnGet(n - 1).f; } catch (e) { return null; }
};

// ---------- окно просмотра ----------
const VW = { xmin: -6.3, xmax: 6.3, xscl: 1, ymin: -3.1, ymax: 3.1, yscl: 1, tmin: 0, tmax: 2 * Math.PI, tptch: 2 * Math.PI / 60 };
const GA = { x0: 2.5, w: 378, y0: 26.5, h: 186, top: 23, bottom: LH };   // область графика на экране
const X2P = (x) => GA.x0 + (x - VW.xmin) / (VW.xmax - VW.xmin) * GA.w;
const Y2P = (y) => GA.y0 + (VW.ymax - y) / (VW.ymax - VW.ymin) * GA.h;
const P2X = (px) => VW.xmin + (px - GA.x0) / GA.w * (VW.xmax - VW.xmin);
const P2Y = (py) => VW.ymax - (py - GA.y0) / GA.h * (VW.ymax - VW.ymin);
const xDot = () => (VW.xmax - VW.xmin) / GA.w;
const yDot = () => (VW.ymax - VW.ymin) / GA.h;
const angFull = () => (S.angle === 'Deg' ? 360 : S.angle === 'Gra' ? 400 : 2 * Math.PI);
function vwSet(name) {
  const full = angFull();

  else if (name === 'TRIG') Object.assign(VW, { xmin: -1.5 * full, xmax: 1.5 * full, xscl: full / 4, ymin: -1.6, ymax: 1.6, yscl: 0.5 });
  else if (name === 'STANDRD') Object.assign(VW, { xmin: -10, xmax: 10, xscl: 1, ymin: -10, ymax: 10, yscl: 1 });

}
const vwOk = () => VW.xmax > VW.xmin && VW.ymax > VW.ymin && [VW.xmin, VW.xmax, VW.ymin, VW.ymax].every(Number.isFinite);
const clampP = (p) => (p < -4000 ? -4000 : p > 4000 ? 4000 : p);

// ---------- построение ----------
// Разрыв между соседними точками: значение уходит в бесконечность или скачет
function isJump(f, x0, y0, x1, y1) {
  const d0 = Math.abs(y1 - y0);
  if (d0 / yDot() < 40) return false;
  let a = x0, ya = y0, b = x1, yb = y1;
  for (let i = 0; i < 7; i++) {
    const m = (a + b) / 2, ym = f(m);
    if (!Number.isFinite(ym)) return true;
    if (ym < Math.min(ya, yb) - 1e-9 * d0 || ym > Math.max(ya, yb) + 1e-9 * d0) return true;
    if (Math.abs(ym - ya) > Math.abs(yb - ym)) { b = m; yb = ym; } else { a = m; ya = ym; }
  }
  return Math.abs(yb - ya) > 0.6 * d0;
}
// Точки функции y = f(x) по всей ширине экрана: [[px, py] | null (разрыв)]
function sampleY(f) {
  const pts = [];
  let px0 = 0, x0 = 0, y0 = NaN;
  for (let i = 0; i <= 768; i++) {
    const px = i / 2, x = P2X(px), y = f(x);
    if (Number.isFinite(y)) {
      if (Number.isFinite(y0) && isJump(f, x0, y0, x, y)) pts.push(null);
      pts.push([px, clampP(Y2P(y))]);
    } else if (pts.length && pts[pts.length - 1]) pts.push(null);
    px0 = px; x0 = x; y0 = y;
  }
  return pts;
}
function sampleX(f) {                 // x = f(y)
  const pts = [];
  for (let i = 0; i <= 384; i++) {
    const py = GA.top + i / 2, x = f(P2Y(py));
    if (Number.isFinite(x)) pts.push([clampP(X2P(x)), py]); else if (pts.length && pts[pts.length - 1]) pts.push(null);
  }
  return pts;
}
function sampleT(c, polar) {           // параметрическая или полярная
  const pts = [];
  const n = Math.min(6000, Math.floor((VW.tmax - VW.tmin) / VW.tptch + 1e-9));
  if (!(VW.tptch > 0) || !(n >= 0)) return pts;
  for (let i = 0; i <= n; i++) {
    const t = VW.tmin + i * VW.tptch;
    let x, y;
    if (polar) { const r = c.f(t); x = r * fCos(t); y = r * fSin(t); } else { x = c.f(t); y = c.g(t); }
    if (Number.isFinite(x) && Number.isFinite(y)) pts.push([clampP(X2P(x)), clampP(Y2P(y))]); else if (pts.length && pts[pts.length - 1]) pts.push(null);
  }
  return pts;
}
function strokePts(pts, color, style) {
  const g = lcd.g;
  const lw = style === 'Thick' ? 3.6 : style === 'Thin' ? 1 : 2;
  g.strokeStyle = color; g.fillStyle = color; g.lineJoin = 'round'; g.lineCap = 'round'; g.lineWidth = lw;
  if (S.drawType === 'Plot') {
    for (const p of pts) if (p && Number.isInteger(p[0] * 2)) g.fillRect(p[0] - lw / 2, p[1] - lw / 2, lw, lw);
    return;
  }
  g.setLineDash(style === 'Broken' ? [6, 5] : style === 'Dot' ? [0.1, 5] : []);
  g.beginPath();
  let run = 0, last = null;
  const dot = () => { if (run === 1 && last) { g.moveTo(last[0], last[1]); g.lineTo(last[0] + 0.01, last[1]); } };
  for (const p of pts) {
    if (!p) { dot(); run = 0; continue; }
    if (run) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]);
    run++; last = p;
  }
  dot();
  g.stroke();
  g.setLineDash([]);
}
// Сетка и оси
function drawAxes() {
  const g = lcd.g;
  const x0 = X2P(0), y0 = Y2P(0);
  const step = (scl, dot) => (scl > 0 && scl / dot >= 4 ? scl : 0);
  const sx = step(VW.xscl, xDot()), sy = step(VW.yscl, yDot());
  const ticks = (lo, hi, s, fn) => { if (!s) return; const n0 = Math.ceil(lo / s - 1e-9), n1 = Math.floor(hi / s + 1e-9); if (n1 - n0 > 400) return; for (let n = n0; n <= n1; n++) fn(n * s, n); };
  if (S.grid !== 'Off' && sx && sy) {
    if (S.grid === 'Line') {
      g.strokeStyle = '#c9d6e6'; g.lineWidth = 1;
      g.beginPath();
      ticks(P2X(0), P2X(LW), sx, (x) => { const px = Math.round(X2P(x)) + 0.5; g.moveTo(px, GA.top); g.lineTo(px, GA.bottom); });
      ticks(P2Y(GA.bottom), P2Y(GA.top), sy, (y) => { const py = Math.round(Y2P(y)) + 0.5; g.moveTo(0, py); g.lineTo(LW, py); });
      g.stroke();
    } else {
      g.fillStyle = '#000';
      ticks(P2X(0), P2X(LW), sx, (x) => ticks(P2Y(GA.bottom), P2Y(GA.top), sy, (y) => g.fillRect(Math.round(X2P(x)), Math.round(Y2P(y)), 1, 1)));
    }
  }
  if (S.axes === 'Off') return;
  g.strokeStyle = '#000'; g.lineWidth = 1;
  g.beginPath();
  if (y0 >= GA.top && y0 <= GA.bottom) {
    const py = Math.round(y0) + 0.5;
    g.moveTo(0, py); g.lineTo(LW, py);
    ticks(P2X(0), P2X(LW), sx, (x) => { const px = Math.round(X2P(x)) + 0.5; g.moveTo(px, py - 2.5); g.lineTo(px, py + 2.5); });
  }
  if (x0 >= 0 && x0 <= LW) {
    const px = Math.round(x0) + 0.5;
    g.moveTo(px, GA.top); g.lineTo(px, GA.bottom);
    ticks(P2Y(GA.bottom), P2Y(GA.top), sy, (y) => { const py = Math.round(Y2P(y)) + 0.5; g.moveTo(px - 2.5, py); g.lineTo(px + 2.5, py); });
  }
  g.stroke();
  const ax = Math.max(0, Math.min(LW, x0)), ay = Math.max(GA.top, Math.min(GA.bottom, y0));
  if (S.axes === 'Scale') {
    if (sx && sx / xDot() >= 22) ticks(P2X(0), P2X(LW), sx, (x, n) => { if (n) lcd.mini(X2P(x), Math.min(GA.bottom - 14, ay + 3), fmtFit(r15(x), 5), { px: 10, align: 'c', bold: false }); });
    if (sy && sy / yDot() >= 12) ticks(P2Y(GA.bottom), P2Y(GA.top), sy, (y, n) => { if (n) lcd.mini(Math.max(4, ax - 4), Y2P(y) - 6, fmtFit(r15(y), 5), { px: 10, align: ax < 30 ? 'l' : 'r', bold: false }); });
  }
  if (S.label === 'On') {
    lcd.mini(LW - 4, Math.max(GA.top + 1, Math.min(GA.bottom - 15, ay - 15)), 'x', { px: 13, align: 'r' });

// Подпись функции мелким шрифтом (для экрана графика): «Y1=x²−2»
function fnCaption(i, x, y, color, part) {
  const fn = mem.fn[i];
  const head = fnLabel(i, fn.type, part) + fnRel(fn.type);
  const lay = layRow(part ? fn.row2 : fn.row, 1, fn.math !== false, false);

// ---------- список функций (общий для Graph и Table) ----------
const FN_OPTN = [
  null,
  mi('CALC', [mi('d/dx', T('ddx', 'd/dx(')), mi('d²/dx²', T('d2dx', 'd²/dx²(')), mi('∫dx', T('int', '∫(')), mi('Σ(', T('sum', 'Σ(')), mi('logab', T('logab', 'logab('))]),
  mi('HYPERBL', [mi('sinh', 'sinh '), mi('cosh', 'cosh '), mi('tanh', 'tanh '), mi('sinh' + G.INV, 'sinh' + INVS), mi('cosh' + G.INV, 'cosh' + INVS), mi('tanh' + G.INV, 'tanh' + INVS)]),
  mi('PROB', [mi('x!', '!'), mi('nPr', G.PERM), mi('nCr', G.COMB)]),
  mi('NUMERIC', [mi('Abs', T('abs', 'Abs ')), mi('Int', 'Int '), mi('Frac', 'Frac '), mi('Intg', 'Intg '), mi('GCD', 'GCD('), mi('LCM', 'LCM('), mi('MOD', 'MOD(')])

class FuncList {
  // o: {title, menu: (list) => пункты меню, onExe}
  constructor(o) {
    this.o = o;
    this.cur = 0; this.part = 0; this.ed = null; this.off = 0;
    this.base = new FMenu(o.menu(this));
    this.menu = this.base;
  }
  fn() { return mem.fn[this.cur]; }
  typeOf(fn) { return fnDefined(fn) || fn.row.length ? fn.type : S.funcType; }
  parts(fn) { return this.typeOf(fn) === 'Param' ? 2 : 1; }

  startEdit(keep, atStart) {
    const fn = this.fn();
    this.ed = new MathEd(S.io === 'Math');
    if (keep) {
      const row = this.part ? fn.row2 : fn.row;
      if (this.ed.math || row.every((t) => typeof t === 'string')) this.ed.set(row, atStart);
    }
    this.ed.sx = 0;
    this.menu = new FMenu(FN_OPTN);
    this.menuKind = 'edit';
  }
  stopEdit() { this.ed = null; this.menu = this.base; this.base.reset(); }
  commit() {
    const fn = this.fn(), ed = this.ed;
    if (ed.empty) { this.stopEdit(); return; }
    parse(ed.tokens());                // при ошибке — Syntax ERROR, остаёмся в редакторе
    const fresh = !fn.row.length && !fn.row2.length;
    if (fresh) { fn.type = S.funcType; fn.sel = true; }
    if (this.part) fn.row2 = ed.get(); else fn.row = ed.get();
    fn.math = ed.math;
    fnTouch();
    this.stopEdit();
    if (fn.type === 'Param' && this.part === 0) { this.part = 1; if (!fn.row2.length) this.startEdit(false); }
    else this.move(1);
  }
  move(d) {
    const n = this.parts(this.fn());
    if (d > 0) {
      if (this.part + 1 < n) this.part++;
      else if (this.cur < 19) { this.cur++; this.part = 0; }
    } else if (this.part > 0) this.part--;
    else if (this.cur > 0) { this.cur--; this.part = this.parts(this.fn()) - 1; }
  }
  del() {
    const fn = this.fn();
    if (!fn.row.length && !fn.row2.length) return;
    confirmBox(['Delete Formula?', ''], () => { Object.assign(fn, newFn(this.cur), { color: fn.color }); fnTouch(); this.part = 0; });
  }
  select() {
    const fn = this.fn();
    if (fnDefined(fn)) fn.sel = !fn.sel;
  }
  colorMenu() {
    const fn = this.fn();
    return COLOR_NAMES.map((c) => mi(c, () => { fn.color = c; this.base.reset(); this.menu = this.base; }));
  }
  styleMenu() {
    const fn = this.fn();
    return FN_STYLES.map((s) => mi(s, () => { fn.style = s; this.base.reset(); }));
  }

  key(k) {
    const f = fIndex(k);
    if (this.ed) {
      const ed = this.ed;
      if (f >= 0) {
        if (k.shift) return;
        const it = this.menuKind === 'edit' ? null : this.menu.press(f);
        if (it && it.ins !== undefined) edInsert(ed, it.ins);
        return;
      }
      switch (k.id) {
        case 'EXE': this.commit(); return;
        case 'EXIT':
          if (this.menuKind !== 'edit') { if (!this.menu.back()) { this.menu = new FMenu(FN_OPTN); this.menuKind = 'edit'; } } else this.stopEdit();
          return;
        case 'AC': if (ed.empty) this.stopEdit(); else ed.clear(); return;
        case 'OPTN': this.menu = new FMenu(FN_OPTN); this.menuKind = 'optn'; return;
        case 'VARS': if (!k.shift) { this.menu = new FMenu(VARS_RUN); this.menuKind = 'vars'; } return;
        default:
      }
      if (!k.shift && !k.alpha && (k.id === 'UP' || k.id === 'DOWN')) {
        if (!ed.vert(k.id === 'UP' ? -1 : 1)) { this.stopEdit(); this.move(k.id === 'UP' ? -1 : 1); }
        return;
      }
      if (edNav(ed, k)) return;
      typeKey(ed, k, fnKey(this.typeOf(this.fn())));
      return;
    }
    if (f >= 0 && !k.shift) {
      const it = this.menu.press(f);
      if (it && it.fn) it.fn();
      return;
    }
    switch (k.id) {
      case 'UP': this.move(-1); return;
      case 'DOWN': this.move(1); return;
      case 'LEFT': case 'RIGHT': {
        const fn = this.fn();
        if ((this.part ? fn.row2 : fn.row).length) this.startEdit(true, k.id === 'RIGHT');
        return;
      }
      case 'EXE': if (this.o.onExe) this.o.onExe(); return;
      case 'DEL': this.del(); return;
      case 'EXIT': if (!this.menu.back() && this.menu !== this.base) this.menu = this.base; return;
      case '5': if (k.shift) { if (fnDefined(this.fn())) this.menu = new FMenu(this.colorMenu()); return; } break;

      typeKey(this.ed, k, fnKey(this.typeOf(this.fn())));
    }
  }

  draw(tags) {
    statusBar(tags || stdTags());
    lcd.text(0, 24, this.o.title);
    lcd.text(14 * 18, 24, ':' + S.funcType);
    // строки
    const rows = [];
    let y = 0, curTop = 0, curBot = 0;
    mem.fn.forEach((fn, i) => {
      const type = this.typeOf(fn);
      for (let p = 0; p < (type === 'Param' ? 2 : 1); p++) {
        const editing = this.ed && i === this.cur && p === this.part;
        const src = p ? fn.row2 : fn.row;
        const lay = editing ? layRow(this.ed.root, 0, this.ed.math, false) : layRow(src, 0, fn.math !== false, false);
        const a = Math.max(12, lay.a), d = Math.max(12, lay.d);
        const r = { i, p, fn, type, lay, a, h: Math.ceil(a + d), y, editing, defined: src.length > 0 };
        if (i === this.cur && p === this.part) { curTop = y; curBot = y + r.h; }
        rows.push(r); y += r.h;

    });
    const vh = 144;
    if (curBot > this.off + vh) this.off = curBot - vh;
    if (curTop < this.off) this.off = curTop;
    lcd.clip(0, 48, LW, vh);
    for (const r of rows) {
      const ry = 48 + r.y - this.off;
      if (ry + r.h < 48 || ry > 48 + vh) continue;
      const on = r.i === this.cur && r.p === this.part && !this.ed;
      const yc = ry + r.a, label = fnLabel(r.i, r.type, r.p);
      if (on) lcd.rect(0, ry, LW, r.h, HILITE);
      const ink = on ? '#fff' : '#000';
      lcd.text(0, yc - 12, label, { color: ink });
      const lx = label.length * 18;
      const rel = r.defined || r.editing ? fnRel(r.type) : ':';
      if (r.defined && r.fn.sel && !r.editing) {

        lcd.rect(lx + 1, yc - 10, 16, 20, on ? '#fff' : '#000');
        lcd.glyph(rel, lx + 9, yc, 24, on ? '#000' : '#fff');
      } else lcd.glyph(rel, lx + 9, yc, 24, ink);

      if (r.editing) { lcd.unclip(); lcd.clip(0, 48, LW, vh); drawEd(this.ed, ex, yc, ew); }
      else if (r.defined) {

        lcd.unclip(); lcd.clip(0, 48, LW, vh);

      // образец линии

        lcd.rect(LW - 40, yc - 9, 36, 18, '#fff');
        lcd.frame(LW - 40, yc - 9, 36, 18, on ? '#fff' : '#888', 1);
        const g = lcd.g, st = r.fn.style;
        g.strokeStyle = COLORS[r.fn.color]; g.lineWidth = st === 'Thick' ? 3.6 : st === 'Thin' ? 1 : 2; g.lineCap = 'butt';
        g.setLineDash(st === 'Broken' ? [5, 4] : st === 'Dot' ? [1.5, 3.5] : []);
        g.beginPath(); g.moveTo(LW - 35, yc); g.lineTo(LW - 9, yc); g.stroke();
        g.setLineDash([]);

    lcd.fmenu(this.ed && this.menuKind === 'edit' ? [] : this.menu.labels());
  }
}

// Поле ввода значения в одну строку. Возвращает объект с key(k) → 'done' | 'cancel' | true | false и рисованием
class NumField {
  constructor() { this.ed = new MathEd(false); this.ed.sx = 0; }
  // Клавиша обработана → true. EXE → вычисляет и вызывает onValue(число)
  key(k, onValue, onCancel) {
    const ed = this.ed;
    if (k.id === 'EXE') { if (!ed.empty) onValue(evalNumber(ed.tokens())); else if (onCancel) onCancel(); return true; }
    if (k.id === 'EXIT' || (k.id === 'AC' && ed.empty)) { if (onCancel) onCancel(); return true; }
    if (k.id === 'AC') { ed.clear(); return true; }
    if (k.id === 'LEFT' || k.id === 'RIGHT' || k.id === 'DEL') { edNav(ed, k); return true; }
    return typeKey(ed, k);
  }
  draw(x, yc, w, color) { drawEd(this.ed, x, yc, w, { color }); }
}
// Начинает ли клавиша ввод числа (цифра, точка, минус, π и т. п.)
function startsNumber(k) {
  if (k.alpha) return false;
  if (k.shift) return k.id === 'EXP' || k.id === 'SQR' || k.id === 'NEG';
  return isDigit(k.id) || ['DOT', 'NEG', 'SUB', 'LPAR', 'SIN', 'COS', 'TAN', 'LOG', 'LN', 'EXP'].includes(k.id);
}

const SETUP_GRAPH = ['io', 'drawType', 'graphFunc', 'deriv', 'angle', 'coord', 'grid', 'axes', 'label', 'disp'];

// ---------- экран View Window ----------
const VW_ROWS = [['Xmin', 'xmin'], [' max', 'xmax'], [' scale', 'xscl'], [' dot', 'dot'], ['Ymin', 'ymin'], [' max', 'ymax'], [' scale', 'yscl'], ['T' + 'θ min', 'tmin'], ['   max', 'tmax'], ['   ptch', 'tptch']];
function openVWindow(onClose) {
  pushModal({
    sel: 0, top: 0, field: null,
    get(key) { return key === 'dot' ? xDot() : VW[key]; },
    put(key, v) {
      if (key === 'dot') { if (!(v > 0)) fail('Ma ERROR'); VW.xmax = r15(VW.xmin + v * GA.w); }
      else VW[key] = v;
    },
    move(d) {
      this.sel = (this.sel + d + VW_ROWS.length) % VW_ROWS.length;
      if (this.sel < this.top) this.top = this.sel;
      if (this.sel > this.top + 5) this.top = this.sel - 5;
    },
    key(k) {
      if (this.field) {
        this.field.key(k, (x) => { this.put(VW_ROWS[this.sel][1], x.v); this.field = null; this.move(1); }, () => { this.field = null; });
        return;
      }
      const f = fIndex(k);
      if (f === 0) { vwSet('INITIAL'); return; }
      if (f === 1) { vwSet('TRIG'); return; }
      if (f === 2) { vwSet('STANDRD'); return; }
      if (k.id === 'UP') this.move(-1);
      else if (k.id === 'DOWN' || k.id === 'EXE') this.move(1);
      else if (k.id === 'EXIT') { popModal(); if (onClose) onClose(); }
      else if (startsNumber(k)) { this.field = new NumField(); this.field.key(k); }
    },
    draw() {
      lcd.rect(0, 23, LW, LH - 23, '#fff');
      lcd.text(0, 24, 'View Window');
      for (let r = 0; r < 6; r++) {
        const i = this.top + r;
        if (i >= VW_ROWS.length) break;
        const [label, key] = VW_ROWS[i], y = 48 + r * 24;
        lcd.text(18, y, label);
        lcd.text(8 * 18, y, ':');
        const on = i === this.sel;
        if (on && this.field) this.field.draw(9 * 18, y + 12, LW - 9 * 18 - 4);
        else {
          const s = fmtFit(this.get(key), 12);
          lcd.text(9 * 18, y, s, on ? { inv: true } : undefined);
        }
      }
      if (this.top > 0) lcd.glyph('▲', LW - 9, 58, 12, '#000');
      if (this.top + 6 < VW_ROWS.length) lcd.glyph('▼', LW - 9, 184, 12, '#000');
      lcd.fmenu([{ l: 'INITIAL', k: 'cmd' }, { l: 'TRIG', k: 'cmd' }, { l: 'STANDRD', k: 'cmd' }]);
    }
  });
}

// Ввод одного-двух чисел в окне (Zoom Factor и т. п.)
function numDialog(title, fields, onDone) {
  pushModal({
    lock: true, sel: 0, vals: fields.map((f) => f[1]), field: null,
    key(k) {
      if (this.field) {
        this.field.key(k, (x) => { this.vals[this.sel] = x.v; this.field = null; if (this.sel + 1 < fields.length) this.sel++; }, () => { this.field = null; });
        return;
      }
      if (k.id === 'UP') this.sel = Math.max(0, this.sel - 1);
      else if (k.id === 'DOWN') this.sel = Math.min(fields.length - 1, this.sel + 1);
      else if (k.id === 'EXE') { if (this.sel + 1 < fields.length) this.sel++; else { popModal(); onDone(this.vals); } }
      else if (k.id === 'EXIT') { popModal(); onDone(this.vals); }
      else if (startsNumber(k)) { this.field = new NumField(); this.field.key(k); }
    },
    draw() {
      lcd.rect(0, 23, LW, LH - 23, '#fff');
      lcd.text(0, 24, title);
      fields.forEach((f, i) => {
        const y = 48 + i * 24;
        lcd.text(18, y, f[0]);
        lcd.text(8 * 18, y, ':');
        if (i === this.sel && this.field) this.field.draw(9 * 18, y + 12, LW - 9 * 18 - 4);
        else lcd.text(9 * 18, y, fmtFit(this.vals[i], 12), i === this.sel ? { inv: true } : undefined);
      });
    }
  });
}

const ZOOM_FACT = { x: 2, y: 2 };
let plotVer = 0;                       // меняется, когда графики надо пересчитать
const plotCache = new Map();

const graphApp = {
  list: null, mode: 'list', g: null,

  enter() {
    if (!this.list) {
      this.list = new FuncList({
        title: 'Graph Func',
        onExe: () => this.show(),
        menu: (l) => [
          mi('SELECT', () => l.select()),
          mi('DELETE', () => l.del()),
          mi('TYPE', [...FN_TYPES.slice(0, 4).map((t) => mi(t, () => { S.funcType = t; l.base.reset(); })), null,
            ...FN_TYPES.slice(4).map((t) => mi(t, () => { S.funcType = t; l.base.reset(); }))]),
          mi('TOOL', [{ l: 'STYLE', get sub() { return l.styleMenu(); } }, { l: 'COLOR', get sub() { return l.colorMenu(); } }]),
          null,
          mi('DRAW', () => this.show())
        ]
      });
    }
    this.mode = 'list';
  },
  setup() { return this.mode === 'list' ? ['io', 'funcType', ...SETUP_GRAPH.slice(1)] : SETUP_GRAPH; },
  onSetup() { plotVer++; },

  // ---------- переход к графику ----------
  show() {
    if (!vwOk()) fail('Range ERROR');
    const fns = [];
    mem.fn.forEach((fn, i) => { if (fn.sel && fnDefined(fn)) { fnGet(i); fns.push(i); } });
    const old = this.g;
    this.g = { fns, st: 'view', menu: null, sketch: old ? old.sketch : [], shade: null, orig: { ...VW }, prev: null, tr: null, res: null, pick: null, ptr: null, input: null, note: null };
    this.mode = 'graph';
    plotVer++;
  },

  key(k) {
    if (this.mode === 'list') {
      if (k.shift && k.id === 'F3' && !this.list.ed) { openVWindow(() => { plotVer++; }); return; }
      this.list.key(k);
      return;
    }
    this.gkey(k);
  },

  // ---------- клавиши на экране графика ----------
  gkey(k) {
    const s = this.g, f = fIndex(k);
    if (s.input) {
      s.input.field.key(k, (x) => { const then = s.input.then; s.input = null; then(x.v); }, () => { s.input = null; });
      return;
    }
    if (f >= 0 && (k.shift || !s.menu)) { this.fkey(f); return; }
    if (s.menu) {
      if (f >= 0) { const it = s.menu.press(f); if (it && it.fn) it.fn(); return; }
      if (k.id === 'EXIT') { if (!s.menu.back()) s.menu = null; return; }
    }
    if (this.stateKey(k)) return;
    switch (k.id) {
      case 'LEFT': this.pan(-24, 0); break;
      case 'RIGHT': this.pan(24, 0); break;
      case 'UP': this.pan(0, 24); break;
      case 'DOWN': this.pan(0, -24); break;
      case 'ADD': this.zoom(ZOOM_FACT.x, ZOOM_FACT.y); break;
      case 'SUB': this.zoom(1 / ZOOM_FACT.x, 1 / ZOOM_FACT.y); break;
      case 'EXIT': case 'AC':
        if (s.st !== 'view') this.toView(); else this.mode = 'list';
        break;
      default:
    }
  },
  toView() { const s = this.g; s.st = 'view'; s.res = null; s.pick = null; s.ptr = null; s.note = null; },
  fkey(f) {
    const s = this.g;
    switch (f) {
      case 0: this.startTrace('trace'); break;
      case 1: s.menu = new FMenu(this.zoomMenu()); break;
      case 2: openVWindow(() => { plotVer++; this.toView(); }); break;
      case 3: s.menu = new FMenu(this.sketchMenu()); break;
      case 4: s.menu = new FMenu(this.gsolvMenu()); break;
      case 5: this.mode = 'list'; break;
      default:
    }
  },

  // ---------- окно просмотра ----------
  keep() { this.g.prev = { ...VW }; },
  pan(dx, dy) {
    const sx = dx * xDot(), sy = dy * yDot();
    VW.xmin = r15(VW.xmin + sx); VW.xmax = r15(VW.xmax + sx);
    VW.ymin = r15(VW.ymin + sy); VW.ymax = r15(VW.ymax + sy);
    plotVer++;
  },
  zoom(fx, fy, cx, cy) {
    this.keep();
    const s = this.g;
    if (cx === undefined) {
      const p = s.st === 'trace' && s.tr ? this.point(s.tr) : null;
      cx = p ? p.x : (VW.xmin + VW.xmax) / 2;
      cy = p && Number.isFinite(p.y) ? p.y : (VW.ymin + VW.ymax) / 2;
    }
    const hw = (VW.xmax - VW.xmin) / 2 / fx, hh = (VW.ymax - VW.ymin) / 2 / fy;
    Object.assign(VW, { xmin: r15(cx - hw), xmax: r15(cx + hw), ymin: r15(cy - hh), ymax: r15(cy + hh) });
    plotVer++;
  },
  zoomMenu() {
    const s = this.g, done = () => { s.menu = null; plotVer++; };
    return [
      mi('BOX', () => { s.menu = null; s.st = 'box1'; s.ptr = { px: 192, py: 120 }; }),
      mi('FACTOR', () => numDialog('Zoom Factor', [['Xfact', ZOOM_FACT.x], ['Yfact', ZOOM_FACT.y]], (v) => { if (v[0] > 0) ZOOM_FACT.x = v[0]; if (v[1] > 0) ZOOM_FACT.y = v[1]; })),
      mi('IN', () => { this.zoom(ZOOM_FACT.x, ZOOM_FACT.y); }),
      mi('OUT', () => { this.zoom(1 / ZOOM_FACT.x, 1 / ZOOM_FACT.y); }),
      mi('AUTO', () => {
        let lo = Infinity, hi = -Infinity;
        for (const i of s.fns) {
          if (!fnIsY(mem.fn[i])) continue;
          const fq = fnGet(i).f;
          for (let n = 0; n <= GA.w; n++) { const y = fq(VW.xmin + n * xDot()); if (Number.isFinite(y)) { if (y < lo) lo = y; if (y > hi) hi = y; } }
        }
        if (lo > hi) return;
        this.keep();
        if (lo === hi) { lo -= 1; hi += 1; }
        VW.ymin = r15(lo); VW.ymax = r15(hi);
        done();
      }),
      mi('ORIGINAL', () => { this.keep(); Object.assign(VW, s.orig); done(); }),
      mi('SQUARE', () => { this.keep(); const cy = (VW.ymin + VW.ymax) / 2, hh = xDot() * GA.h / 2; VW.ymin = r15(cy - hh); VW.ymax = r15(cy + hh); done(); }),
      mi('ROUND', () => {
        this.keep();
        const rd = (lo, hi, n) => { const d = Number(((hi - lo) / n).toPrecision(2)), c = Math.round((lo + hi) / 2 / d) * d; return [r15(c - d * n / 2), r15(c + d * n / 2)]; };
        [VW.xmin, VW.xmax] = rd(VW.xmin, VW.xmax, GA.w); [VW.ymin, VW.ymax] = rd(VW.ymin, VW.ymax, GA.h);
        done();
      }),
      mi('INTEGER', () => {
        this.keep();
        const cx = Math.round((VW.xmin + VW.xmax) / 2), cy = Math.round((VW.ymin + VW.ymax) / 2);
        Object.assign(VW, { xmin: cx - 189, xmax: cx + 189, xscl: 10, ymin: cy - 93, ymax: cy + 93, yscl: 10 });
        done();
      }),
      mi('PREVIOUS', () => { if (!s.prev) return; const cur = { ...VW }; Object.assign(VW, s.prev); s.prev = cur; done(); })
    ];
  },

  // ---------- точка на графике ----------
  // tr: {k — номер функции в списке построенных, x | y | t — параметр}
  point(tr) {
    const i = this.g.fns[tr.k], fn = mem.fn[i], c = fnGet(i);
    if (fn.type === 'r=') { const r = c.f(tr.t); return { x: r15(r * fCos(tr.t)), y: r15(r * fSin(tr.t)), t: tr.t, r }; }
    if (fn.type === 'Param') return { x: c.f(tr.t), y: c.g(tr.t), t: tr.t };
    if (fn.type === 'X=') return { x: c.f(tr.y), y: tr.y };
    return { x: tr.x, y: c.f(tr.x) };
  },
  newTr(k) {
    const fn = mem.fn[this.g.fns[k]];
    const old = this.g.tr;
    if (fn.type === 'r=' || fn.type === 'Param') return { k, t: VW.tmin };
    if (fn.type === 'X=') return { k, y: r15(VW.ymin + Math.round(GA.h / 2) * yDot()) };
    return { k, x: old && old.x !== undefined ? old.x : r15(VW.xmin + Math.round(GA.w / 2) * xDot()) };
  },
  startTrace(st) {
    const s = this.g;
    if (!s.fns.length) return;
    s.menu = null; s.res = null; s.note = null;
    s.tr = this.newTr(s.tr && s.tr.k < s.fns.length ? s.tr.k : 0);
    s.st = st;
    this.follow();
  },
  // Держать точку в поле зрения и записать её в переменные X и Y
  follow() {
    const s = this.g, p = this.point(s.tr);
    if (Number.isFinite(p.x)) {
      const px = X2P(p.x);
      if (px < 0 || px > LW) { const hw = (VW.xmax - VW.xmin) / 2; VW.xmin = r15(p.x - hw); VW.xmax = r15(p.x + hw); plotVer++; }
      setVar('X', R(p.x));
    }
    if (Number.isFinite(p.y)) {
      const py = Y2P(p.y);
      if (py < GA.top || py > GA.bottom) { const hh = (VW.ymax - VW.ymin) / 2; VW.ymin = r15(p.y - hh); VW.ymax = r15(p.y + hh); plotVer++; }
      setVar('Y', R(p.y));
    }
  },
  moveTr(d) {
    const s = this.g, tr = s.tr;
    if (tr.t !== undefined) tr.t = Math.max(VW.tmin, Math.min(VW.tmax, r15(tr.t + d * VW.tptch)));
    else if (tr.y !== undefined) tr.y = r15(tr.y + d * yDot());
    else {
      tr.x = r15(tr.x + d * xDot());
      if (Math.abs(tr.x) < xDot() * 1e-6) tr.x = 0;
      const px = X2P(tr.x);
      if (px < 0 || px > LW) { this.pan(d * 24, 0); }
    }
    this.follow();
  },
  askNumber(prompt, k, then) {
    const s = this.g;
    s.input = { prompt, field: new NumField(), then };
    if (k) s.input.field.key(k);
  },

  // Клавиши, зависящие от состояния. true — обработано
  stateKey(k) {
    const s = this.g;
    const arrowsTrace = () => {
      if (k.id === 'LEFT') { this.moveTr(-1); return true; }
      if (k.id === 'RIGHT') { this.moveTr(1); return true; }
      if (startsNumber(k) && s.tr.x !== undefined) {
        this.askNumber('X:', k, (v) => { s.tr.x = v; this.follow(); });
        return true;
      }
      return false;
    };
    switch (s.st) {
      case 'trace':
        if (arrowsTrace()) return true;
        if (k.id === 'UP' || k.id === 'DOWN') {
          const n = s.fns.length;
          s.tr = this.newTr((s.tr.k + (k.id === 'UP' ? n - 1 : 1)) % n);
          this.follow();
          return true;
        }
        return false;
      case 'pick': {
        const p = s.pick;
        if (k.id === 'UP') p.i = (p.i + p.c.length - 1) % p.c.length;
        else if (k.id === 'DOWN') p.i = (p.i + 1) % p.c.length;
        else if (k.id === 'EXE') { s.pick = null; s.st = 'view'; p.then(p.c[p.i]); }
        else return false;
        return true;
      }
      case 'result': {
        const r = s.res;
        if (k.id === 'LEFT' || k.id === 'RIGHT') {
          if (r.pts.length > 1) { r.i = Math.max(0, Math.min(r.pts.length - 1, r.i + (k.id === 'RIGHT' ? 1 : -1))); this.seeResult(); }
          return true;
        }
        return false;
      }
      case 'tangent': case 'normal':
        if (arrowsTrace()) { s.note = null; return true; }
        if (k.id === 'EXE') { this.addLine(s.st); return true; }
        return false;
      case 'intLo': case 'intHi':
        if (arrowsTrace()) return true;
        if (k.id === 'EXE') {
          if (s.st === 'intLo') { s.intLo = s.tr.x; s.st = 'intHi'; }
          else this.integral(s.intLo, s.tr.x);
          return true;
        }
        return false;
      case 'box1': case 'box2': case 'vline': case 'hline': {
        const d = { LEFT: [-1, 0], RIGHT: [1, 0], UP: [0, -1], DOWN: [0, 1] }[k.id];
        if (d) {
          const now = Date.now();
          s.streak = now - (s.lastMove || 0) < 200 ? (s.streak || 0) + 1 : 0;
          s.lastMove = now;
          const step = s.streak > 14 ? 6 : s.streak > 5 ? 3 : 1;
          s.ptr.px = Math.max(0, Math.min(LW, s.ptr.px + d[0] * step));
          s.ptr.py = Math.max(GA.top + 1, Math.min(GA.bottom, s.ptr.py + d[1] * step));
          return true;
        }
        if (k.id === 'EXE') {
          const x = P2X(s.ptr.px), y = P2Y(s.ptr.py);
          if (s.st === 'box1') { s.box = { x, y }; s.st = 'box2'; }
          else if (s.st === 'box2') {
            if (x !== s.box.x && y !== s.box.y) {
              this.keep();
              Object.assign(VW, { xmin: r15(Math.min(x, s.box.x)), xmax: r15(Math.max(x, s.box.x)), ymin: r15(Math.min(y, s.box.y)), ymax: r15(Math.max(y, s.box.y)) });
              plotVer++;
            }
            this.toView();
          } else { s.sketch.push(s.st === 'vline' ? { t: 'v', x: r15(x) } : { t: 'h', y: r15(y) }); this.toView(); }
          return true;
        }
        return false;
      }
      default: return false;
    }
  },

  // ---------- G-Solv ----------
  pickFn(cands, then) {
    const s = this.g;
    if (!cands.length) return;
    if (cands.length === 1) { then(cands[0]); return; }
    s.menu = null; s.st = 'pick'; s.pick = { c: cands, i: 0, then };
  },
  yFns() { return this.g.fns.filter((i) => fnIsY(mem.fn[i])); },
  result(label, i, pts, j) {
    const s = this.g;
    if (!pts.length) { errorBox('Not Found'); return; }
    s.menu = null; s.st = 'result';
    s.res = { label, k: s.fns.indexOf(i), pts, i: 0, j };
    this.seeResult();
  },
  seeResult() {
    const r = this.g.res, p = r.pts[r.i];
    setVar('X', R(p.x));
    if (Number.isFinite(p.y)) setVar('Y', R(p.y));
  },
  gsolvMenu() {
    const s = this.g;
    const one = (label, find) => () => this.pickFn(this.yFns(), (i) => {
      const fq = fnGet(i).f;
      this.result(label, i, find(fq).filter((x) => Number.isFinite(fq(x))).map((x) => ({ x, y: label === 'ROOT' ? 0 : snapNice(fq(x)) })));
    });
    const lo = () => P2X(0), hi = () => P2X(LW);
    return [
      mi('ROOT', one('ROOT', (fq) => scanRoots(fq, lo(), hi()))),
      mi('MAX', one('MAX', (fq) => scanExtrema(fq, lo(), hi(), 1))),
      mi('MIN', one('MIN', (fq) => scanExtrema(fq, lo(), hi(), -1))),
      mi('Y-ICEPT', one('Y-ICEPT', () => [0])),
      mi('INTSECT', () => {
        const c = this.yFns();
        if (c.length < 2) { errorBox('Not Found'); return; }
        const go = (a, b) => {
          const fa = fnGet(a).f, fb = fnGet(b).f;
          this.result('INTSECT', a, scanRoots((x) => fa(x) - fb(x), lo(), hi()).map((x) => ({ x, y: snapNice(fa(x)) })), b);
        };
        if (c.length === 2) go(c[0], c[1]);
        else this.pickFn(c, (a) => this.pickFn(c.filter((q) => q !== a), (b) => go(a, b)));
      }),
      mi('Y-CAL', () => this.pickFn(this.yFns(), (i) => {
        s.menu = null;
        this.askNumber('X:', null, (x) => { const y = fnGet(i).f(x); if (!Number.isFinite(y)) { errorBox('Ma ERROR'); return; } this.result('Y-CAL', i, [{ x, y }]); this.follow2(x, y); });
      })),
      mi('X-CAL', () => this.pickFn(this.yFns(), (i) => {
        s.menu = null;
        this.askNumber('Y:', null, (y) => { const fq = fnGet(i).f; this.result('X-CAL', i, scanRoots((x) => fq(x) - y, lo(), hi()).map((x) => ({ x, y }))); });
      })),
      mi('∫dx', () => this.pickFn(this.yFns(), (i) => {
        s.menu = null; s.shade = null;
        s.tr = { k: s.fns.indexOf(i), x: r15(VW.xmin + Math.round(GA.w / 2) * xDot()) };
        s.st = 'intLo';
      }))
    ];
  },
  follow2(x, y) {                      // показать точку, даже если она за экраном
    if (X2P(x) < 0 || X2P(x) > LW) { const hw = (VW.xmax - VW.xmin) / 2; VW.xmin = r15(x - hw); VW.xmax = r15(x + hw); plotVer++; }
    if (Y2P(y) < GA.top || Y2P(y) > GA.bottom) { const hh = (VW.ymax - VW.ymin) / 2; VW.ymin = r15(y - hh); VW.ymax = r15(y + hh); plotVer++; }
  },
  integral(a, b) {
    const s = this.g, i = s.fns[s.tr.k], fq = fnGet(i).f;
    if (a > b) [a, b] = [b, a];
    const v = nInt(fq, a, b);
    if (!Number.isFinite(v)) { errorBox('Ma ERROR'); this.toView(); return; }
    s.shade = { i, a, b };
    s.st = 'result';
    s.res = { label: '∫dx', k: s.tr.k, pts: [{ x: b, y: fq(b) }], i: 0, value: Number(v.toPrecision(12)), a, b };
  },

  // ---------- Sketch ----------
  sketchMenu() {
    const s = this.g;
    return [
      mi('Cls', () => { s.sketch = []; s.shade = null; s.menu = null; this.toView(); }),
      mi('Tangent', () => this.pickFn(this.yFns(), (i) => { this.startTrace('tangent'); s.tr = this.newTr(s.fns.indexOf(i)); })),
      mi('Norm', () => this.pickFn(this.yFns(), (i) => { this.startTrace('normal'); s.tr = this.newTr(s.fns.indexOf(i)); })),
      mi('Inverse', () => this.pickFn(this.yFns(), (i) => { s.sketch.push({ t: 'inv', i }); s.menu = null; })),
      null,
      null, null, null,
      mi('Vertical', () => { s.menu = null; s.st = 'vline'; s.ptr = { px: 192, py: 120 }; }),
      mi('Horz', () => { s.menu = null; s.st = 'hline'; s.ptr = { px: 192, py: 120 }; })
    ];
  },
  addLine(kind) {
    const s = this.g, p = this.point(s.tr), fq = fnGet(s.fns[s.tr.k]).f;
    if (!Number.isFinite(p.y)) return;
    let m = nDeriv(fq, p.x);
    if (!Number.isFinite(m)) { errorBox('Ma ERROR'); return; }
    m = snapNice(m);
    if (kind === 'normal') {
      if (m === 0) { s.sketch.push({ t: 'v', x: p.x }); s.note = 'X=' + fmtFit(p.x, 10); return; }
      m = snapNice(-1 / m);
    }
    const b = snapNice(p.y - m * p.x);
    s.sketch.push({ t: 'line', m, b });
    s.note = 'Y=' + fmtFit(m, 9) + 'X' + (b < 0 ? '−' : '+') + fmtFit(Math.abs(b), 9);
  },

  // ---------- рисование ----------
  pts(i) {
    const fn = mem.fn[i];
    const key = [plotVer, VW.xmin, VW.xmax, VW.ymin, VW.ymax, VW.tmin, VW.tmax, VW.tptch, S.angle, fn.type].join();
    const c = plotCache.get(i);
    if (c && c.key === key) return c.pts;
    const f = fnGet(i);
    const pts = fn.type === 'r=' ? sampleT(f, true) : fn.type === 'Param' ? sampleT(f, false) : fn.type === 'X=' ? sampleX(f.f) : sampleY(f.f);
    plotCache.set(i, { key, pts });
    return pts;
  },
  drawCurve(i) {
    const fn = mem.fn[i], color = COLORS[fn.color] || '#000', g = lcd.g, pts = this.pts(i);
    const rel = fnRel(fn.type);
    if (rel === '=') { strokePts(pts, color, fn.style); return; }
    const up = rel === '>' || rel === '≥';
    g.save();
    g.globalAlpha = 0.22; g.fillStyle = color;
    let run = [];
    const flush = () => {
      if (run.length > 1) {
        g.beginPath();
        g.moveTo(run[0][0], up ? GA.top : GA.bottom);
        for (const p of run) g.lineTo(p[0], Math.max(GA.top, Math.min(GA.bottom, p[1])));
        g.lineTo(run[run.length - 1][0], up ? GA.top : GA.bottom);
        g.closePath(); g.fill();
      }
      run = [];
    };
    for (const p of pts) { if (p) run.push(p); else flush(); }
    flush();
    g.restore();
    strokePts(pts, color, rel === '>' || rel === '<' ? 'Broken' : fn.style);
  },
  pointer(px, py, color) {
    const g = lcd.g;
    UI.sawCursor = true;
    if (!UI.blink) return;
    g.lineCap = 'butt';
    for (const [c, w] of [['#fff', 4], [color || '#000', 1.6]]) {
      g.strokeStyle = c; g.lineWidth = w;
      g.beginPath(); g.moveTo(px - 8, py); g.lineTo(px + 8, py); g.moveTo(px, py - 8); g.lineTo(px, py + 8); g.stroke();
      g.beginPath(); g.arc(px, py, 3.2, 0, Math.PI * 2); g.stroke();
    }
  },
  // Подпись внизу: «X=…» слева, «Y=…» справа; строка выше — для пометок
  coords(a, b, upper) {
    const y = LH - 17 - (this.g.menu ? 24 : 0);
    if (upper) {
      const w = lcd.miniW(upper, { px: 14 });
      lcd.rect(1, y - 17, w + 6, 17, '#fff');
      lcd.mini(4, y - 16, upper, { px: 14 });
    }
    if (S.coord === 'Off' && !this.g.input) return;
    if (a) { const w = lcd.miniW(a, { px: 14 }); lcd.rect(1, y, w + 6, 17, '#fff'); lcd.mini(4, y + 1, a, { px: 14 }); }
    if (b) { const w = lcd.miniW(b, { px: 14 }); lcd.rect(193, y, w + 6, 17, '#fff'); lcd.mini(196, y + 1, b, { px: 14 }); }
  },
  caption(k, hilite) {
    if (S.graphFunc === 'Off' && !hilite) return;
    const i = this.g.fns[k], fn = mem.fn[i];
    const lay = layRow(fn.row, 1, fn.math !== false, false);
    const h = Math.max(18, lay.a + lay.d + 2) * (fn.type === 'Param' ? 2 : 1);
    const head = fnLabel(i, fn.type, 0) + fnRel(fn.type);
    const w = head.length * 12 + lay.w + 8;
    lcd.rect(1, GA.top + 1, Math.min(LW - 2, w + (fn.type === 'Param' ? 40 : 0)), h, hilite && UI.blink ? '#000' : '#fff');
    const ink = hilite && UI.blink ? '#fff' : COLORS[fn.color];
    const c = fnCaption(i, 4, GA.top + 2, ink, 0);
    if (fn.type === 'Param') fnCaption(i, 4, GA.top + 2 + c.h, ink, 1);
    if (hilite) UI.sawCursor = true;
  },

  draw() {
    if (this.mode === 'list') { this.list.draw(); return; }
    const s = this.g, g = lcd.g;
    statusBar(stdTags());
    lcd.clip(0, GA.top, LW, LH - GA.top);
    drawAxes();
    if (s.shade) {
      const fq = fnGet(s.shade.i).f, y0 = Math.max(GA.top, Math.min(GA.bottom, Y2P(0)));
      g.save(); g.globalAlpha = 0.3; g.fillStyle = COLORS[mem.fn[s.shade.i].color];
      g.beginPath();
      const xa = X2P(s.shade.a), xb = X2P(s.shade.b);
      g.moveTo(xa, y0);
      for (let px = xa; px <= xb; px += 0.5) { const y = fq(P2X(px)); g.lineTo(px, Number.isFinite(y) ? Math.max(GA.top, Math.min(GA.bottom, Y2P(y))) : y0); }
      const ye = fq(s.shade.b);
      g.lineTo(xb, Number.isFinite(ye) ? Math.max(GA.top, Math.min(GA.bottom, Y2P(ye))) : y0);
      g.lineTo(xb, y0);
      g.closePath(); g.fill(); g.restore();
    }
    for (const i of s.fns) { try { this.drawCurve(i); } catch (e) { if (!(e instanceof CalcError)) throw e; } }
    for (const sk of s.sketch) {
      g.strokeStyle = '#000'; g.lineWidth = 1.5; g.setLineDash([]);
      g.beginPath();
      if (sk.t === 'line') { g.moveTo(0, clampP(Y2P(sk.m * P2X(0) + sk.b))); g.lineTo(LW, clampP(Y2P(sk.m * P2X(LW) + sk.b))); }
      else if (sk.t === 'v') { g.moveTo(X2P(sk.x), GA.top); g.lineTo(X2P(sk.x), GA.bottom); }
      else if (sk.t === 'h') { g.moveTo(0, Y2P(sk.y)); g.lineTo(LW, Y2P(sk.y)); }
      else if (sk.t === 'inv' && mem.fn[sk.i] && fnDefined(mem.fn[sk.i])) {
        g.strokeStyle = COLORS[mem.fn[sk.i].color]; g.setLineDash([4, 3]);
        const fq = fnGet(sk.i).f;
        let pen = false;
        for (let n = 0; n <= 768; n++) {
          const t = P2Y(GA.top + n / 4 * (GA.bottom - GA.top) / 192), v = fq(t);
          if (!Number.isFinite(v)) { pen = false; continue; }
          // обратная зависимость: координаты меняются местами
          const qx = clampP(X2P(v)), qy = clampP(Y2P(t));
          if (pen) g.lineTo(qx, qy); else { g.moveTo(qx, qy); pen = true; }
        }
      }
      g.stroke();
      g.setLineDash([]);
    }
    lcd.unclip();

    // состояние
    const fmt = (v) => (Number.isFinite(v) ? fmtFit(v, 13) : 'ERROR');
    if (s.st === 'trace' || s.st === 'tangent' || s.st === 'normal' || s.st === 'intLo' || s.st === 'intHi') {
      const tr = s.tr, p = this.point(tr), fn = mem.fn[s.fns[tr.k]];
      this.caption(tr.k);
      if (Number.isFinite(p.x) && Number.isFinite(p.y)) this.pointer(X2P(p.x), Y2P(p.y), COLORS[fn.color]);
      let upper = s.note;
      if (s.st === 'intLo') upper = 'LOWER';
      else if (s.st === 'intHi') upper = 'UPPER';
      else if (!upper && tr.t !== undefined) upper = (fn.type === 'r=' ? 'θ=' : 'T=') + fmt(tr.t) + (fn.type === 'r=' ? '  r=' + fmt(p.r) : '');
      else if (!upper && S.deriv === 'On' && tr.x !== undefined) upper = 'dY/dX=' + fmt(snapNice(nDeriv(fnGet(s.fns[tr.k]).f, tr.x)));
      if (!s.input) this.coords('X=' + fmt(p.x), 'Y=' + fmt(p.y), upper);
    } else if (s.st === 'pick') {
      this.caption(s.fns.indexOf(s.pick.c[s.pick.i]), true);
    } else if (s.st === 'result') {
      const r = s.res, p = r.pts[r.i];
      if (r.k >= 0) this.caption(r.k);
      if (Number.isFinite(p.x) && Number.isFinite(p.y)) this.pointer(X2P(p.x), Y2P(p.y), r.k >= 0 ? COLORS[mem.fn[s.fns[r.k]].color] : '#000');
      if (r.label === '∫dx') {
        this.coords(null, null, null);
        const y = LH - 17 - (s.menu ? 24 : 0), t1 = '∫dx=' + fmt(r.value), t2 = 'LOWER=' + fmt(r.a) + '  UPPER=' + fmt(r.b);
        lcd.rect(1, y - 17, Math.max(lcd.miniW(t1, { px: 14 }), lcd.miniW(t2, { px: 14 })) + 6, 34, '#fff');
        lcd.mini(4, y - 16, t2, { px: 14 });
        lcd.mini(4, y + 1, t1, { px: 14 });
      } else this.coords('X=' + fmt(p.x), 'Y=' + fmt(p.y), r.label);
    } else if (s.ptr) {
      const { px, py } = s.ptr;
      if (s.st === 'box2') {
        const bx = X2P(s.box.x), by = Y2P(s.box.y);
        g.strokeStyle = '#000'; g.lineWidth = 1; g.setLineDash([3, 2]);
        g.strokeRect(Math.min(bx, px) + .5, Math.min(by, py) + .5, Math.abs(px - bx), Math.abs(py - by));
        g.setLineDash([]);
      }
      if (s.st === 'vline') lcd.line(px, GA.top, px, GA.bottom, '#666', 1);
      if (s.st === 'hline') lcd.line(0, py, LW, py, '#666', 1);
      this.pointer(px, py, '#000');
      this.coords('X=' + fmt(r15(P2X(px))), 'Y=' + fmt(r15(P2Y(py))), null);
    }
    if (s.input) {
      const y = LH - 20 - (s.menu ? 24 : 0);
      lcd.rect(0, y - 4, LW, 24, '#fff');
      lcd.line(0, y - 4.5, LW, y - 4.5, '#000', 1);
      lcd.text(2, y - 3, s.input.prompt);
      s.input.field.draw(2 + s.input.prompt.length * 18, y + 9, LW - 8 - s.input.prompt.length * 18);
    }
    if (s.menu) lcd.fmenu(s.menu.labels());
  },

  save() {
    return {
      fn: mem.fn.map((f) => ({ type: f.type, row: f.row, row2: f.row2, math: f.math, sel: f.sel, color: f.color, style: f.style })),
      vw: { ...VW }, zf: { ...ZOOM_FACT }
    };
  },
  load(st) {
    if (Array.isArray(st.fn)) {
      st.fn.slice(0, 20).forEach((f, i) => {
        if (!f || !Array.isArray(f.row)) return;
        mem.fn[i] = {
          type: FN_TYPES.includes(f.type) ? f.type : 'Y=', row: f.row, row2: Array.isArray(f.row2) ? f.row2 : [], math: f.math !== false,
          sel: !!f.sel, color: COLORS[f.color] ? f.color : FN_COLORS[i % 5], style: FN_STYLES.includes(f.style) ? f.style : 'Normal'
        };
      });
    }
    if (st.vw) for (const k in VW) if (Number.isFinite(st.vw[k])) VW[k] = st.vw[k];
    if (st.zf && st.zf.x > 0 && st.zf.y > 0) { ZOOM_FACT.x = st.zf.x; ZOOM_FACT.y = st.zf.y; }
    if (!vwOk()) vwSet('INITIAL');
  }
};
UI.apps.graph = graphApp;

// ══════ 95-boot.js — запуск: хранилище, тема, самообновление, работа без интернета ══════

// localStorage может быть недоступен (частный режим) — тогда просто не сохраняем
const APP_KEY = 'app-' + location.pathname.replace(/[^a-z0-9]+/gi, '-');   // у каждого приложения на github.io свой ключ
const store = {
  get(k, def) { try { const v = localStorage.getItem(APP_KEY + ':' + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(APP_KEY + ':' + k, JSON.stringify(v)); } catch (e) { /* нет хранилища */ } }
};
const $ = (s) => document.querySelector(s);
let toastTm = 0;
function toast(text, ms) {
  const el = $('#toast');
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(toastTm);
  toastTm = setTimeout(() => el.classList.remove('on'), ms || 2400);
}

// ---------- состояние калькулятора: сохраняется после каждого нажатия ----------
function saveState() {
  const st = { v: 1, S: { ...S }, vars: mem.vars, ans: mem.ans, lists: mem.lists, listSub: mem.listSub, mats: mem.mats, app: UI.appId, apps: {} };
  for (const id in UI.apps) if (UI.apps[id].save) { try { st.apps[id] = UI.apps[id].save(); } catch (e) { /* режим не сохранился — не страшно */ } }
  store.set('state', st);
}
function loadState() {
  const st = store.get('state', null);
  if (!st || st.v !== 1) return null;
  const okNum = (x) => x && typeof x.v === 'number' && Number.isFinite(x.v);
  for (const k in S) if (st.S && typeof st.S[k] === typeof S[k]) S[k] = st.S[k];
  for (const n of VARS) if (st.vars && okNum(st.vars[n])) setVar(n, st.vars[n]);
  if (okNum(st.ans)) mem.ans = st.ans;
  if (Array.isArray(st.lists)) mem.lists = st.lists.map((l) => (Array.isArray(l) ? l.filter(okNum) : []));
  if (Array.isArray(st.listSub)) mem.listSub = st.listSub.map((s) => (typeof s === 'string' ? s : ''));
  if (st.mats && typeof st.mats === 'object') {
    for (const n in st.mats) if (/^[A-Z]$/.test(n) && Array.isArray(st.mats[n]) && st.mats[n].length && st.mats[n].every((r) => Array.isArray(r) && r.length === st.mats[n][0].length && r.every(okNum))) mem.mats[n] = st.mats[n];
  }
  for (const id in UI.apps) if (UI.apps[id].load && st.apps && st.apps[id]) { try { UI.apps[id].load(st.apps[id]); } catch (e) { /* повреждённые данные режима пропускаем */ } }
  return st;
}

// ---------- тема: как в системе / светлая / тёмная ----------
function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  document.querySelectorAll('[data-theme-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeSet === (t || 'auto'))));
  const dark = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach((m) => { m.content = dark ? '#000000' : '#d9dde3'; });
}
applyTheme(store.get('theme', 'auto'));
document.querySelectorAll('[data-theme-set]').forEach((b) => b.addEventListener('click', () => {
  store.set('theme', b.dataset.themeSet);
  applyTheme(b.dataset.themeSet);
}));

// ---------- отклик клавиш (вибрация, где она есть) ----------
function applyVib(on) {
  UI.vib = on;
  document.querySelectorAll('[data-vib-set]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.vibSet === 'on') === on)));
}
applyVib(store.get('vib', true));
document.querySelectorAll('[data-vib-set]').forEach((b) => b.addEventListener('click', () => {
  store.set('vib', b.dataset.vibSet === 'on');
  applyVib(b.dataset.vibSet === 'on');
  if (UI.vib && navigator.vibrate) { try { navigator.vibrate(12); } catch (e) { /* нет вибрации */ } }
}));
if (!navigator.vibrate) $('#vib-row').hidden = true;

// ---------- окно настроек приложения ----------
const sheet = $('#sheet');
$('#more').addEventListener('click', () => { sheet.hidden = false; });
$('#sheet-close').addEventListener('click', () => { sheet.hidden = true; });
sheet.addEventListener('click', (e) => { if (e.target === sheet) sheet.hidden = true; });

// ---------- самообновление ----------
// В начале index.html лежит метка сборки <meta name="app-build">, её ставит tools/stamp.py.
// При открытии, при возврате в приложение и раз в 10 минут скачиваем начало свежего index.html (несколько КБ)
// и сравниваем метки. Нашлась новая сборка: если человек ничем не занят — перезагружаемся сразу,
// если занят (см. isBusy) — показываем плашку с кнопкой.
const BUILD = (document.querySelector('meta[name="app-build"]') || {}).content || '';
const UPD_ON = !!BUILD && BUILD !== 'dev' && /^https?:$/.test(location.protocol);
const UPD_KEY = APP_KEY + ':upd';
let updNew = null, updAt = 0, updBusy = false, updGoing = false;
$('#ver').textContent = BUILD || '—';

// «Посреди работы»: калькулятором пользовались в последние полторы минуты или открыто окно настроек.
// Состояние калькулятора сохраняется после каждого нажатия, так что обновление ничего не теряет.
window.appBusy = () => Date.now() - UI.lastKeyAt < 90000 || !sheet.hidden;
function isBusy() {
  const a = document.activeElement;
  if (a && (a.matches('input, textarea, select') || a.isContentEditable)) return true;
  try { return !!window.appBusy(); } catch (e) { return false; }
}

const updGet = () => { try { return JSON.parse(sessionStorage.getItem(UPD_KEY) || 'null'); } catch (e) { return null; } };
const updPut = (v) => { try { if (v) sessionStorage.setItem(UPD_KEY, JSON.stringify(v)); else sessionStorage.removeItem(UPD_KEY); } catch (e) { /* нет хранилища */ } };

async function updCheck(force) {
  if (!UPD_ON || updBusy || updGoing || (!force && Date.now() - updAt < 60000) || navigator.onLine === false) return null;
  updBusy = true; updAt = Date.now();
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const tm = setTimeout(() => ctl && ctl.abort(), 9000);
  let found = null;
  try {
    // ?upd=время — чтобы не получить старую копию из кэша браузера, GitHub Pages или офлайн-копии
    const r = await fetch(location.pathname + '?upd=' + Date.now(), { cache: 'no-store', headers: { Range: 'bytes=0-4095' }, signal: ctl ? ctl.signal : undefined });
    let txt = '';
    if (r.body && r.body.getReader && typeof TextDecoder === 'function') {
      const rd = r.body.getReader(), dec = new TextDecoder();
      while (txt.length < 16384) {
        const x = await rd.read();
        if (x.done) break;
        txt += dec.decode(x.value, { stream: true });
        if (/name="app-build" content="[^"]*"/.test(txt)) break;
      }
      try { rd.cancel(); } catch (e) { /* уже закрыт */ }
    } else txt = (await r.text()).slice(0, 16384);
    const m = (r.ok || r.status === 206) && txt.match(/name="app-build" content="([^"]+)"/);
    if (m && m[1] !== BUILD && m[1] !== 'dev') { found = updNew = m[1]; updTick(); }
  } catch (e) { /* нет связи — проверим в следующий раз */ }
  clearTimeout(tm); updBusy = false;
  return found;
}

function updTick() {
  if (!updNew || updGoing) return;
  const tried = updGet();
  // защита от петли: если уже дважды за 10 минут пытались обновиться до этой сборки — только плашка
  const looping = tried && tried.to === updNew && tried.n >= 2 && Date.now() - tried.at < 600000;
  if (isBusy() || looping) updBar(true); else updGo();
}

function updGo() {
  if (!updNew || updGoing) return;
  updGoing = true;
  clearTimeout(saveTimer);
  saveState();
  const tried = updGet();
  updPut({ to: updNew, at: Date.now(), n: tried && tried.to === updNew ? (tried.n || 0) + 1 : 1 });
  toast('Updating…', 2000);
  setTimeout(() => location.replace(location.pathname + '?v=' + encodeURIComponent(updNew) + location.hash), 600);
}

function updBar(on) {
  let el = document.getElementById('updbar');
  if (!on) { if (el) el.remove(); return; }
  if (el) return;
  el = document.createElement('div');
  el.id = 'updbar';
  el.setAttribute('role', 'status');
  el.innerHTML = '<span><b>New version available</b><small>Takes a couple of seconds</small></span>'
    + '<button type="button" class="btn" data-upd="go">Update</button>'
    + '<button type="button" class="x" data-upd="x" aria-label="Later">✕</button>';
  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-upd]');
    if (!b) return;
    if (b.dataset.upd === 'go') updGo(); else { el.remove(); updNew = null; }
  });
  document.body.appendChild(el);
}

$('#checkupd').addEventListener('click', async () => {
  if (!UPD_ON) { toast('Works on the website only'); return; }
  toast('Checking…', 1200);
  const f = await updCheck(true);
  if (!f) toast('This is the latest version');
});

// ---------- работа без интернета ----------
// sw.js хранит копию страницы; после первого открытия калькулятор запускается и без сети.
function swStart() {
  const note = $('#offline-note');
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  const show = () => { note.textContent = navigator.serviceWorker.controller ? 'Offline use: ready.' : ''; };
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(show).catch(() => { /* без офлайна тоже работает */ });
  navigator.serviceWorker.addEventListener('controllerchange', show);
  show();
}

// ---------- запуск ----------
function boot() {
  buildKeys();
  lcd.init($('#lcd'));
  const st = loadState();
  openApp(st && UI.apps[st.app] ? st.app : 'menu');
  layoutCalc();
  let rz = 0;
  const relayout = () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(layoutCalc); };
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', () => setTimeout(layoutCalc, 250));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutCalc);
  setInterval(() => { UI.blink = !UI.blink; if (UI.sawCursor && sheet.hidden) redraw(); }, 500);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') { clearTimeout(saveTimer); saveState(); } });
  window.addEventListener('pagehide', () => { clearTimeout(saveTimer); saveState(); });

  if (UPD_ON) {
    const was = updGet();
    if (was && was.to === BUILD) { updPut(null); setTimeout(() => toast('Updated'), 500); }
    // убираем ?v=… из адреса после обновления
    if (/[?&]v=/.test(location.search) && history.replaceState) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* не страшно */ } }
    setTimeout(() => updCheck(true), 1500);
    setInterval(() => { if (document.visibilityState === 'visible') updCheck(); }, 600000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') updCheck(true); });
    window.addEventListener('pageshow', (e) => { if (e.persisted) updCheck(true); });
    window.addEventListener('online', () => updCheck(true));
  }
  swStart();
}
