function finDep(kind, v) {
  const { n, I, PV, FV, j, YR1 } = v;
  if (!(n > 0) || n > 9999 || !Number.isInteger(n) || !Number.isInteger(j) || j < 1 || !(YR1 >= 1 && YR1 <= 12)) finBad();
  const part = YR1 !== 12;                     // первый год неполный — есть год n+1
  if (j > n + (part ? 1 : 0)) finBad();
  const base = PV - FV, f1 = YR1 / 12;
  if (kind === 'SL') return { val: finNum(j === 1 ? base / n * f1 : j === n + 1 ? base / n * (1 - f1) : base / n), rdv: null };
  let val = 0, rdv = 0;
  if (kind === 'SYD') {
    const Z = n * (n + 1) / 2, n1 = n - f1, ip = Math.floor(n1), Z1 = (ip + 1) * (ip + 2 * (n1 - ip)) / 2;
    const first = n / Z * f1 * base;
    val = first; rdv = base - first;
    for (let k = 2; k <= j; k++) {
      val = (n1 - k + 2) / Z1 * (base - first) * (k === n + 1 ? 1 - f1 : 1);
      rdv -= val;
    }
    if (j === n + (part ? 1 : 0)) rdv = Math.abs(rdv) < 1e-9 * Math.max(1, Math.abs(base)) ? 0 : rdv;
    return { val: finNum(val), rdv: finNum(rdv) };
  }
  const rate = kind === 'FP' ? I / 100 : I / 100 / n;          // FP — доля в год, DB — коэффициент ускорения
  val = PV * rate * f1; rdv = base - val;
  for (let k = 2; k <= j; k++) {
    if (k === n + 1) { val = rdv; rdv = 0; } else { val = (rdv + FV) * rate; rdv -= val; }
  }
  return { val: finNum(val), rdv: finNum(rdv) };
}

// Облигация: d1 — покупка, d2 — погашение, M купонов в год. → число оставшихся купонов N,
// дней в купонном периоде D, прошло A, осталось B до ближайшего купона
function finBondParts(d1, d2, M, mode) {
  finDateOk(d1); finDateOk(d2);
  if (!(finDayNo(d2) > finDayNo(d1))) finBad();
  let N = 0, prev = d2, next = d2;
  do { N++; next = prev; prev = finAddMonths(d2, -N * 12 / M); } while (finDayNo(prev) > finDayNo(d1) && N < 2400);
  const cnt = (a, b) => (mode === '360' ? finDays(a, b, '360') : finDayNo(b) - finDayNo(a));
  const D = mode === '360' ? 360 / M : cnt(prev, next), A = cnt(prev, d1);
  return { N, D, A, B: D - A };
}
// Цена на 100 единиц номинала (отрицательная — деньги отдаём), без накопленного купона
function finBondPrice(p, RDV, CPN, YLD, M) {
  const y = YLD / 100 / M, c = CPN / M, w = p.B / p.D;
  if (!(1 + y > 0)) return NaN;
  if (p.N <= 1) return -(RDV + c) / (1 + w * y) + p.A / p.D * c;
  let prc = -RDV / Math.pow(1 + y, p.N - 1 + w);
  for (let k = 1; k <= p.N; k++) prc -= c / Math.pow(1 + y, k - 1 + w);
  return prc + p.A / p.D * c;
}
// what = 'PRC' → {PRC, INT, CST}; what = 'YLD' → доходность в процентах. v = {d1, d2, RDV, CPN, PRC, YLD}
function finBond(what, v, mode, periods) {
  const M = periods === 'Semi' ? 2 : 1, p = finBondParts(v.d1, v.d2, M, mode);
  if (what === 'PRC') {
    const prc = finNum(finBondPrice(p, v.RDV, v.CPN, v.YLD, M)), int = -p.A / p.D * v.CPN / M;
    return { PRC: prc, INT: finNum(int), CST: finNum(prc + int) };
  }
  const g = (yl) => finBondPrice(p, v.RDV, v.CPN, yl, M) - v.PRC;
  const g0 = g(0);
  if (g0 === 0) return 0;
  if (!Number.isFinite(g0)) finBad();
  let y = finScan(g, g0, [0.5, 1, 2, 5, 10, 20, 50, 100, 1000]);
  if (!Number.isFinite(y)) y = finScan(g, g0, [-0.5, -1, -2, -5, -10, -20, -50, -90]);
  return finNum(r15(y));
}

  [['simple', 'SIMPLE', 'Simple Interest'], ['compound', 'COMPOUND', 'Compound Interest'], ['cash', 'CASH', 'Cash Flow'], ['amort', 'AMORTZN', 'Amortization'], ['conv', 'CONVERT', 'Conversion']],
  [['cost', 'COST', 'Cost/Sell/Margin'], ['days', 'DAYS', 'Days Calculation'], ['dep', 'DEPREC', 'Depreciation'], ['bond', 'BOND', 'Bond Calculation'], null]

// Столбец платежей (List n): правка значений денежного потока
function finListEdit(n) {
  const list = () => mem.lists[n - 1] || (mem.lists[n - 1] = []);
  pushModal({
    sel: 0, top: 0, field: null,
    see() {
      this.sel = Math.max(0, Math.min(list().length, this.sel));
      if (this.sel < this.top) this.top = this.sel;
      if (this.sel > this.top + 4) this.top = this.sel - 4;
    },
    key(k) {
      const a = list();
      if (this.field) {
        this.field.key(k, (x) => { a[this.sel] = x; this.field = null; this.sel++; this.see(); }, () => { this.field = null; });
        return;
      }
      const f = fIndex(k);
      if (f === 0 || k.id === 'DEL') { if (this.sel < a.length) a.splice(this.sel, 1); }
      else if (f === 1) { if (a.length) confirmBox(['Delete All?', ''], () => { mem.lists[n - 1] = []; this.sel = 0; this.top = 0; }); return; }
      else if (f === 2) { if (a.length < 999) a.splice(this.sel, 0, RI(0)); }
      else if (k.id === 'UP') this.sel--;
      else if (k.id === 'DOWN' || k.id === 'EXE') this.sel++;
      else if (k.id === 'EXIT') { popModal(); return; }
      else if (startsNumber(k)) { if (a.length >= 999 && this.sel >= a.length) fail('Memory ERROR'); this.field = new NumField(); this.field.key(k); return; }
      this.see();
    },
    draw() {
      const a = list();
      lcd.rect(0, 23, LW, LH - 23, '#fff');
      lcd.text(0, 24, 'List ' + n);
      lcd.line(0, 47.5, LW, 47.5, '#000', 1);
      for (let r = 0; r < 5; r++) {
        const i = this.top + r;
        if (i > a.length) break;
        const y = 48 + r * 24, idx = String(i + 1), on = i === this.sel;
        lcd.text(54 - idx.length * 18, y, idx);
        if (on) lcd.rect(72, y, LW - 76, 24, HILITE);
        if (i < a.length) { const s = fmtFit(a[i].v, 15); lcd.text(LW - 6 - [...s].length * 18, y, s, { color: on ? '#fff' : '#000' }); }
      }
      lcd.line(63.5, 48, 63.5, 168, '#000', 1);
      lcd.line(0, 168.5, LW, 168.5, '#000', 1);
      if (this.field) this.field.draw(4, 180, LW - 8);
      else if (this.sel < a.length) { const s = fmtNum(a[this.sel].v); lcd.text(LW - 4 - [...s].length * 18, 169, s); }
      lcd.fmenu([{ l: 'DELETE', k: 'cmd' }, { l: 'DEL-ALL', k: 'cmd' }, { l: 'INSERT', k: 'cmd' }]);
    }
  });
}

const finApp = {
  page: 0, scr: 'menu', sel: 0, top: 0, field: null, res: null, menu: null, defs: null,
  t: { ...FIN_T0 }, c: { ...FIN_C0 }, d: { ...FIN_D0 }, b: { ...FIN_B0 }, cf: { list: 1 },

  enter() { this.scr = 'menu'; this.page = 0; this.field = null; this.res = null; },
  setup() { return ['payment', 'dateMode', 'periods', 'disp']; },

  // Описания расчётов: заголовок, поля [объект, ключ, подпись], меню действий
  forms() {
    if (this.defs) return this.defs;
    const t = this.t, c = this.c, d = this.d, b = this.b, cf = this.cf;
    const F = (o, k, l, list) => ({ o, k, l, list: !!list });
    const tvm = [F(t, 'n', 'n'), F(t, 'I', 'I%'), F(t, 'PV', 'PV'), F(t, 'PMT', 'PMT'), F(t, 'FV', 'FV'), F(t, 'PY', 'P/Y'), F(t, 'CY', 'C/Y')];
    const date = (x) => [F(d, 'm' + x, 'd' + x + ':M'), F(d, 'd' + x, 'd' + x + ':D'), F(d, 'y' + x, 'd' + x + ':Y')];
    const begin = () => S.payment === 'Begin';
    const pay = () => (begin() ? 'Bgn' : 'End');
    const D1 = () => ({ m: d.m1, d: d.d1, y: d.y1 }), D2 = () => ({ m: d.m2, d: d.d2, y: d.y2 });
    const flows = () => { const a = mem.lists[cf.list - 1]; if (!a || !a.length) fail('Dimension ERROR'); return a.map((x) => x.v); };
    const show = (rows) => this.show(rows);
    const dateStr = (q) => q.m + '/' + q.d + '/' + q.y;
    // найти переменную сложных процентов и записать её в своё поле
    const solve = (what, label) => mi(label, () => { const x = finTvm(what, t, begin()); t[what] = x; show([[label, x]]); });
    const amort = (key, label) => mi(label, () => show([[label, finAmort(t, begin())[key]]]));
    const dep = (kind) => mi(kind, () => { const r = finDep(kind, t); show(r.rdv === null ? [[kind, r.val]] : [[kind, r.val], ['RDV', r.rdv]]); });
    this.defs = {
      simple: {
        title: () => 'Simple Interest', fields: tvm.slice(0, 3),
        menu: [mi('SI', () => show([['SI', finSimple(t.n, t.I, t.PV, S.dateMode).SI]])), mi('SFV', () => show([['SFV', finSimple(t.n, t.I, t.PV, S.dateMode).SFV]]))]
      },
      compound: {
        title: () => 'Compound Interest:' + pay(), fields: tvm,
        menu: [solve('n', 'n'), solve('I', 'I%'), solve('PV', 'PV'), solve('PMT', 'PMT'), solve('FV', 'FV'), mi('AMORTZN', () => this.open('amort'))]
      },
      cash: {
        title: () => 'Cash Flow', fields: [F(t, 'I', 'I%'), F(cf, 'list', 'Csh', true)],
        menu: [
          mi('NPV', () => show([['NPV', finNpv(t.I, flows())]])), mi('IRR', () => show([['IRR', finIrr(flows())]])),
          mi('PBP', () => show([['PBP', finPbp(t.I, flows())]])), mi('NFV', () => show([['NFV', finNfv(t.I, flows())]])),
          mi('◀LIST', () => finListEdit(cf.list)),
          mi('LIST', () => numDialog('Cash Flow', [['List', cf.list]], (v) => { this.put({ o: cf, k: 'list', list: true }, v[0]); }))
        ]
      },
      amort: {
        title: () => 'Amortization:' + pay(), fields: [F(t, 'PM1', 'PM1'), F(t, 'PM2', 'PM2'), ...tvm],
        menu: [amort('BAL', 'BAL'), amort('INT', 'INT'), amort('PRN', 'PRN'), amort('SINT', 'ΣINT'), amort('SPRN', 'ΣPRN'), mi('COMPOUND', () => this.open('compound'))]
      },
      conv: {
        title: () => 'Conversion', fields: tvm.slice(0, 2),
        menu: [mi('▶EFF', () => show([['EFF', finEff(t.n, t.I)]])), mi('▶APR', () => show([['APR', finApr(t.n, t.I)]]))]
      },
      cost: {
        title: () => 'Cost/Sell/Margin', fields: [F(c, 'Cst', 'Cst'), F(c, 'Sel', 'Sel'), F(c, 'Mrg', 'Mrg')],
        menu: [
          mi('COST', () => { c.Cst = finCost(c.Sel, c.Mrg); show([['Cst', c.Cst]]); }),
          mi('SELL', () => { c.Sel = finSell(c.Cst, c.Mrg); show([['Sel', c.Sel]]); }),

        menu: [

          mi('d1−D', () => show([['d1−D', dateStr(finDateAdd(D1(), -d.D, S.dateMode))]]))
        ]

        menu: [dep('SL'), dep('FP'), dep('SYD'), dep('DB')]
      },
      bond: {
        title: () => 'Bond Calculation', fields: [...date(1), ...date(2), F(b, 'RDV', 'RDV'), F(b, 'CPN', 'CPN'), F(b, 'PRC', 'PRC'), F(b, 'YLD', 'YLD')],
        menu: [
          mi('PRC', () => { const r = finBond('PRC', { d1: D1(), d2: D2(), ...b }, S.dateMode, S.periods); b.PRC = r.PRC; show([['PRC', r.PRC], ['INT', r.INT], ['CST', r.CST]]); }),
          mi('YLD', () => { b.YLD = finBond('YLD', { d1: D1(), d2: D2(), ...b }, S.dateMode, S.periods); show([['YLD', b.YLD]]); })
        ]
      }

    return this.defs;
  },
  form() { return this.forms()[this.scr]; },
  open(id) {
    this.scr = id; this.sel = 0; this.top = 0; this.field = null; this.res = null;
    this.menu = new FMenu(this.form().menu);
  },
  show(rows) { this.res = rows; this.field = null; this.menu = new FMenu([mi('REPEAT', () => this.repeat())]); },
  repeat() { this.res = null; this.menu = new FMenu(this.form().menu); },
  put(fd, x) {
    if (fd.list) { if (!Number.isInteger(x) || x < 1 || x > 26) fail('Argument ERROR'); }
    fd.o[fd.k] = x;
  },
  move(dir) {
    const n = this.form().fields.length;
    this.sel = (this.sel + dir + n) % n;
    if (this.sel < this.top) this.top = this.sel;
    if (this.sel > this.top + 5) this.top = this.sel - 5;
  },

  key(k) {
    const f = fIndex(k);
    if (this.scr === 'menu') {
      if (f === 5) this.page = 1 - this.page;
      else if (f >= 0) { const it = FIN_PAGES[this.page][f]; if (it) this.open(it[0]); }
      else if (k.id === 'EXIT' && this.page) this.page = 0;
      return;
    }
    if (this.res) {
      if (f === 0 || k.id === 'EXIT' || k.id === 'EXE') this.repeat();
      return;
    }
    const fields = this.form().fields;
    if (this.field) {
      this.field.key(k, (x) => { this.put(fields[this.sel], x.v); this.field = null; this.move(1); }, () => { this.field = null; });
      return;
    }
    if (f >= 0) { const it = this.menu.press(f); if (it && it.fn) it.fn(); return; }
    switch (k.id) {
      case 'UP': this.move(-1); break;
      case 'DOWN': case 'EXE': this.move(1); break;
      case 'EXIT': this.page = FIN_PAGES[0].some((p) => p && p[0] === this.scr) ? 0 : 1; this.scr = 'menu'; break;
      default: if (startsNumber(k)) { this.field = new NumField(); this.field.key(k); }
    }
  },
  tap(x, y) {
    if (y < 48 || y >= 192 || this.field || this.res) return;
    const r = Math.floor((y - 48) / 24);
    if (this.scr === 'menu') { if (r < 5 && FIN_PAGES[this.page][r]) this.open(FIN_PAGES[this.page][r][0]); else if (r === 5) this.page = 1 - this.page; return; }
    if (this.top + r < this.form().fields.length) this.sel = this.top + r;
  },

  row(y, label, val, on) {
    lcd.text(0, y, label);
    lcd.text(72, y, '=');
    if (on && this.field) { this.field.draw(90, y + 12, LW - 94); return; }
    lcd.text(90, y, typeof val === 'string' ? val : fmtFit(val, 16), on ? { inv: true } : undefined);
  },
  draw() {
    statusBar(stdTags());
    if (this.scr === 'menu') {
      const page = FIN_PAGES[this.page];
      lcd.text(0, 24, 'Financial(' + (this.page + 1) + '/2)');
      page.forEach((it, i) => { if (it) lcd.text(18, 48 + i * 24, 'F' + (i + 1) + ':' + it[2]); });
      lcd.text(18, 48 + 5 * 24, 'F6:Next Page');
      lcd.fmenu([...page.map((it) => it && { l: it[1], k: 'cmd' }), { l: '▷', k: 'cmd' }]);
      return;
    }
    const fm = this.form();
    lcd.text(0, 24, fm.title());
    if (this.res) this.res.forEach(([label, val], i) => this.row(48 + i * 24, label, val, false));
    else {
      for (let r = 0; r < 6; r++) {
        const i = this.top + r;
        if (i >= fm.fields.length) break;
        const fd = fm.fields[i], v = fd.o[fd.k];
        this.row(48 + r * 24, fd.l, fd.list ? 'List ' + v : v, i === this.sel);
      }
      if (this.top > 0) lcd.glyph('▲', LW - 9, 58, 12, '#000');
      if (this.top + 6 < fm.fields.length) lcd.glyph('▼', LW - 9, 184, 12, '#000');
    }
    lcd.fmenu(this.menu.labels());
  },

  save() { return { t: { ...this.t }, c: { ...this.c }, d: { ...this.d }, b: { ...this.b }, cf: { ...this.cf } }; },
  load(st) {
    const take = (to, from) => { if (from) for (const k in to) if (Number.isFinite(from[k])) to[k] = from[k]; };
    take(this.t, st.t); take(this.c, st.c); take(this.d, st.d); take(this.b, st.b);
    if (st.cf && Number.isInteger(st.cf.list) && st.cf.list >= 1 && st.cf.list <= 26) this.cf.list = st.cf.list;
  },
  reset() {
    Object.assign(this.t, FIN_T0); Object.assign(this.c, FIN_C0); Object.assign(this.d, FIN_D0); Object.assign(this.b, FIN_B0);
    this.cf.list = 1;
    this.enter();
  }
};
UI.apps.fin = finApp;

// ══════ 90-system.js — режим System: версия и сброс памяти ══════

function resetSetup() {
  Object.assign(S, S_DEF);
  vwSet('INITIAL');
  ZOOM_FACT.x = 2; ZOOM_FACT.y = 2;
  plotVer++;
}
function resetMain() {
  mem.vars = {}; fv.fill(0);
  mem.ans = null; mem.listAns = null; mem.matAns = null;
  mem.lists = []; mem.listSub = []; mem.mats = {};
  mem.fn = Array.from({ length: 20 }, (_, i) => newFn(i));
  fnTouch(); plotVer++;
  for (const id in UI.apps) if (UI.apps[id].reset) UI.apps[id].reset();
}

const systemApp = {
  menu: null, page: 'main',
  enter() {
    this.page = 'main';
    const done = (text) => () => infoBox([text, '', 'Press:[EXIT]']);
    this.menu = new FMenu([
      null, null, null,
      mi('VERSION', () => { this.page = 'version'; }),
      mi('RESET', [
        mi('SETUP', () => confirmBox(['Reset Setup Data?', ''], () => { resetSetup(); done('Reset!')(); })),
        mi('MAIN', () => confirmBox(['Reset Main', 'Memories?'], () => { resetMain(); done('Reset!')(); })),
        null, null, null,
        mi('ALL', () => confirmBox(['Initialize All?', ''], () => { resetSetup(); resetMain(); done('Initialized!')(); }))
      ])
    ]);
  },
  key(k) {
    if (this.page === 'version') { if (k.id === 'EXIT' || k.id === 'EXE' || k.id === 'AC') this.page = 'main'; return; }
    const f = fIndex(k);
    if (f >= 0) { const it = this.menu.press(f); if (it && it.fn) it.fn(); return; }
    if (k.id === 'EXIT') this.menu.back();
  },
  draw() {
    statusBar([]);
    if (this.page === 'version') {
      const b = (document.querySelector('meta[name="app-build"]') || {}).content || '';
      lcd.text(0, 24, 'Version');
      lcd.text(18, 72, 'Graphing Calculator');
      lcd.text(18, 96, 'Build');
      lcd.mini(18, 124, b, { px: 15 });
      lcd.text(18, 168, 'Press:[EXIT]');
      return;
    }
    lcd.text(0, 24, 'System Manager');
    if (this.menu.depth === 1) {
      lcd.text(18, 72, 'F4:Version');
      lcd.text(18, 96, 'F5:Reset');
    } else {
      lcd.text(18, 72, 'F1:Setup Data');
      lcd.text(18, 96, 'F2:Main Memory');
      lcd.text(18, 120, 'F6:Initialize All');
    }
    lcd.fmenu(this.menu.labels());
  }
};
UI.apps.system = systemApp;
runApp.reset = function () { this.hist = []; this.sel = -1; if (this.ed) this.ed.clear(); };

// ══════ 91-memory.js — режим Memory: что лежит в памяти и удаление по частям ══════

function memItems() {
  const size = (x) => { try { return (JSON.stringify(x) || '').length; } catch (e) { return 0; } };
  const items = [
    { name: 'ALPHA MEM', size: size(mem.vars) + size(mem.ans), del() { mem.vars = {}; fv.fill(0); mem.ans = null; } },
    { name: 'LIST FILE', size: size(mem.lists) + size(mem.listSub), del() { mem.lists = []; mem.listSub = []; mem.listAns = null; } },
    { name: 'MATRIX', size: size(mem.mats), del() { mem.mats = {}; mem.matAns = null; } },
    {
      name: 'Y=DATA', size: size(mem.fn.filter((f) => f.row.length).map((f) => [f.row, f.row2])),
      del() { mem.fn = Array.from({ length: 20 }, (_, i) => newFn(i)); fnTouch(); plotVer++; }
    },
    { name: 'SETUP', size: size(S), del() { resetSetup(); } }
  ];
  const names = { run: 'HISTORY', stat: 'STAT', eqn: 'EQUATION', table: 'TABLE', recur: 'RECURSION', dyna: 'DYNA MEM', conic: 'CONICS', fin: 'FINANCIAL' };
  for (const id in names) {
    const app = UI.apps[id];
    if (app && app.reset && app.save) items.push({ name: names[id], size: size(app.save()), del() { app.reset(); } });
  }
  return items;
}

const memoryApp = {
  sel: 0, top: 0, marks: new Set(),
  enter() { this.sel = 0; this.top = 0; this.marks = new Set(); },
  key(k) {
    const items = memItems(), n = items.length, f = fIndex(k);
    if (f === 0) { const name = items[this.sel].name; if (this.marks.has(name)) this.marks.delete(name); else this.marks.add(name); return; }
    if (f === 5 || k.id === 'DEL') {
      const todo = this.marks.size ? items.filter((it) => this.marks.has(it.name)) : [items[this.sel]];
      confirmBox(['Delete Data?', ''], () => { for (const it of todo) it.del(); this.marks = new Set(); });
      return;
    }
    if (k.id === 'UP') this.sel = (this.sel + n - 1) % n;
    else if (k.id === 'DOWN') this.sel = (this.sel + 1) % n;
    if (this.sel < this.top) this.top = this.sel;
    if (this.sel > this.top + 5) this.top = this.sel - 5;
  },
  draw() {
    statusBar([]);
    lcd.text(0, 24, 'Main Memory');
    const items = memItems();
    for (let r = 0; r < 6; r++) {
      const i = this.top + r;
      if (i >= items.length) break;
      const it = items[i], y = 48 + r * 24, on = i === this.sel, ink = on ? '#fff' : '#000';
      if (on) lcd.rect(0, y, LW, 24, HILITE);
      if (this.marks.has(it.name)) lcd.glyph('▶', 9, y + 12, 16, ink);
      lcd.text(18, y, it.name, { color: ink });
      const s = ':' + String(it.size).padStart(6, ' ');
      lcd.text(LW - 4 - s.length * 18, y, s, { color: ink });
    }
    if (this.top > 0) lcd.glyph('▲', LW - 9, 34, 12, '#000');
    if (this.top + 6 < items.length) lcd.glyph('▼', LW - 9, 34 + 12, 12, '#000');
    lcd.fmenu([{ l: 'SELECT', k: 'cmd' }, null, null, null, null, { l: 'DELETE', k: 'cmd' }]);
  }
};
UI.apps.memory = memoryApp;

// ══════ 95-boot.js — запуск: хранилище, тема, самообновление, работа без интернета ══════

// localStorage может быть недоступен (частный режим) — тогда просто не сохраняем
const APP_KEY = 'app-' + location.pathname.replace(/[^a-z0-9]+/gi, '-');   // у каждого приложения на github.io свой ключ
const store = {
  get(k, def) { try { const v = localStorage.getItem(APP_KEY + ':' + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(APP_KEY + ':' + k, JSON.stringify(v)); } catch (e) { /* нет хранилища */ } }
};
const $ = (s) => document.querySelector(s);
let toastTm = 0;
function toast(text, ms) {
  const el = $('#toast');
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(toastTm);
  toastTm = setTimeout(() => el.classList.remove('on'), ms || 2400);
}

// ---------- состояние калькулятора: сохраняется после каждого нажатия ----------
let saveOff = false;                  // тесты: «чистый запуск» — стереть память и больше не сохранять до перезагрузки
function saveState() {
  if (saveOff) return;
  const st = { v: 1, S: { ...S }, vars: mem.vars, ans: mem.ans, lists: mem.lists, listSub: mem.listSub, mats: mem.mats, app: UI.appId, apps: {} };
  for (const id in UI.apps) if (UI.apps[id].save) { try { st.apps[id] = UI.apps[id].save(); } catch (e) { /* режим не сохранился — не страшно */ } }
  store.set('state', st);
}
function loadState() {
  const st = store.get('state', null);
  if (!st || st.v !== 1) return null;
  const okNum = (x) => x && typeof x.v === 'number' && Number.isFinite(x.v);
  for (const k in S) if (st.S && typeof st.S[k] === typeof S[k]) S[k] = st.S[k];
  for (const n of VARS) if (st.vars && okNum(st.vars[n])) setVar(n, st.vars[n]);
  if (okNum(st.ans)) mem.ans = st.ans;
  if (Array.isArray(st.lists)) mem.lists = st.lists.map((l) => (Array.isArray(l) ? l.filter(okNum) : []));
  if (Array.isArray(st.listSub)) mem.listSub = st.listSub.map((s) => (typeof s === 'string' ? s : ''));
  if (st.mats && typeof st.mats === 'object') {
    for (const n in st.mats) if (/^[A-Z]$/.test(n) && Array.isArray(st.mats[n]) && st.mats[n].length && st.mats[n].every((r) => Array.isArray(r) && r.length === st.mats[n][0].length && r.every(okNum))) mem.mats[n] = st.mats[n];
  }
  for (const id in UI.apps) if (UI.apps[id].load && st.apps && st.apps[id]) { try { UI.apps[id].load(st.apps[id]); } catch (e) { /* повреждённые данные режима пропускаем */ } }
  return st;
}

// ---------- тема: как в системе / светлая / тёмная ----------
function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  document.querySelectorAll('[data-theme-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeSet === (t || 'auto'))));
  const dark = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach((m) => { m.content = dark ? '#000000' : '#d9dde3'; });
}
applyTheme(store.get('theme', 'auto'));
document.querySelectorAll('[data-theme-set]').forEach((b) => b.addEventListener('click', () => {
  store.set('theme', b.dataset.themeSet);
  applyTheme(b.dataset.themeSet);
}));

// ---------- отклик клавиш (вибрация, где она есть) ----------
function applyVib(on) {
  UI.vib = on;
  document.querySelectorAll('[data-vib-set]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.vibSet === 'on') === on)));
}
applyVib(store.get('vib', true));
document.querySelectorAll('[data-vib-set]').forEach((b) => b.addEventListener('click', () => {
  store.set('vib', b.dataset.vibSet === 'on');
  applyVib(b.dataset.vibSet === 'on');
  if (UI.vib && navigator.vibrate) { try { navigator.vibrate(12); } catch (e) { /* нет вибрации */ } }
}));
if (!navigator.vibrate) $('#vib-row').hidden = true;

// ---------- окно настроек приложения ----------
const sheet = $('#sheet');
$('#more').addEventListener('click', () => { sheet.hidden = false; });
$('#sheet-close').addEventListener('click', () => { sheet.hidden = true; });
sheet.addEventListener('click', (e) => { if (e.target === sheet) sheet.hidden = true; });

// ---------- самообновление ----------
// В начале index.html лежит метка сборки <meta name="app-build">, её ставит tools/stamp.py.
// При открытии, при возврате в приложение и раз в 10 минут скачиваем начало свежего index.html (несколько КБ)
// и сравниваем метки. Нашлась новая сборка: если человек ничем не занят — перезагружаемся сразу,
// если занят (см. isBusy) — показываем плашку с кнопкой.
const BUILD = (document.querySelector('meta[name="app-build"]') || {}).content || '';
const UPD_ON = !!BUILD && BUILD !== 'dev' && /^https?:$/.test(location.protocol);
const UPD_KEY = APP_KEY + ':upd';
let updNew = null, updAt = 0, updBusy = false, updGoing = false;
$('#ver').textContent = BUILD || '—';

// «Посреди работы»: калькулятором пользовались в последние полторы минуты или открыто окно настроек.
// Состояние калькулятора сохраняется после каждого нажатия, так что обновление ничего не теряет.
window.appBusy = () => Date.now() - UI.lastKeyAt < 90000 || !sheet.hidden;
function isBusy() {
  const a = document.activeElement;
  if (a && (a.matches('input, textarea, select') || a.isContentEditable)) return true;
  try { return !!window.appBusy(); } catch (e) { return false; }
}

const updGet = () => { try { return JSON.parse(sessionStorage.getItem(UPD_KEY) || 'null'); } catch (e) { return null; } };
const updPut = (v) => { try { if (v) sessionStorage.setItem(UPD_KEY, JSON.stringify(v)); else sessionStorage.removeItem(UPD_KEY); } catch (e) { /* нет хранилища */ } };

async function updCheck(force) {
  if (!UPD_ON || updBusy || updGoing || (!force && Date.now() - updAt < 60000) || navigator.onLine === false) return null;
  updBusy = true; updAt = Date.now();
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const tm = setTimeout(() => ctl && ctl.abort(), 9000);
  let found = null;
  try {
    // ?upd=время — чтобы не получить старую копию из кэша браузера, GitHub Pages или офлайн-копии
    const r = await fetch(location.pathname + '?upd=' + Date.now(), { cache: 'no-store', headers: { Range: 'bytes=0-4095' }, signal: ctl ? ctl.signal : undefined });
    let txt = '';
    if (r.body && r.body.getReader && typeof TextDecoder === 'function') {
      const rd = r.body.getReader(), dec = new TextDecoder();
      while (txt.length < 16384) {
        const x = await rd.read();
        if (x.done) break;
        txt += dec.decode(x.value, { stream: true });
        if (/name="app-build" content="[^"]*"/.test(txt)) break;
      }
      try { rd.cancel(); } catch (e) { /* уже закрыт */ }
    } else txt = (await r.text()).slice(0, 16384);
    const m = (r.ok || r.status === 206) && txt.match(/name="app-build" content="([^"]+)"/);
    if (m && m[1] !== BUILD && m[1] !== 'dev') { found = updNew = m[1]; updTick(); }
  } catch (e) { /* нет связи — проверим в следующий раз */ }
  clearTimeout(tm); updBusy = false;
  return found;
}

function updTick() {
  if (!updNew || updGoing) return;
  const tried = updGet();
  // защита от петли: если уже дважды за 10 минут пытались обновиться до этой сборки — только плашка
  const looping = tried && tried.to === updNew && tried.n >= 2 && Date.now() - tried.at < 600000;
  if (isBusy() || looping) updBar(true); else updGo();
}

function updGo() {
  if (!updNew || updGoing) return;
  updGoing = true;
  clearTimeout(saveTimer);
  saveState();
  const tried = updGet();
  updPut({ to: updNew, at: Date.now(), n: tried && tried.to === updNew ? (tried.n || 0) + 1 : 1 });
  toast('Updating…', 2000);
  setTimeout(() => location.replace(location.pathname + '?v=' + encodeURIComponent(updNew) + location.hash), 600);
}

function updBar(on) {
  let el = document.getElementById('updbar');
  if (!on) { if (el) el.remove(); return; }
  if (el) return;
  el = document.createElement('div');
  el.id = 'updbar';
  el.setAttribute('role', 'status');
  el.innerHTML = '<span><b>New version available</b><small>Takes a couple of seconds</small></span>'
    + '<button type="button" class="btn" data-upd="go">Update</button>'
    + '<button type="button" class="x" data-upd="x" aria-label="Later">✕</button>';
  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-upd]');
    if (!b) return;
    if (b.dataset.upd === 'go') updGo(); else { el.remove(); updNew = null; }
  });
  document.body.appendChild(el);
}

$('#checkupd').addEventListener('click', async () => {
  if (!UPD_ON) { toast('Works on the website only'); return; }
  toast('Checking…', 1200);
  const f = await updCheck(true);
  if (!f) toast('This is the latest version');
});

// ---------- работа без интернета ----------
// sw.js хранит копию страницы; после первого открытия калькулятор запускается и без сети.
function swStart() {
  const note = $('#offline-note');
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  const show = () => { note.textContent = navigator.serviceWorker.controller ? 'Offline use: ready.' : ''; };
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(show).catch(() => { /* без офлайна тоже работает */ });
  navigator.serviceWorker.addEventListener('controllerchange', show);
  show();
}

// ---------- запуск ----------
function boot() {
  buildKeys();
  lcd.init($('#lcd'));
  const st = loadState();
  openApp(st && UI.apps[st.app] ? st.app : 'menu');
  layoutCalc();
  let rz = 0;
  const relayout = () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(layoutCalc); };
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', () => setTimeout(layoutCalc, 250));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutCalc);
  setInterval(() => { UI.blink = !UI.blink; if (UI.sawCursor && sheet.hidden) redraw(); }, 500);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') { clearTimeout(saveTimer); saveState(); } });
  window.addEventListener('pagehide', () => { clearTimeout(saveTimer); saveState(); });

  if (UPD_ON) {
    const was = updGet();
    if (was && was.to === BUILD) { updPut(null); setTimeout(() => toast('Updated'), 500); }
    // убираем ?v=… из адреса после обновления
    if (/[?&]v=/.test(location.search) && history.replaceState) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* не страшно */ } }
    setTimeout(() => updCheck(true), 1500);
    setInterval(() => { if (document.visibilityState === 'visible') updCheck(); }, 600000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') updCheck(true); });
    window.addEventListener('pageshow', (e) => { if (e.persisted) updCheck(true); });
    window.addEventListener('online', () => updCheck(true));
  }
  swStart();
}
boot();

// для проверок (tools/check.js и tests/)
window.__upd = { get build() { return BUILD; }, get on() { return UPD_ON; }, get found() { return updNew; }, check: () => updCheck(true), busy: isBusy };
window.__calc = {
  press, UI, S, mem, lcd,
  keys(list) { for (const id of String(list).trim().split(/\s+/)) if (id) press(id); },
  text() { redraw(); return lcd.log.slice(); },
  idle() { UI.lastKeyAt = 0; },
  wipe() { saveOff = true; clearTimeout(saveTimer); try { localStorage.clear(); } catch (e) { /* нет хранилища */ } }
};
})();
</script>
